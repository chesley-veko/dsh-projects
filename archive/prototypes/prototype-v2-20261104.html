<!DOCTYPE html>
<html lang="zh-CN" data-brand="deepseek">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<style>
  @font-face {
    font-family: "Inter Var";
    src: url("./fonts/InterVariable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Noto Serif Var";
    src: url("./fonts/NotoSerifVariable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono Var";
    src: url("./fonts/JetBrainsMonoVariable.ttf") format("truetype-variations");
    font-weight: 100 800;
    font-display: swap;
  }

  /* =========================================================
     设计令牌 —— 对齐 dsh-claude-style 的两张色卡
     ========================================================= */
  :root {
    --font-ui: "Inter Var", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-serif: "Noto Serif Var", "Songti SC", "Source Han Serif SC", Georgia, serif;
    --font-mono: "JetBrains Mono Var", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

    --r-1: 4px;
    --r-2: 8px;
    --r-3: 12px;
    --r-4: 16px;

    --dur-feedback: 120ms;
    --dur-surface: 150ms;
    --dur-open: 250ms;
    --dur-exit: 120ms;
    --ease-standard: ease;
    --ease-settle: cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* DeepSeek 色卡（默认） */
  html[data-brand="deepseek"] {
    --canvas: #13161d;
    --sidebar: #13161d;
    --surface-1: #1b1e26;
    --surface-2: #22252d;
    --surface-3: #2b2f37;
    --card: #1d2028;
    --overlay: #22252d;
    --inset: #0e1117;
    --plate: #2b2f37;

    --ink: #f4f9ff;
    --ink-2: #aeb5c4;
    --ink-3: #8a92a3;
    --ink-4: #676e7d;

    --border-1: #23262e;
    --border-2: #2c3038;
    --border-3: #3a3d46;
    --divider: rgba(251, 255, 255, 0.06);
    --hover-wash: rgba(251, 255, 255, 0.08);

    --accent: #4d6bfe;
    --accent-hover: #6a84ff;
    --accent-tint: #252f4c;

    --bubble: #262b36;
    --code-wash: rgba(251, 255, 255, 0.05);
    --code-ink: #eef1f8;

    --ok: #4fbf77;
    --warn: #e0a94a;
    --info: #6f9bff;
    --danger: #f0706a;
  }

  html[data-brand="claude"] .brand svg { color: var(--ink); }

  /* Claude 色卡 */
  html[data-brand="claude"] {
    --canvas: #191919;
    --sidebar: #1f1f1f;
    --surface-1: #212121;
    --surface-2: #282828;
    --surface-3: #323232;
    --card: #232323;
    --overlay: #282828;
    --inset: #141414;
    --plate: #323232;

    --ink: #fdfdfd;
    --ink-2: #beb6b8;
    --ink-3: #9c9395;
    --ink-4: #776f71;

    --border-1: rgba(255, 255, 255, 0.09);
    --border-2: rgba(255, 255, 255, 0.18);
    --border-3: rgba(255, 255, 255, 0.3);
    --divider: rgba(255, 255, 255, 0.06);
    --hover-wash: rgba(255, 255, 255, 0.08);

    --accent: #d97757;
    --accent-hover: #eb9170;
    --accent-tint: #48261b;

    --bubble: rgba(255, 255, 255, 0.06);
    --code-wash: rgba(255, 255, 255, 0.05);
    --code-ink: #e8a08a;

    --ok: #62b47e;
    --warn: #d9a95c;
    --info: #8ab4f8;
    --danger: #e5766b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 13.5px;
    line-height: 1.55;
    font-feature-settings: "cv05" 1, "ss03" 1;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.09);
    border-radius: 6px;
    border: 3px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); background-clip: content-box; }

  ::selection { background: rgba(77, 107, 254, 0.36); }

  .app {
    height: 100%;
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr) 420px;
  }

  /* =========================================================
     左栏
     ========================================================= */
  .side {
    background: var(--sidebar);
    border-right: 0.5px solid var(--divider);
    display: flex;
    flex-direction: column;
    min-height: 0;
    user-select: none;
  }

  .side-top {
    flex: 0 0 auto;
    padding: 14px 12px 6px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px 14px;
    font-size: 14.5px;
    letter-spacing: -0.01em;
    font-weight: 600;
  }
  .brand svg { color: var(--accent); flex: 0 0 auto; }
  .brand .wordmark { color: var(--ink); }
  .brand .badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #fff;
    background: var(--accent);
    padding: 2.5px 5px;
    border-radius: 3px;
    line-height: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 32px;
    padding: 0 8px;
    border-radius: var(--r-1);
    color: var(--ink-2);
    font-size: 13px;
    cursor: pointer;
    transition: background var(--dur-feedback) var(--ease-standard),
                color var(--dur-feedback) var(--ease-standard);
  }
  .nav-item:hover { background: var(--hover-wash); color: var(--ink); }
  .nav-item .ico {
    width: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    color: var(--ink-3);
  }
  .nav-item:hover .ico { color: var(--ink-2); }
  .nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .side-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 8px 8px;
  }

  .sec {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 12px 8px 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-4);
  }
  .sec .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec .acts { display: flex; gap: 0; flex: 0 0 auto; opacity: 0; transition: opacity var(--dur-feedback); }
  .sec:hover .acts, .sec:focus-within .acts { opacity: 1; }

  .iconbtn {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-1);
    color: var(--ink-3);
    flex: 0 0 auto;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .iconbtn:hover { background: var(--hover-wash); color: var(--ink); }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px;
    border-radius: var(--r-1);
    cursor: pointer;
    transition: background var(--dur-feedback) var(--ease-standard);
  }
  .row:hover { background: var(--hover-wash); }
  .row.on { background: var(--plate); }
  .row .avatar {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex: 0 0 auto;
  }
  .row .name {
    flex: 1; min-width: 0;
    font-size: 13px;
    color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row.on .name { color: var(--ink); }
  .row .tail { font-size: 11.5px; color: var(--ink-4); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .row .more {
    position: absolute;
    right: 5px;
    width: 20px; height: 20px;
    display: none;
    align-items: center; justify-content: center;
    border-radius: var(--r-1);
    color: var(--ink-2);
    background: var(--plate);
  }
  .row:hover .more { display: inline-flex; }
  .row:hover .tail { opacity: 0; }
  .row .unread { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

  .side-foot {
    flex: 0 0 auto;
    border-top: 0.5px solid var(--divider);
    padding: 8px;
  }

  /* =========================================================
     中栏
     ========================================================= */
  .center {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--canvas);
  }

  .center-head {
    flex: 0 0 auto;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 14px;
    border-bottom: 0.5px solid var(--divider);
  }
  .proj-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 28px;
    padding: 0 8px 0 6px;
    border-radius: var(--r-1);
    font-size: 13px;
    font-weight: 550;
    color: var(--ink);
    max-width: 280px;
    transition: background var(--dur-feedback);
  }
  .proj-chip:hover { background: var(--hover-wash); }
  .proj-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .head-btn {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-1);
    color: var(--ink-3);
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .head-btn:hover { background: var(--hover-wash); color: var(--ink); }
  .spacer { flex: 1; }

  .goal {
    font-size: 11.5px;
    color: var(--ink-4);
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stream {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px 28px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .turn-user {
    align-self: flex-end;
    max-width: min(600px, 84%);
    background: var(--bubble);
    border-radius: var(--r-3);
    padding: 10px 14px;
    font-size: 13.5px;
    line-height: 1.62;
    color: var(--ink);
  }

  .relay {
    align-self: center;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    color: var(--ink-4);
    cursor: pointer;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .relay:hover { background: var(--hover-wash); color: var(--ink-2); }
  .relay .dash { width: 22px; height: 0.5px; background: var(--border-2); }

  .turn-agent {
    max-width: min(700px, 92%);
    font-size: 13.5px;
    line-height: 1.68;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .turn-agent .txt { margin: 0; }
  .turn-agent .txt + .artifact { margin-top: 0; }

  .artifact {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface-1);
    border: 0.5px solid var(--border-1);
    border-radius: var(--r-2);
    padding: 10px 12px;
    max-width: 440px;
  }
  .artifact .lhs { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .artifact .thumb {
    width: 36px; height: 36px;
    border-radius: var(--r-1);
    background: var(--surface-3);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-2);
    flex: 0 0 auto;
  }
  .artifact .nm { font-size: 12.5px; font-weight: 550; color: var(--ink); }
  .artifact .sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }
  .artifact .play {
    flex: 0 0 auto;
    font-size: 11.5px;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--surface-3);
    color: var(--ink-2);
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .artifact .play:hover { background: var(--border-3); color: var(--ink); }

  .note-line {
    align-self: center;
    font-size: 11.5px;
    color: var(--ink-4);
  }

  code.inl {
    font-family: var(--font-mono);
    font-size: 0.86em;
    background: var(--code-wash);
    color: var(--code-ink);
    border-radius: 3px;
    padding: 1px 5px;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .ref {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: var(--font-mono);
    font-size: 0.84em;
    background: var(--accent-tint);
    color: var(--info);
    border-radius: 3px;
    padding: 1px 5px;
    vertical-align: 1px;
  }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 5px 0; }
  .typing i {
    width: 4.5px; height: 4.5px; border-radius: 50%;
    background: var(--ink-4);
    animation: breathe 1.3s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.16s; }
  .typing i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes breathe {
    0%, 65%, 100% { opacity: 0.3; }
    32% { opacity: 1; }
  }

  /* ---------- 输入区 ---------- */
  .dock {
    flex: 0 0 auto;
    position: relative;
    padding: 0 28px 16px;
    background: var(--canvas);
  }
  .dock::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: -32px;
    height: 32px;
    background: linear-gradient(to bottom, transparent, var(--canvas));
    pointer-events: none;
  }
  .dock-inner { display: flex; flex-direction: column; gap: 8px; }

  .tray {
    border: 0.5px solid var(--border-2);
    background: var(--surface-1);
    border-radius: var(--r-2);
    padding: 12px 14px;
    animation: rise var(--dur-surface) var(--ease-settle);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tray-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .tray-head .who {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--warn);
    min-width: 0;
  }
  .tray-head .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tray-head .fold {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--ink-4);
    flex: 0 0 auto;
    padding: 2px 6px;
    border-radius: var(--r-1);
  }
  .tray-head .fold:hover { background: var(--hover-wash); color: var(--ink-2); }
  .tray-q {
    font-size: 13px;
    line-height: 1.62;
    color: var(--ink);
    margin-bottom: 11px;
  }
  .tray-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .tray-opt {
    font-size: 12px;
    padding: 5px 11px;
    border-radius: var(--r-1);
    background: var(--surface-2);
    border: 0.5px solid var(--border-2);
    color: var(--ink-2);
    text-align: left;
    transition: background var(--dur-feedback), border-color var(--dur-feedback), color var(--dur-feedback);
  }
  .tray-opt:hover { background: var(--surface-3); border-color: var(--border-3); color: var(--ink); }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    background: transparent;
    border: 0.5px solid var(--border-2);
    color: var(--ink-3);
    font-size: 11.5px;
    white-space: nowrap;
    transition: background var(--dur-feedback), color var(--dur-feedback), border-color var(--dur-feedback);
  }
  .pill:hover { background: var(--hover-wash); color: var(--ink); border-color: var(--border-3); }
  .pill.alert { border-color: transparent; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .pill.alert:hover { background: color-mix(in srgb, var(--warn) 24%, transparent); }
  .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill .n { font-variant-numeric: tabular-nums; }

  .composer {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface-1);
    border: 0.5px solid var(--border-2);
    border-radius: var(--r-3);
    padding: 8px 8px 8px 10px;
    transition: border-color var(--dur-feedback) var(--ease-standard),
                box-shadow var(--dur-feedback) var(--ease-standard);
  }
  .composer:focus-within {
    border-color: var(--border-3);
    box-shadow: 0 0 0 3px var(--hover-wash);
  }
  .composer .plus {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-1);
    color: var(--ink-3);
    flex: 0 0 auto;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .composer .plus:hover { background: var(--hover-wash); color: var(--ink); }
  .composer textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    max-height: 140px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
    padding: 4px 0;
    font-family: var(--font-ui);
  }
  .composer textarea::placeholder { color: var(--ink-4); }
  .composer .rhs { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .composer .model { font-size: 11.5px; color: var(--ink-4); white-space: nowrap; }
  .send {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: var(--r-1);
    background: var(--accent);
    color: #fff;
    flex: 0 0 auto;
    transition: background var(--dur-feedback), opacity var(--dur-feedback);
  }
  .send:hover { background: var(--accent-hover); }
  .send:disabled { background: var(--surface-3); color: var(--ink-4); cursor: default; }

  .dock-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    color: var(--ink-4);
    padding: 0 2px;
  }
  .dock-foot .env { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .dock-foot .env:hover { color: var(--ink-2); }

  /* =========================================================
     右栏（内缩卡片）
     ========================================================= */
  .right-col {
    background: var(--canvas);
    padding: 8px 8px 8px 0;
    display: flex;
    min-height: 0;
  }
  .right-card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 0.5px solid var(--border-1);
    border-radius: var(--r-3);
    overflow: hidden;
  }

  .right-head {
    flex: 0 0 auto;
    height: 42px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px 0 12px;
  }
  .right-head .title {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    min-width: 0;
  }
  .right-head .title .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .seg {
    display: inline-flex;
    align-items: center;
    gap: 1px;
    padding: 2px;
    border-radius: var(--r-1);
    background: var(--surface-1);
    border: 0.5px solid var(--border-1);
    flex: 0 0 auto;
  }
  .seg button {
    height: 22px;
    padding: 0 9px;
    border-radius: 3px;
    font-size: 11.5px;
    color: var(--ink-3);
    white-space: nowrap;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--plate); color: var(--ink); font-weight: 550; }

  .right-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 2px 8px 14px;
    display: flex;
    flex-direction: column;
  }

  .grp {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 8px;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-3);
    cursor: pointer;
    border-radius: var(--r-1);
    transition: background var(--dur-feedback);
  }
  .grp:hover { background: var(--hover-wash); }
  .grp .chev { width: 10px; display: inline-flex; justify-content: center; color: var(--ink-4); }

              ${st === 'waiting' ? '<span class="tag warn">待回答</span>' : ''}
            </div>` : ''}
          </div>`).join('')}
      </div>`;
    }).join('')}</div>`;
  }

  function libHTML(p) {
    const standing = p.library.filter((f) => ['index', 'decision', 'runbook', 'spec'].includes(f.scope));
    const arts = p.library.filter((f) => ['artifact', 'user'].includes(f.scope));

    const row = (f) => {
      const st = f.status;
      const tag = st === 'ratified' ? '<span class="tag ok">已确认</span>'
        : st === 'proposed' ? '<span class="tag warn">待确认</span>'
        : st === 'disputed' ? '<span class="tag" style="color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent);">有争议</span>'
        : '';
      return `<div class="lib" data-lib="${esc(f.path)}">
        <span class="p">${esc(f.path)}</span>
        ${tag}
        <span class="m">${esc(f.meta || '')}</span>
      </div>`;
    };

    return `
      <div class="grp" style="cursor:default;">
        <span class="chev">${I.chevD}</span>
        <span class="txt">上下文</span>
        <span class="count">${standing.length}</span>
      </div>
      ${standing.map(row).join('') || '<div class="empty" style="padding:24px;">—</div>'}
      <div class="grp" style="cursor:default;margin-top:8px;">
        <span class="chev">${I.chevD}</span>
        <span class="txt">文件</span>
        <span class="count">${arts.length}</span>
      </div>
      ${arts.map(row).join('') || '<div class="empty" style="padding:24px;">—</div>'}
    `;
  }

  function detailHTML(p, id) {
    const t = p.tasks.find((x) => x.id === id);
    if (!t) return `<div class="empty">—</div>`;
    const meta = ST[t.status];
    const prs = (t.prs || []).map((pr) =>
      `<span class="tag pr ${pr.state === 'merged' ? 'ok' : ''}">#${pr.num} ${pr.state === 'merged' ? 'merged' : 'open'}</span>`).join('');

    return `<div class="detail">
      <button class="back" data-a="back">${I.back} 列表</button>
      <div>
        <h2>${esc(t.title)}</h2>
        <div class="meta-row">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--info);">${t.id}</span>
          <span class="tag" style="color:${meta.color};background:color-mix(in srgb, ${meta.color} 14%, transparent);">${meta.label}</span>
          ${prs}
        </div>
      </div>
      <div class="body">${esc(t.desc || '')}</div>
      <dl class="kv">
        <dt>仓库</dt><dd>${esc(t.repo || '—')}</dd>
        <dt>Worker</dt><dd class="mono">${esc(t.worker || '—')}</dd>
        <dt>Worktree</dt><dd class="mono">${esc(t.worktree || '—')}</dd>
        <dt>模型</dt><dd>${esc(t.model || '—')}</dd>
      </dl>
      ${t.timeline && t.timeline.length ? `
        <div>
          <div class="tl-label">执行轨迹</div>
          <div class="tl">
            ${t.timeline.map((e) => `
              <div class="tl-i">
                <span class="tl-d ${e.tone || ''}"></span>
                <div>
                  <div class="tl-t">${esc(e.t)}</div>
                  <div class="tl-time">${esc(e.time)}</div>
                </div>
              </div>`).join('')}
          </div>
        </div>` : ''}
      <div class="acts">
        <button class="btn primary" data-a="open-worker">打开会话</button>
        ${t.status !== 'done' ? `<button class="btn" data-a="mark-done" data-task="${t.id}">标记完成</button>` : ''}
        ${t.status === 'working' ? `<button class="btn" data-a="stop-task" data-task="${t.id}">停止</button>` : ''}
        ${t.status === 'done' ? `<button class="btn" data-a="reopen" data-task="${t.id}">重新打开</button>` : ''}
      </div>
    </div>`;
  }

  function render() {
    renderSide();
    renderCenter();
    renderRight();
  }

  /* ---------- 动作 ---------- */
  function selectProject(id) {
    if (S.active === id) return;
    S.active = id;
    S.detail = null;
    S.pane = 'list';
    S.tray = false;
    const p = proj();
    p.unread = false;
    render();
  }

  function setPane(pane) {
    S.pane = pane;
    S.detail = null;
    render();
  }

  function answerQ(idx, q) {
    const p = proj();
    const t = p.tasks.find((x) => x.id === q.from);
    if (!t) return;
    S.answered[t.id] = true;
    S.tray = false;
    const text = q.options[idx];
    p.messages.push({ kind: 'user', text, time: '刚刚' });
    p.messages.push({ kind: 'relay', text: `${q.from} · 1 条` });
    t.status = 'working';
    t.timeline.push({ t: `已收到答复：${text}`, time: '刚刚', tone: 'work' });
    delete t.question;
    render();
    setTimeout(() => {
      p.messages.push({
        kind: 'agent',
        text: `收到，已经转给 <code class="inl">${esc(q.worker)}</code>，按「${esc(text)}」继续。`
      });
      render();
    }, 700);
  }

  function send() {
    const el = $('#input');
    if (!el) return;
    const text = el.value.trim();
    if (!text || S.typing) return;
    const p = proj();
    p.messages.push({ kind: 'user', text, time: '刚刚' });
    el.value = '';
    grow(el);
    S.typing = true;
    render();

    setTimeout(() => {
      S.typing = false;
      const r = reply(text, p);
      p.messages.push(...r.messages);
      if (r.tasks && r.tasks.length) {
        r.tasks.forEach((t) => {
          p.tasks.unshift(t);
          p.nextSeq = Math.max(p.nextSeq, parseInt(t.id.split('-')[1], 10) + 1);
        });
        p.messages.push({ kind: 'note', text: `新建 ${r.tasks.length} 个任务` });
      }
      render();
    }, 850);
  }

  function reply(text, p) {
    const pre = p.id === 'youshi-product' ? 'YOU' : p.id === 'bzti' ? 'BZT' : 'NAT';
    const n = p.nextSeq;

    if (/拆|分成|几个|并行|三块/.test(text)) {
      const titles = ['抽离合盘状态源', '单人盘入口回归', '迁移脚本与数据校验'];
      return {
        messages: [{
          kind: 'agent',
          text: `拆成 3 个。<code class="inl">${pre}-${n}</code> 先跑，摸清状态源之后另外两个再动，避免同时改同一处。`
        }],
        tasks: titles.map((t, i) => ({
          id: `${pre}-${n + i}`, title: t, status: i === 0 ? 'working' : 'queued',
          repo: p.repos[i % p.repos.length], desc: t,
          worker: i === 0 ? 'worker-' + Math.random().toString(16).slice(2, 6) : '',
          worktree: i === 0 ? `agent/${pre.toLowerCase()}-${n + i}` : '',
          model: 'Gemini 4 Argon', prs: [],
          timeline: i === 0 ? [{ t: '已拉起 worktree，开始读代码', time: '刚刚', tone: 'work' }] : []
        }))
      };
    }

    if (/上线|发布|deploy|生产/i.test(text)) {
      return {
        messages: [{
          kind: 'agent',
          text: '发布分两步：先确认 staging 的 <code class="inl">f31489d</code> 冒烟通过，再滚动到生产。这一步派 worker 去做，做完把健康检查结果贴回来。'
        }],
        tasks: [{
          id: `${pre}-${n}`, title: '生产发布 f31489d', status: 'queued',
          repo: p.repos[p.repos.length - 1], desc: '滚动发布 f31489d 到生产，带健康检查与回滚预案。',
          worker: '', worktree: '', model: 'Gemini 4 Argon', prs: [], timeline: []
        }]
      };
    }

    if (/测试|回归|验证/.test(text)) {
      return {
        messages: [{
          kind: 'agent',
          text: '回归用 Playwright 跑三档视口，Chromium 和 WebKit 各一遍。跑完把录屏和失败截图放进 Library。'
        }],
        tasks: []
      };
    }

    return {
      messages: [{
        kind: 'agent',
        text: `先看一下 <code class="inl">${esc(p.repos[0] || '仓库')}</code> 里相关的部分，需要动手就拆成任务派下去。`
      }],
      tasks: []
    };
  }

  function grow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  /* ---------- 输入框 ---------- */
  function bindComposer(p) {
    const input = $('#input');
    const btn = $('#sendBtn');
    if (!input) return;

    input.addEventListener('input', () => {
      grow(input);
      const caret = input.selectionStart;
      const m = /@([A-Za-z0-9-]*)$/.exec(input.value.slice(0, caret));
      if (m) renderMention(p, input, m[1].toLowerCase());
      else closeMention();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && S.mention) { closeMention(); return; }
      if (e.key === 'Enter' && !e.shiftKey && !$('#mentionBox')) {
        e.preventDefault();
        send();
      }
    });

    btn.addEventListener('click', send);
  }

  function renderMention(p, input, q) {
    closeMention();
    const list = p.tasks.filter((t) => !q || (t.id + ' ' + t.title).toLowerCase().includes(q));
    if (!list.length) return;

    const box = document.createElement('div');
    box.className = 'mention';
    box.id = 'mentionBox';
    box.innerHTML = `<div class="mh">任务</div>` + list.map((t, i) => `
      <button data-mention="${t.id}" class="${i === 0 ? 'sel' : ''}">
        <span class="mid">${t.id}</span>
        <span class="mtt">${esc(t.title)}</span>
      </button>`).join('');

    input.closest('.composer').appendChild(box);
    box.querySelectorAll('[data-mention]').forEach((b) => {
      b.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const caret = input.selectionStart;
        const before = input.value.slice(0, caret).replace(/@([A-Za-z0-9-]*)$/, '@' + b.dataset.mention + ' ');
        input.value = before + input.value.slice(caret);
        input.selectionStart = input.selectionEnd = before.length;
        closeMention();
        input.focus();
        grow(input);
      });
    });
  }

  function closeMention() {
    const b = $('#mentionBox');
    if (b) b.remove();
  }

  /* ---------- 弹窗 ---------- */
  const ICONS = [
    { c: '☺', t: 'blue' }, { c: '◈', t: 'pink' }, { c: '◆', t: 'purple' },
    { c: '✦', t: 'amber' }, { c: '▣', t: 'green' }, { c: '⬡', t: 'blue' }
  ];
  const REPOS = ['youshi-web', 'youshi-api', 'bzti-docs', 'native-shell', 'openhanako'];

  function newProject() {
    const pick = { icon: 0, repos: [0] };
    const layer = document.createElement('div');
    layer.className = 'overlay';
    layer.id = 'overlay';
    layer.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-label="新建项目">
        <div class="modal-head"><h3>新建项目</h3><button class="x" data-close aria-label="关闭">${I.x}</button></div>
        <div class="modal-body">
          <div class="field">
            <label>图标</label>
            <div class="icons">
              ${ICONS.map((o, i) => `<button data-icon="${i}" class="${i === 0 ? 'on' : ''}" aria-label="图标 ${i + 1}"><span class="avatar tone-${o.t}" style="width:22px;height:22px;font-size:12px;">${o.c}</span></button>`).join('')}
            </div>
          </div>
          <div class="field">
            <label>名称</label>
            <input type="text" id="pName" placeholder="合盘体验统一" autofocus>
          </div>
          <div class="field">
            <label>目标</label>
            <input type="text" id="pGoal" placeholder="一句话">
          </div>
          <div class="field">
            <label>仓库</label>
            <div class="repos">
              ${REPOS.map((r, i) => `<div class="repo ${i === 0 ? 'on' : ''}" data-repo="${i}">
                <span class="box">${I.check}</span>
                <span class="rn">${r}</span>
                <span class="rt">${i < 2 ? '本地' : '远端'}</span>
              </div>`).join('')}
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" data-close>取消</button>
          <button class="btn primary" id="pCreate">创建</button>
        </div>
      </div>`;
    $('#layers').appendChild(layer);

    layer.querySelectorAll('[data-icon]').forEach((b) => b.addEventListener('click', () => {
      layer.querySelectorAll('[data-icon]').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      pick.icon = +b.dataset.icon;
    }));
    layer.querySelectorAll('[data-repo]').forEach((b) => b.addEventListener('click', () => {
      b.classList.toggle('on');
      const i = +b.dataset.repo;
      pick.repos = pick.repos.includes(i) ? pick.repos.filter((x) => x !== i) : [...pick.repos, i];
    }));
    layer.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeOverlay));
    layer.addEventListener('click', (e) => { if (e.target === layer) closeOverlay(); });

    $('#pCreate').addEventListener('click', () => {
      const name = ($('#pName').value || '').trim() || '新项目';
      const goal = ($('#pGoal').value || '').trim();
      const o = ICONS[pick.icon];
      const repos = pick.repos.map((i) => REPOS[i]);
      const id = 'p' + Date.now();
      DB.projects.unshift({
        id, name, icon: o.c, tone: o.t, goal, repos,
        time: '刚刚', unread: false, status: 'active', nextSeq: 1,
        tasks: [],
        library: [{ path: 'INDEX.md', scope: 'index', status: 'proposed', meta: '草稿' }],
        messages: [{ kind: 'agent', text: `项目建好了${repos.length ? `，已关联 ${repos.map((r) => `<code class="inl">${esc(r)}</code>`).join('、')}` : ''}。说要做什么就行。` }]
      });
      closeOverlay();
      S.active = id; S.pane = 'list'; S.detail = null;
      render();
      toast('已创建');
    });

    setTimeout(() => $('#pName') && $('#pName').focus(), 60);
  }

  function closeOverlay() {
    const o = $('#overlay');
    if (o) o.remove();
  }

  /* ---------- 菜单 ---------- */
  function openMenu(anchor, items, opts) {
    closeMenu();
    const r = anchor.getBoundingClientRect();
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.id = 'popMenu';
    menu.innerHTML = items.map((it) => it.sep
      ? '<div class="sep"></div>'
      : `<button data-mi="${it.id}" class="${it.danger ? 'danger' : ''}"><span class="mi">${it.icon || ''}</span>${esc(it.label)}</button>`
    ).join('');
    document.body.appendChild(menu);

    const w = menu.offsetWidth, h = menu.offsetHeight;
    let left = opts && opts.right ? r.right - w : r.left;
    let top = r.bottom + 4;
    if (left + w > innerWidth - 8) left = innerWidth - w - 8;
    if (left < 8) left = 8;
    if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';

    menu.querySelectorAll('[data-mi]').forEach((b) => b.addEventListener('click', () => {
      const id = b.dataset.mi;
      closeMenu();
      if (opts && opts.pick) opts.pick(id);
    }));
  }

  function closeMenu() {
    const m = $('#popMenu');
    if (m) m.remove();
  }

  function projectMenu(anchor, id) {
    const p = DB.projects.find((x) => x.id === id);
    openMenu(anchor, [
      { id: 'settings', label: '项目设置', icon: I.gear },
      { id: 'index', label: '编辑 INDEX.md', icon: I.pencil },
      { sep: true },
      { id: p.status === 'paused' ? 'resume' : 'pause', label: p.status === 'paused' ? '恢复' : '暂停', icon: p.status === 'paused' ? I.play : I.pause },
      { id: 'archive', label: '归档', icon: I.archive },
      { sep: true },
      { id: 'delete', label: '删除', danger: true, icon: I.trash }
    ], { right: true, pick: (a) => onProjectAction(id, a) });
  }

  function onProjectAction(id, a) {
    const p = DB.projects.find((x) => x.id === id);
    if (!p) return;
    if (a === 'pause') { p.status = 'paused'; render(); toast('已暂停'); return; }
    if (a === 'resume') { p.status = 'active'; render(); toast('已恢复'); return; }
    if (a === 'archive') {
      p.status = 'archived';
      if (S.active === id) S.active = (DB.projects.find((x) => x.status !== 'archived') || DB.projects[0]).id;
      render(); toast('已归档'); return;
    }
    if (a === 'delete') { confirmDelete(p); return; }
    if (a === 'index') { S.pane = 'library'; S.detail = null; render(); return; }
    if (a === 'settings') { toast('项目设置'); return; }
  }

  function confirmDelete(p) {
    const layer = document.createElement('div');
    layer.className = 'overlay';
    layer.id = 'overlay';
    layer.innerHTML = `
      <div class="modal" style="width:min(380px,100%);" role="dialog" aria-modal="true">
        <div class="modal-head"><h3>删除「${esc(p.name)}」</h3><button class="x" data-close aria-label="关闭">${I.x}</button></div>
        <div class="modal-body">
          <div style="font-size:12.5px;line-height:1.65;color:var(--ink-2);">
            会删掉任务记录、Library 文件与受管的本地 worktree。已经推到 GitHub 的分支和 PR 不受影响。
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" data-close>取消</button>
          <button class="btn danger" id="delBtn">删除</button>
        </div>
      </div>`;
    $('#layers').appendChild(layer);
    layer.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeOverlay));
    layer.addEventListener('click', (e) => { if (e.target === layer) closeOverlay(); });
    $('#delBtn').addEventListener('click', () => {
      const i = DB.projects.findIndex((x) => x.id === p.id);
      if (i >= 0) DB.projects.splice(i, 1);
      if (S.active === p.id) S.active = DB.projects[0].id;
      closeOverlay(); render(); toast('已删除');
    });
  }

  function addToProject(wsId) {
    const ws = DB.workspaces.find((w) => w.id === wsId);
    const layer = document.createElement('div');
    layer.className = 'overlay';
    layer.id = 'overlay';
    layer.innerHTML = `
      <div class="modal" style="width:min(400px,100%);" role="dialog" aria-modal="true">
        <div class="modal-head"><h3>把「${esc(ws.name)}」加入项目</h3><button class="x" data-close aria-label="关闭">${I.x}</button></div>
        <div class="modal-body">
          <div class="repos">
            ${DB.projects.filter((p) => p.status === 'active').map((p) => `
              <div class="repo" data-target="${p.id}" style="height:36px;">
                <span class="avatar tone-${p.tone}" style="width:18px;height:18px;font-size:10px;">${p.icon}</span>
                <span style="font-family:var(--font-ui);font-size:12.5px;">${esc(p.name)}</span>
                <span class="rt">${p.tasks.length}</span>
              </div>`).join('')}
          </div>
        </div>
        <div class="modal-foot"><button class="btn" data-close>取消</button></div>
      </div>`;
    $('#layers').appendChild(layer);
    layer.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeOverlay));
    layer.addEventListener('click', (e) => { if (e.target === layer) closeOverlay(); });
    layer.querySelectorAll('[data-target]').forEach((r) => r.addEventListener('click', () => {
      const p = DB.projects.find((x) => x.id === r.dataset.target);
      closeOverlay();
      if (!p) return;
      const pre = p.id === 'youshi-product' ? 'YOU' : p.id === 'bzti' ? 'BZT' : 'NAT';
      p.messages.push({ kind: 'agent', text: `读完了「${esc(ws.name)}」。整理出两条可以进 <code class="inl">INDEX.md</code> 的结论，另外有一个可以立刻开工的任务。` });
      p.tasks.unshift({
        id: `${pre}-${p.nextSeq++}`, title: `跟进「${ws.name}」的遗留问题`, status: 'queued',
        repo: p.repos[0] || '', desc: '从收编的会话里提取。', worker: '', worktree: '',
        model: 'Gemini 4 Argon', prs: [], timeline: []
      });
      S.active = p.id; render(); toast('已加入');
    }));
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target;

    if (!t.closest('#popMenu') && !t.closest('[data-projmenu]') && !t.closest('[data-wsmenu]')) closeMenu();
    if (!t.closest('.composer')) closeMention();

    const pm = t.closest('[data-projmenu]');
    if (pm) { e.stopPropagation(); projectMenu(pm, pm.dataset.projmenu); return; }

    const wm = t.closest('[data-wsmenu]');
    if (wm) {
      e.stopPropagation();
      openMenu(wm, [
        { id: 'add', label: '加入项目…', icon: I.folder },
        { id: 'new', label: '新建会话', icon: I.plus },
        { sep: true },
        { id: 'rename', label: '重命名', icon: I.pencil }
      ], { pick: (a) => { if (a === 'add') addToProject(wm.dataset.wsmenu); else toast('—'); } });
      return;
    }

    const pr = t.closest('[data-proj]');
    if (pr && !t.closest('.more')) { selectProject(pr.dataset.proj); return; }

    const a = t.closest('[data-a]');
    if (a) {
      const k = a.dataset.a;
      if (k === 'new-project') { newProject(); return; }
      if (k === 'project-menu') { projectMenu(a, S.active); return; }
      if (k === 'toggle-archived') { S.showArchived = !S.showArchived; render(); return; }
      if (k === 'new-task') { const i = $('#input'); if (i) { i.focus(); } return; }
      if (k === 'tray') { S.tray = !S.tray; render(); return; }
      if (k === 'agents') { setPane('list'); return; }
      if (k === 'listening') { toast('GitHub PR · main CI'); return; }
      if (k === 'env') { toast('本机 Worktree'); return; }
      if (k === 'back') { S.detail = null; render(); return; }
      if (k === 'open-worker') { toast('打开 Worker 会话'); return; }
      if (k === 'play') { toast('播放录屏'); return; }
      if (k === 'attach') { toast('附件'); return; }
      if (k === 'filter') { toast('筛选'); return; }
      if (k === 'relay') { toast('展开 Worker 进度'); return; }
      if (k === 'collapse') {
        const key = a.dataset.key;
        S.collapsed[key] = !S.collapsed[key];
        render(); return;
      }
      if (k === 'mark-done' || k === 'reopen' || k === 'stop-task') {
        const task = proj().tasks.find((x) => x.id === a.dataset.task);
        if (task) {
          if (k === 'mark-done') { task.status = 'done'; task.timeline.push({ t: '人工标记完成', time: '刚刚', tone: 'ok' }); }
          if (k === 'reopen') task.status = 'working';
          if (k === 'stop-task') { task.status = 'queued'; task.timeline.push({ t: '人工停止', time: '刚刚', tone: 'warn' }); }
        }
        render(); return;
      }
      return;
    }

    const ans = t.closest('[data-ans]');
    if (ans) { const q = pendingQ(proj()); if (q) answerQ(+ans.dataset.ans, q); return; }

    const pane = t.closest('[data-pane]');
    if (pane) { setPane(pane.dataset.pane); return; }

    const task = t.closest('[data-task]');
    if (task) { S.detail = task.dataset.task; render(); return; }

    const lib = t.closest('[data-lib]');
    if (lib) { toast(lib.dataset.lib); return; }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('#overlay')) { closeOverlay(); return; }
    if ($('#popMenu')) { closeMenu(); return; }
    if ($('#mentionBox')) { closeMention(); return; }
  });

  /* ---------- 启动 ---------- */
  const params = new URLSearchParams(location.search);
  if (params.get('brand') === 'claude') document.documentElement.dataset.brand = 'claude';

  const h = (location.hash || '').replace(/^#/, '');
  if (h === 'board') S.pane = 'board';
  else if (h === 'library') S.pane = 'library';
  else if (h === 'tray') S.tray = true;
  else if (h.startsWith('detail=')) S.detail = decodeURIComponent(h.slice(7));
  else if (h.startsWith('project=')) S.active = decodeURIComponent(h.slice(8));

  render();
  if (h === 'new') newProject();
})();
</script>
</body>
</html>
