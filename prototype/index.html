<!DOCTYPE html>
<html lang="zh-CN" data-brand="deepseek">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<style>
  @font-face {
    font-family: "Inter Var";
    src: url("./fonts/InterVariable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Noto Serif Var";
    src: url("./fonts/NotoSerifVariable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono Var";
    src: url("./fonts/JetBrainsMonoVariable.ttf") format("truetype-variations");
    font-weight: 100 800;
    font-display: swap;
  }

  /* =========================================================
     令牌：对齐 dsh-claude-style 的两张色卡与动效曲线
     ========================================================= */
  :root {
    --font-ui: "Inter Var", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-serif: "Noto Serif Var", "Songti SC", "Source Han Serif SC", Georgia, serif;
    --font-mono: "JetBrains Mono Var", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

    --r-xs: 4px;
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 10px;
    --r-xl: 12px;

    --dur-instant: 80ms;
    --dur-feedback: 120ms;
    --dur-surface: 150ms;
    --dur-open: 250ms;
    --dur-exit: 120ms;
    --dur-slide: 240ms;

    --ease-standard: ease;
    --ease-settle: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
    --ease-glide: cubic-bezier(0.22, 0.61, 0.36, 1);
    --ease-damped: cubic-bezier(0.32, 0, 0.67, 0);

    --shadow-pop: 0 14px 36px rgba(0, 0, 0, 0.38), 0 2px 6px rgba(0, 0, 0, 0.18);
    --shadow-modal: 0 24px 72px rgba(0, 0, 0, 0.52), 0 2px 8px rgba(0, 0, 0, 0.22);

    --sidebar-w: 272px;
    --right-w: 540px;
  }

  /* DeepSeek 色卡（默认） */
  html[data-brand="deepseek"] {
    --canvas: #13161d;
    --sidebar: #13161d;
    --surface-1: #1b1e26;
    --surface-2: #22252d;
    --surface-3: #2b2f37;
    --card: #1d2028;
    --overlay: #22252d;
    --inset: #0e1117;
    --plate: #2b2f37;

    --ink: #f4f9ff;
    --ink-2: #aeb5c4;
    --ink-3: #8a92a3;
    --ink-4: #676e7d;
    --prose: #dce3ee;

    --border-1: #23262e;
    --border-2: #2c3038;
    --border-3: #3a3d46;
    --divider: rgba(251, 255, 255, 0.06);
    --hover-wash: rgba(251, 255, 255, 0.055);
    --row-active: rgba(251, 255, 255, 0.07);

    --accent: #4d6bfe;
    --accent-hover: #6a84ff;
    --accent-tint: #252f4c;
    --on-accent: #ffffff;

    --bubble: #262b36;
    --code-wash: rgba(251, 255, 255, 0.05);
    --code-ink: #eef1f8;
    --link: #8fa4ff;

    --ok: #65b57f;
    --warn: #e0b168;
    --info: #9bb0ff;
    --danger: #f0706a;

    --tone-blue: #7f9dff;
    --tone-pink: #e39bbd;
    --tone-purple: #b39cf6;
    --tone-amber: #dcb073;
    --tone-green: #7cc495;
  }

  /* Claude 色卡 */
  html[data-brand="claude"] {
    --canvas: #191919;
    --sidebar: #1f1f1f;
    --surface-1: #212121;
    --surface-2: #282828;
    --surface-3: #323232;
    --card: #232323;
    --overlay: #282828;
    --inset: #141414;
    --plate: #323232;

    --ink: #fdfdfd;
    --ink-2: #beb6b8;
    --ink-3: #9c9395;
    --ink-4: #776f71;
    --prose: #e7e2e3;

    --border-1: rgba(255, 255, 255, 0.09);
    --border-2: rgba(255, 255, 255, 0.18);
    --border-3: rgba(255, 255, 255, 0.3);
    --divider: rgba(255, 255, 255, 0.06);
    --hover-wash: rgba(255, 255, 255, 0.07);
    --row-active: rgba(255, 255, 255, 0.08);

    --accent: #d97757;
    --accent-hover: #eb9170;
    --accent-tint: #48261b;
    --on-accent: #ffffff;

    --bubble: rgba(255, 255, 255, 0.06);
    --code-wash: rgba(255, 255, 255, 0.05);
    --code-ink: #e8a08a;
    --link: #8ab4f8;

    --ok: #62b47e;
    --warn: #d9a95c;
    --info: #8ab4f8;
    --danger: #e5766b;

    --tone-blue: #8ab4f8;
    --tone-pink: #e3a0b8;
    --tone-purple: #c0a6f0;
    --tone-amber: #dfb27a;
    --tone-green: #8cc7a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.55;
    letter-spacing: -0.002em;
    font-feature-settings: "cv05" 1, "ss03" 1;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button, [role="button"] { -webkit-tap-highlight-color: transparent; }
  svg { flex: 0 0 auto; }

  ::selection { background: color-mix(in srgb, var(--accent) 34%, transparent); color: var(--ink); }

  :focus-visible {
    outline: 2px solid color-mix(in srgb, var(--accent) 66%, var(--ink) 12%);
    outline-offset: 1px;
  }
  .composer textarea:focus-visible,
  .side-search input:focus-visible,
  .tray-custom input:focus-visible,
  .field input[type="text"]:focus-visible {
    outline: none;
  }
  .side-search:focus-within {
    border-color: color-mix(in srgb, var(--accent) 38%, var(--border-2));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: transparent;
    border: 3px solid transparent;
    background-clip: content-box;
    border-radius: 8px;
  }
  *:hover::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.18); background-clip: content-box; }

  .hidden { display: none !important; }

  .tone-blue { --tone: var(--tone-blue); }
  .tone-pink { --tone: var(--tone-pink); }
  .tone-purple { --tone: var(--tone-purple); }
  .tone-amber { --tone: var(--tone-amber); }
  .tone-green { --tone: var(--tone-green); }

  /* =========================================================
     骨架
     ========================================================= */
  .app {
    height: 100%;
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--right-w);
    overflow: hidden;
    transition: grid-template-columns var(--dur-open) var(--ease-settle);
  }
  .app.right-closed { grid-template-columns: var(--sidebar-w) minmax(0, 1fr) 0px; }
  .app.right-closed .right-col {
    border-left-color: transparent;
    opacity: 0;
    pointer-events: none;
  }

  /* =========================================================
     左栏
     ========================================================= */
  .side {
    background: var(--sidebar);
    border-right: 1px solid var(--divider);
    display: flex;
    flex-direction: column;
    min-height: 0;
    user-select: none;
  }

  .side-top { flex: 0 0 auto; padding: 8px 8px 0; }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    padding: 0 8px;
    border-radius: var(--r-sm);
  }
  .brand .mark {
    width: 20px;
    height: 20px;
    display: inline-flex;
    color: var(--ink);
  }
  html[data-brand="deepseek"] .brand .mark { color: var(--accent); }
  .brand .wordmark {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.018em;
    color: var(--ink);
  }
  .brand .toggle {
    margin-left: auto;
    opacity: 0.45;
  }
  .brand:hover .toggle, .brand .toggle:focus-visible { opacity: 1; }

  .nav { display: flex; flex-direction: column; gap: 1px; padding-top: 6px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 30px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    color: var(--ink-2);
    font-size: 13px;
    cursor: pointer;
    transition: background var(--dur-feedback) var(--ease-standard),
                color var(--dur-feedback) var(--ease-standard);
  }
  .nav-item:hover { background: var(--hover-wash); color: var(--ink); }
  .nav-item .ico {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    transition: color var(--dur-feedback);
  }
  .nav-item:hover .ico { color: var(--ink-2); }
  .nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .kbd {
    font-size: 10px;
    color: var(--ink-4);
    border: 1px solid var(--border-1);
    border-radius: var(--r-xs);
    padding: 0 4px;
    line-height: 15px;
    opacity: 0;
    transition: opacity var(--dur-feedback);
  }
  .nav-item:hover .kbd { opacity: 1; }

  .side-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 8px 12px;
  }

  .sec {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 28px;
    margin-top: 14px;
    padding: 0 8px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink-4);
  }
  .sec .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec .acts { display: flex; gap: 1px; opacity: 0.55; transition: opacity var(--dur-feedback); }
  .sec:hover .acts, .sec:focus-within .acts { opacity: 1; }

  .iconbtn {
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-sm);
    color: var(--ink-3);
    transition: background var(--dur-feedback) var(--ease-standard),
                color var(--dur-feedback) var(--ease-standard),
                transform var(--dur-instant) var(--ease-standard);
  }
  .iconbtn:hover { background: var(--hover-wash); color: var(--ink); }
  .iconbtn:active { transform: scale(0.94); }
  .iconbtn.on { color: var(--accent); }
  .iconbtn.sm { width: 22px; height: 22px; }
  .iconbtn.attention { color: var(--warn); }

  .side-search {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    margin: 4px 0 6px;
    padding: 0 7px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-sm);
    animation: rise var(--dur-surface) var(--ease-settle);
  }
  .side-search .si { color: var(--ink-4); display: inline-flex; }
  .side-search input { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink); }
  .side-search input::placeholder { color: var(--ink-4); }
  .side-search .esc {
    font-size: 9.5px;
    color: var(--ink-4);
    border: 1px solid var(--border-1);
    border-radius: 3px;
    padding: 0 4px;
    line-height: 15px;
  }
  .side-empty {
    padding: 14px 8px;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-4);
  }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--dur-feedback) var(--ease-standard);
  }
  .row:hover { background: var(--hover-wash); }
  .row.on { background: var(--row-active); }
  .row:focus-visible { outline-offset: -2px; }

  .row .glyph {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1;
    color: var(--tone, var(--ink-3));
    background: color-mix(in srgb, var(--tone, var(--ink-3)) 16%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tone, var(--ink-3)) 22%, transparent);
  }
  .row.on .glyph {
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tone, var(--ink-3)) 38%, transparent);
  }
  .row .name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color var(--dur-feedback);
  }
  .row.on .name { color: var(--ink); font-weight: 500; }
  .row:hover .name { color: var(--ink); }
  .row .tail {
    font-size: 11px;
    color: var(--ink-4);
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
    transition: opacity var(--dur-feedback);
  }
  .row .unread {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex: 0 0 auto;
  }
  .row .paused { color: var(--ink-4); display: inline-flex; }
  .row .more {
    position: absolute;
    right: 5px;
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-xs);
    color: var(--ink-2);
    opacity: 0;
    transition: opacity var(--dur-feedback), background var(--dur-feedback);
  }
  .row:hover .more, .row .more:focus-visible { opacity: 1; }
  .row .more:hover { background: var(--surface-3); color: var(--ink); }
  .row:hover .tail { opacity: 0; }

  .row .folder { width: 16px; display: inline-flex; justify-content: center; color: var(--ink-4); }
  .row:hover .folder { color: var(--ink-3); }

  .row.archived { opacity: 0.5; }
  .archive-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 26px;
    margin-top: 4px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    font-size: 11.5px;
    color: var(--ink-4);
    cursor: pointer;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .archive-toggle:hover { background: var(--hover-wash); color: var(--ink-2); }

  .side-foot {
    flex: 0 0 auto;
    border-top: 1px solid var(--divider);
    padding: 7px 8px;
  }
  .account {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--dur-feedback);
  }
  .account:hover { background: var(--hover-wash); }
  .account .ava {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 9.5px;
    font-weight: 650;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #8ab4f8));
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
  }
  .account .name { flex: 1; font-size: 12.5px; color: var(--ink-2); }
  .account .gear { opacity: 0.4; transition: opacity var(--dur-feedback); }
  .account:hover .gear { opacity: 1; }

  /* =========================================================
     中栏
     ========================================================= */
  .center {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--canvas);
  }

  .center-head {
    flex: 0 0 auto;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px 0 20px;
    border-bottom: 1px solid var(--divider);
    position: relative;
    z-index: 6;
  }
  .head-title {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .head-title .glyph {
    width: 19px;
    height: 19px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--tone, var(--ink-3));
    background: color-mix(in srgb, var(--tone, var(--ink-3)) 14%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tone, var(--ink-3)) 22%, transparent);
  }
  .pname {
    max-width: 340px;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.006em;
    color: var(--ink);
    white-space: nowrap;
  }
  .goal {
    font-size: 12px;
    color: var(--ink-4);
    padding-left: 10px;
    border-left: 1px solid var(--divider);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 340px;
  }
  .head-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .attention-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 9px;
    margin-right: 4px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--warn) 26%, transparent);
    background: color-mix(in srgb, var(--warn) 8%, transparent);
    color: var(--warn);
    font-size: 11.5px;
    transition: background var(--dur-feedback), border-color var(--dur-feedback);
  }
  .attention-chip:hover { background: color-mix(in srgb, var(--warn) 14%, transparent); border-color: color-mix(in srgb, var(--warn) 38%, transparent); }
  .attention-chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .stream {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 24px;
  }
  .stream-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px 0 12px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .stream-inner.hero-mode {
    min-height: 100%;
    justify-content: center;
    padding-bottom: 44px;
  }
  .stream-inner.hero-mode .hero { padding-top: 0; }
  .jump {
    position: absolute;
    right: 22px;
    bottom: 130px;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    color: var(--ink-2);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
    z-index: 5;
    animation: rise var(--dur-surface) var(--ease-settle);
    transition: background var(--dur-feedback), color var(--dur-feedback), transform var(--dur-feedback);
  }
  .jump:hover { background: var(--surface-3); color: var(--ink); transform: translateY(1px); }
  .jump[hidden] { display: none; }

  .stream-shade {
    position: absolute;
    left: 0;
    right: 0;
    top: 52px;
    height: 30px;
    background: linear-gradient(to bottom, var(--canvas) 18%, transparent);
    opacity: 0;
    pointer-events: none;
    z-index: 2;
    transition: opacity var(--dur-surface) var(--ease-standard);
  }
  .center.scrolled .stream-shade { opacity: 1; }

  /* 消息 */
  .msg { display: flex; flex-direction: column; min-width: 0; }
  .msg.agent { position: relative; }
  .msg.user { align-items: flex-end; gap: 3px; }
  .msg.user .bubble {
    max-width: min(560px, 82%);
    background: var(--bubble);
    border-radius: 16px;
    padding: 9px 14px;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .msg.user .attachments { margin-top: 5px; justify-content: flex-end; }
  .msg-foot {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 20px;
    font-size: 11px;
    color: var(--ink-4);
  }
  .msg.user .msg-foot { padding-right: 2px; }
  .msg.agent .msg-foot {
    position: absolute;
    right: 0;
    bottom: -20px;
    height: 18px;
    opacity: 0;
    transition: opacity var(--dur-feedback);
    z-index: 1;
  }
  .msg.agent:hover .msg-foot, .msg.agent:focus-within .msg-foot { opacity: 1; }
  .msg.agent:hover { z-index: 2; }
  .msg-act {
    width: 22px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-xs);
    color: var(--ink-4);
    opacity: 0;
    transition: opacity var(--dur-feedback), background var(--dur-feedback), color var(--dur-feedback);
  }
  .msg:hover .msg-act { opacity: 0.75; }
  .msg-act:hover { opacity: 1; background: var(--hover-wash); color: var(--ink-2); }

  .msg.agent .txt {
    font-size: 14.5px;
    line-height: 1.74;
    color: var(--prose);
    overflow-wrap: anywhere;
  }
  .msg.agent .txt + .artifact { margin-top: 10px; }

  .msg.enter { animation: msgIn var(--dur-open) var(--ease-settle); }
  .stream-inner.swap { animation: swapIn 180ms var(--ease-settle); }
  @keyframes swapIn {
    from { opacity: 0.35; transform: translateY(3px); }

  }
  @keyframes msgIn {

  .relay {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 26px;
    margin: -3px 0;

  }
  .relay .label {

  }

  .relay .line { flex: 1; height: 1px; background: var(--divider); }
  .relay .chev { opacity: 0; transition: opacity var(--dur-feedback); }
  .relay:hover .label, .relay:hover .chev { color: var(--ink-2); opacity: 0.7; }
  .relay:focus-visible { outline-offset: 2px; }

  .artifact {
    display: flex;
    align-items: center;
    gap: 11px;
    width: min(440px, 100%);
    padding: 8px;
    background: var(--surface-1);

    border-radius: var(--r-md);

    transition: background var(--dur-feedback), border-color var(--dur-feedback);
  }
  .artifact:hover { background: var(--surface-2); border-color: var(--border-2); }
  .artifact .thumb {

    display: grid;
    place-items: center;
    color: #dfe6ff;

      radial-gradient(120% 120% at 20% 10%, rgba(255, 255, 255, 0.14), transparent 50%),
      linear-gradient(135deg, #2b3350, #191d29);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.08);
  }
  html[data-brand="claude"] .artifact .thumb {
    background:
      radial-gradient(120% 120% at 20% 10%, rgba(255, 255, 255, 0.12), transparent 50%),
      linear-gradient(135deg, #4a2d25, #241b18);
  }
  .artifact .thumb .play {
    width: 22px;
    height: 22px;
    border-radius: 50%;

    place-items: center;
    background: rgba(255, 255, 255, 0.16);

    transition: transform var(--dur-feedback) var(--ease-spring), background var(--dur-feedback);
  }
  .artifact:hover .thumb .play { transform: scale(1.08); background: rgba(255, 255, 255, 0.22); }
  .artifact .thumb .dur {
    position: absolute;
    right: 4px;
    bottom: 3px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.78);
    font-variant-numeric: tabular-nums;
  }
  .artifact .meta { min-width: 0; }
  .artifact .meta .nm {
    font-size: 12.5px;
    font-weight: 550;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .artifact .meta .sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }
  .artifact .open {
    margin-left: auto;
    padding: 3px 8px;
    border-radius: var(--r-xs);
    background: var(--surface-2);
    font-size: 11.5px;
    color: var(--ink-3);
    opacity: 0;
    transition: opacity var(--dur-feedback), background var(--dur-feedback), color var(--dur-feedback);
  }
  .artifact:hover .open { opacity: 1; background: var(--surface-3); color: var(--ink); }

  code.inl {
    font-family: var(--font-mono);
    font-size: 0.86em;
    background: var(--code-wash);
    color: var(--code-ink);
    border-radius: var(--r-xs);

  .ref {

  .attachments { display: flex; flex-wrap: wrap; gap: 5px; }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 5px 0 7px;
    border-radius: var(--r-xs);

    color: var(--ink-2);

  }
  .attach-chip .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .rm {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border-radius: 3px;
    color: var(--ink-4);
  }
  .attach-chip .rm:hover { background: var(--hover-wash); color: var(--ink); }

  /* 空态与首屏 */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 9vh 4px 0;
    max-width: 560px;
  }
  .hero .kicker { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-4); }
  .hero h1 {
    font-family: var(--font-serif);
    font-size: 26px;

    font-weight: 500;
    letter-spacing: -0.01em;

  }
  .hero p { font-size: 13px; line-height: 1.7; color: var(--ink-3); max-width: 460px; }
  .hero .p-icon { margin-bottom: 4px; }
  .hero-sugs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .sug {
    height: 30px;
    padding: 0 11px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border-1);
    background: var(--surface-1);

    color: var(--ink-2);
    transition: background var(--dur-feedback), border-color var(--dur-feedback), color var(--dur-feedback);
  }
  .sug:hover { background: var(--surface-2); border-color: var(--border-2); color: var(--ink); }

  /* =========================================================
     输入区
     ========================================================= */
  .dock {
    flex: 0 0 auto;
    position: relative;
    padding: 0 24px 14px;
    background: var(--canvas);
    z-index: 4;
  }
  .dock::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: -42px;
    height: 42px;
    background: linear-gradient(to bottom, transparent, var(--canvas) 72%);
    pointer-events: none;
  }
  .dock-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; }

  .pills { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 22px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    border: 1px solid var(--border-1);
    background: transparent;
    color: var(--ink-3);
    font-size: 11.5px;
    white-space: nowrap;
    transition: background var(--dur-feedback), border-color var(--dur-feedback), color var(--dur-feedback);
  }
  .pill:hover { background: var(--surface-1); border-color: var(--border-2); color: var(--ink-2); }
  .pill .n { font-size: 11px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
  .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill .live { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
  .pill.alert {
    color: var(--warn);
    border-color: color-mix(in srgb, var(--warn) 28%, transparent);
    background: color-mix(in srgb, var(--warn) 7%, transparent);
  }
  .pill.alert:hover { background: color-mix(in srgb, var(--warn) 13%, transparent); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .pill.alert .dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 12%, transparent); }

  .tray {
    margin-bottom: 10px;
    padding: 12px 14px;
    border: 1px solid color-mix(in srgb, var(--warn) 24%, var(--border-1));
    background: linear-gradient(180deg, color-mix(in srgb, var(--warn) 7%, var(--surface-1)), var(--surface-1));
    border-radius: var(--r-lg);
    animation: rise var(--dur-open) var(--ease-settle);
  }
  .tray-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; font-size: 11.5px; color: var(--warn); }
  .tray-head .who { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; min-width: 0; }
  .tray-head .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tray-head .from { margin-left: auto; color: var(--ink-4); font-size: 11px; white-space: nowrap; }
  .tray-q {
    max-width: 640px;
    margin: 0 2px 10px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--prose);
  }
  .tray-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .tray-opt {
    height: 27px;
    padding: 0 10px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    font-size: 12px;
    color: var(--ink-2);
    text-align: left;
    transition: background var(--dur-feedback), border-color var(--dur-feedback), color var(--dur-feedback);
  }
  .tray-opt:hover { background: var(--surface-3); border-color: var(--border-3); color: var(--ink); }
  .tray-custom { display: flex; gap: 6px; margin-top: 8px; }
  .tray-custom input {
    flex: 1;
    height: 28px;
    padding: 0 9px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-sm);
    font-size: 12px;
    color: var(--ink);
    transition: border-color var(--dur-feedback);
  }
  .tray-custom input::placeholder { color: var(--ink-4); }
  .tray-custom input:focus { border-color: var(--border-3); }
  .tray-custom .btn { height: 28px; }

  .composer {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    padding: 7px 8px 6px;
    transition: border-color var(--dur-surface) var(--ease-standard),
                box-shadow var(--dur-surface) var(--ease-standard),
                background var(--dur-surface) var(--ease-standard);
  }
  .composer:focus-within {
    border-color: color-mix(in srgb, var(--accent) 30%, var(--border-2));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 9%, transparent);
  }
  .composer-row { display: flex; align-items: flex-end; gap: 6px; }
  .composer textarea {
    flex: 1;
    padding-left: 3px;
    min-width: 0;
    min-height: 26px;
    max-height: 160px;
    resize: none;
    font-family: var(--font-ui);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
    padding: 4px 2px 2px;
  }
  .composer textarea::placeholder { color: var(--ink-4); }
  .composer .attachments { margin: 1px 2px 6px; }
  .composer .send {
    width: 26px;
    height: 26px;
    margin-left: 2px;
    margin-bottom: 1px;
    border-radius: var(--r-sm);
    display: grid;
    place-items: center;
    background: var(--accent);
    color: var(--on-accent);
    transition: background var(--dur-feedback), color var(--dur-feedback), transform var(--dur-instant), opacity var(--dur-feedback);
  }
  .composer .send:hover { background: var(--accent-hover); }
  .composer .send:active { transform: scale(0.92); }
  .composer .send:disabled {
    background: transparent;
    color: var(--ink-4);
    box-shadow: inset 0 0 0 1px var(--border-1);
    cursor: default;
    opacity: 0.8;
  }

  .dock-foot {
    display: flex;
    align-items: center;
    height: 20px;
    margin-top: 5px;
    padding: 0 2px;
  }
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 20px;
    padding: 0 4px;
    border-radius: var(--r-xs);
    font-size: 12px;
    color: var(--ink-4);
    transition: color var(--dur-feedback), background var(--dur-feedback);
  }
  .status-chip:hover { color: var(--ink-2); background: var(--hover-wash); }
  .status-chip .chev { opacity: 0.6; }
  .status-chip.model { color: var(--ink-3); max-width: 240px; }
  .status-chip.model span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot-spacer { flex: 1; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 0; }
  .typing i {
    width: 4.5px;
    height: 4.5px;
    border-radius: 50%;
    background: var(--ink-4);
    animation: breathe 1.3s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.16s; }
  .typing i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes breathe {
    0%, 65%, 100% { opacity: 0.3; }
    32% { opacity: 1; }
  }

  /* @ 引用 */
  .mention {
    position: absolute;
    left: 0;
    right: auto;
    width: min(440px, 100%);
    bottom: calc(100% + 6px);
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    padding: 4px;
    max-height: 236px;
    overflow-y: auto;
    z-index: 40;
    animation: menuIn var(--dur-surface) var(--ease-settle);
  }
  .mention .mh {
    display: flex;
    align-items: center;
    padding: 5px 8px 6px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-4);
  }
  .mention .mh .n { margin-left: auto; font-weight: 500; }
  .mrow {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 30px;
    padding: 0 8px;
    border-radius: var(--r-xs);
    font-size: 12.5px;
    color: var(--ink-2);
    text-align: left;
  }
  .mrow:hover { background: var(--hover-wash); color: var(--ink); }
  .mrow.sel { background: var(--surface-2); color: var(--ink); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--accent) 72%, transparent); }
  .mrow .mid { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); width: 39px; }
  .mrow .mtt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .mdot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto; }

  /* =========================================================
     右栏
     ========================================================= */
  .right-col {
    position: relative;
    display: flex;
    background: color-mix(in srgb, var(--surface-1) 24%, var(--canvas));
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border-left: 1px solid var(--divider);
    background: var(--canvas);
    transition: opacity var(--dur-surface) var(--ease-standard);
  }
  .pane-resizer {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 7px;
    z-index: 15;
    cursor: col-resize;
    outline: none;
    user-select: none;
  }
  .pane-resizer::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background: transparent;
    transition: background var(--dur-feedback);
  }
  .pane-resizer:hover::after, .pane-resizer.dragging::after, .pane-resizer:focus-visible::after {
    background: color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .right-closed .pane-resizer { display: none; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing .app { transition: none; }

  .right-panel { display: flex; flex-direction: column; width: 100%; min-width: 0; }
  .right-head {
    flex: 0 0 auto;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px 0 14px;

    width: 18px;
    height: 18px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--tone, var(--ink-3));
    background: color-mix(in srgb, var(--tone, var(--ink-3)) 14%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tone, var(--ink-3)) 22%, transparent);
  }
  .r-title .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
  .right-head .spacer { flex: 1; }
  .right-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 8px 24px;
  }
  .right-body > .empty { min-height: calc(100vh - 170px); justify-content: center; }

  .seg {
    display: inline-flex;
    align-items: center;
    gap: 1px;
    padding: 2px;
    border-radius: 7px;
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    flex: 0 0 auto;
  }
  .seg button {
    height: 22px;
    padding: 0 8px;
    border-radius: 5px;
    font-size: 11.5px;
    color: var(--ink-3);
    white-space: nowrap;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on {
    background: var(--surface-3);
    color: var(--ink);
    font-weight: 500;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.18);
  }

  .overview {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 8px;
    font-size: 11px;
    color: var(--ink-4);
    border-bottom: 1px solid transparent;

  .overview .sep { width: 1px; height: 10px; background: var(--divider); }
  .overview .bar {
    width: 52px;
    height: 3px;
    border-radius: 2px;
    background: var(--surface-2);
    overflow: hidden;
    margin-left: auto;
  }
  .overview .bar i { display: block; height: 100%; border-radius: 2px; background: var(--ink-4); }
  .overview .pct { font-variant-numeric: tabular-nums; }

  .grp {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    margin-top: 5px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    background: color-mix(in srgb, var(--surface-1) 24%, var(--canvas));
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-3);
    cursor: pointer;
    user-select: none;
  }
  .grp:hover { background: var(--hover-wash); }
  .grp .chev { width: 10px; display: grid; place-items: center; color: var(--ink-4); }
  .grp .dot { width: 5px; height: 5px; border-radius: 50%; }
  .grp .txt { flex: 1; min-width: 0; }
  .grp .count { font-weight: 500; color: var(--ink-4); font-variant-numeric: tabular-nums; }

  .grp.static:hover { background: transparent; }

  .task {
    display: grid;
    grid-template-columns: 43px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    height: 31px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--dur-feedback);
  }
  .task:hover { background: var(--hover-wash); }
  .task.sel { background: var(--surface-2); }
  .task:focus-visible { outline-offset: -2px; }
  .task .id {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-4);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .task .ttl {
    font-size: 12.5px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color var(--dur-feedback);
  }
  .task:hover .ttl, .task.sel .ttl { color: var(--ink); }
  .task .end { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }

  .tag {
    display: inline-flex;
    align-items: center;
    height: 17px;
    padding: 0 5px;

    font-size: 9.5px;

    background: var(--surface-2);

  .tag.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
  .tag.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  /* 看板 */
  .board { display: flex; flex-direction: column; gap: 18px; padding: 10px 0 0; }
  .lane { display: flex; flex-direction: column; gap: 6px; }
  .lane-h {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 24px;
    padding: 0 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-3);
  }
  .lane-h .dot { width: 5px; height: 5px; border-radius: 50%; }
  .lane-h .count { margin-left: auto; color: var(--ink-4); font-weight: 500; font-variant-numeric: tabular-nums; }
  .bcard {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 10px 11px;
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-feedback), border-color var(--dur-feedback);
  }
  .bcard:hover { background: var(--surface-2); border-color: var(--border-2); }
  .bcard .bid { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }
  .bcard .bttl { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
  .bcard:hover .bttl { color: var(--ink); }
  .bcard .bottom { display: flex; flex-wrap: wrap; gap: 4px; }

  /* Library */
  .lib-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 31px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--dur-feedback);
  }
  .lib-row:hover { background: var(--hover-wash); }
  .lib-row .ficon { width: 16px; display: grid; place-items: center; color: var(--ink-4); }
  .lib-row .p {
    flex: 1;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lib-row:hover .p { color: var(--ink); }
  .lib-row .m { font-size: 10px; color: var(--ink-4); white-space: nowrap; flex: 0 0 auto; font-variant-numeric: tabular-nums; }

  /* 任务详情 */
  .detail { display: flex; flex-direction: column; gap: 13px; padding: 10px 8px 8px; animation: panelIn var(--dur-surface) var(--ease-settle); }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    align-self: flex-start;
    height: 24px;
    margin-left: -6px;
    padding: 0 6px;
    border-radius: var(--r-xs);
    font-size: 11.5px;
    color: var(--ink-4);
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .back:hover { background: var(--hover-wash); color: var(--ink-2); }
  .d-kicker { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); }
  .d-kicker .st {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-ui);
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 999px;
    color: var(--st, var(--ink-3));
    background: color-mix(in srgb, var(--st, var(--ink-3)) 12%, transparent);
  }
  .d-kicker .st i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .detail h2 {
    font-size: 15px;
    line-height: 1.45;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-top: -2px;
  }
  .d-desc { font-size: 12.5px; line-height: 1.66; color: var(--ink-2); }

  .meta-card {
    display: flex;
    flex-direction: column;
    padding: 4px 10px;
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
  }
  .meta-row { display: flex; align-items: center; gap: 8px; min-height: 27px; font-size: 11.5px; }
  .meta-row + .meta-row { border-top: 1px solid var(--divider); }
  .meta-row .k { width: 52px; flex: 0 0 auto; color: var(--ink-4); }
  .meta-row .v { flex: 1; min-width: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .meta-row .v.mono { font-family: var(--font-mono); font-size: 10.5px; }

  .question-card {
    padding: 10px 12px;
    border-radius: var(--r-md);
    border: 1px solid color-mix(in srgb, var(--warn) 22%, var(--border-1));
    background: color-mix(in srgb, var(--warn) 6%, var(--surface-1));
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-2);
  }
  .question-card .qk {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 5px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--warn);
  }

  .tl-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; color: var(--ink-4); margin-bottom: 9px; }
  .tl { display: flex; flex-direction: column; }
  .tl-i { display: grid; grid-template-columns: 11px minmax(0, 1fr); gap: 9px; padding-bottom: 12px; position: relative; }
  .tl-i:last-child { padding-bottom: 0; }
  .tl-i:not(:last-child)::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 12px;
    bottom: 2px;
    width: 1px;
    background: var(--divider);
  }
  .tl-d { width: 5px; height: 5px; border-radius: 50%; margin-top: 5px; background: var(--border-3); z-index: 1; }
  .tl-d.ok { background: var(--ok); }
  .tl-d.warn { background: var(--warn); }
  .tl-d.work { background: var(--info); }
  .tl-t { font-size: 12px; line-height: 1.55; color: var(--ink-2); }
  .tl-time { font-size: 10.5px; color: var(--ink-4); margin-top: 1px; }

  .log {
    max-height: 188px;
    overflow: auto;
    padding: 10px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.8;
    color: var(--ink-3);
    animation: rise var(--dur-surface) var(--ease-settle);
  }
  .log .lt { color: var(--ink-4); margin-right: 7px; }
  .log .ok { color: var(--ok); }
  .log .warn { color: var(--warn); }

  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 28px;
    padding: 0 10px;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: 12px;
    white-space: nowrap;
    transition: background var(--dur-feedback), color var(--dur-feedback), border-color var(--dur-feedback);
  }
  .btn:hover { background: var(--surface-3); color: var(--ink); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { background: transparent; border-color: var(--border-1); color: var(--ink-3); }
  .btn.ghost:hover { background: var(--hover-wash); border-color: var(--border-2); color: var(--ink); }
  .btn.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 11%, transparent); }
  .btn.danger:hover { background: color-mix(in srgb, var(--danger) 18%, transparent); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:disabled:hover { background: var(--surface-2); color: var(--ink-2); }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 52px 24px; text-align: center; color: var(--ink-4); font-size: 12px; }
  .empty .e-ico {
    width: 36px;
    height: 36px;
    border-radius: var(--r-lg);
    display: grid;
    place-items: center;
    color: var(--ink-3);
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    margin-bottom: 2px;
  }
  .empty .h { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .empty p { font-size: 11.5px; line-height: 1.6; max-width: 236px; }
  .empty .btn { margin-top: 4px; }

  /* =========================================================
     Peek 与浮层
     ========================================================= */
  .peek {
    position: fixed;
    right: 12px;
    top: 62px;
    width: min(360px, calc(100vw - 24px));
    max-height: calc(100vh - 76px);
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border-2);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-pop);
    z-index: 120;
    overflow: hidden;
    animation: peekIn var(--dur-slide) var(--ease-settle);
  }
  @keyframes peekIn {
    from { opacity: 0; transform: translateX(10px) scale(0.995); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  .peek-head { display: flex; align-items: center; gap: 8px; padding: 13px 13px 0; }
  .peek-head .st {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 10.5px;
    color: var(--st, var(--ink-3));
    background: color-mix(in srgb, var(--st, var(--ink-3)) 12%, transparent);
  }
  .peek-head .st i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .peek-head .pid { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); }
  .peek-head .x { margin-left: auto; }
  .peek-body { padding: 10px 14px 13px; overflow-y: auto; }
  .peek h3 { font-size: 14.5px; line-height: 1.45; font-weight: 600; letter-spacing: -0.008em; color: var(--ink); }
  .peek .desc { margin-top: 7px; font-size: 12.5px; line-height: 1.62; color: var(--ink-2); }
  .peek .meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 9px; font-size: 11px; color: var(--ink-4); }
  .peek .meta .mono { font-family: var(--font-mono); font-size: 10px; }
  .peek .tl-label { margin-top: 14px; }
  .peek-foot { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--divider); background: color-mix(in srgb, var(--surface-1) 55%, transparent); }
  .peek-foot .spacer { flex: 1; }

  .floating {
    position: fixed;
    z-index: 130;
    min-width: 180px;
    max-width: 320px;
    padding: 4px;
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    animation: menuIn var(--dur-surface) var(--ease-settle);
  }
  .floating.pop { min-width: 280px; padding: 6px; }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-3px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 29px;
    padding: 0 8px;
    border-radius: var(--r-xs);
    font-size: 12.5px;
    color: var(--ink-2);
    text-align: left;
    white-space: nowrap;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .menu-item:hover { background: var(--hover-wash); color: var(--ink); }
  .menu-item .mi { width: 14px; display: grid; place-items: center; color: var(--ink-4); }
  .menu-item:hover .mi { color: var(--ink-3); }
  .menu-item.danger { color: var(--danger); }
  .menu-item.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .menu-item.danger .mi { color: var(--danger); }
  .menu-item .check { margin-left: auto; color: var(--accent); }
  .menu-sep { height: 1px; background: var(--divider); margin: 4px 6px; }
  .menu-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px 7px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-4);
  }
  .menu-head .n { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
  .pop-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    padding: 7px 8px;
    border-radius: var(--r-xs);
    text-align: left;
    transition: background var(--dur-feedback);
  }
  .pop-row:hover { background: var(--hover-wash); }
  .pop-row .pdot { width: 5px; height: 5px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; }
  .pop-row .ptxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pop-row .ptitle { display: block; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop-row:hover .ptitle { color: var(--ink); }
  .pop-row .psub { display: block; font-size: 10.5px; color: var(--ink-4); margin-top: 1px; }
  .pop-row .pid { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); flex: 0 0 auto; margin-top: 2px; }
  .pop-foot { border-top: 1px solid var(--divider); margin-top: 4px; padding: 4px 0 0; }
  .pop-empty { padding: 14px 8px; font-size: 11.5px; color: var(--ink-4); text-align: center; }

  /* =========================================================
     弹窗与表单
     ========================================================= */
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(5, 7, 11, 0.56);
    backdrop-filter: blur(1.5px);
    z-index: 200;
    animation: fade var(--dur-surface) var(--ease-standard);
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: min(480px, 100%);
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-modal);
    overflow: hidden;
    animation: modalIn var(--dur-open) var(--ease-settle);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(8px) scale(0.992); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal.sm { width: min(392px, 100%); }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
  .modal-head h3 { flex: 1; font-size: 14px; font-weight: 600; letter-spacing: -0.006em; }
  .modal-head .x { color: var(--ink-4); }
  .modal-head .x:hover { color: var(--ink); }
  .modal-body { padding: 8px 18px 18px; display: flex; flex-direction: column; gap: 13px; }
  .modal-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--divider);
    background: color-mix(in srgb, var(--surface-1) 45%, transparent);
  }
  .modal-foot .hint { margin-right: auto; font-size: 11px; color: var(--ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .field label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
  .field label .opt { font-weight: 400; color: var(--ink-4); }
  .field input[type="text"] {
    width: 100%;
    height: 32px;
    padding: 0 9px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-sm);
    font-size: 13px;
    color: var(--ink);
    transition: border-color var(--dur-feedback), box-shadow var(--dur-feedback);
  }
  .field input[type="text"]::placeholder { color: var(--ink-4); }
  .field input[type="text"]:focus {
    border-color: color-mix(in srgb, var(--accent) 34%, var(--border-2));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .field .hint { margin-top: 5px; font-size: 11px; color: var(--ink-4); }

  .icon-row { display: flex; gap: 7px; }
  .icon-opt {
    width: 31px;
    height: 31px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1.5px solid transparent;
    background: var(--surface-2);
    transition: border-color var(--dur-feedback), background var(--dur-feedback), transform var(--dur-feedback);
  }
  .icon-opt .glyph { width: 21px; height: 21px; border-radius: 6px; }
  .icon-opt:hover { background: var(--surface-3); }
  .icon-opt.on { border-color: var(--accent); background: var(--surface-1); }
  .icon-opt:active { transform: scale(0.94); }

  .repo-list { display: flex; flex-direction: column; gap: 1px; max-height: 188px; overflow-y: auto; }
  .repo {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 33px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    font-size: 12.5px;
    color: var(--ink-2);
    cursor: pointer;
    transition: background var(--dur-feedback);
  }
  .repo:hover { background: var(--hover-wash); }
  .repo .box {
    width: 14px;
    height: 14px;
    border-radius: var(--r-xs);
    border: 1.5px solid var(--border-3);
    display: grid;
    place-items: center;
    color: transparent;
    transition: background var(--dur-feedback), border-color var(--dur-feedback);
  }
  .repo.on .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .repo .rn { font-family: var(--font-mono); font-size: 11.5px; }
  .repo .rt { margin-left: auto; font-size: 10.5px; color: var(--ink-4); }

  .confirm-copy { font-size: 12.5px; line-height: 1.68; color: var(--ink-2); }
  .confirm-copy strong { color: var(--ink); font-weight: 550; }

  /* 文档预览 */
  .doc-head { display: flex; align-items: center; gap: 8px; padding: 16px 20px 10px; }
  .doc-head .path { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-body { max-height: min(58vh, 560px); overflow-y: auto; padding: 4px 20px 26px; }
  .doc-body.fade-bottom {
    mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent);
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent);
  }
  .doc-body h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.012em; margin: 6px 0 10px; }
  .doc-body h2 { font-size: 12.5px; font-weight: 600; color: var(--ink); margin: 16px 0 6px; }
  .doc-body p { font-size: 12.5px; line-height: 1.75; color: var(--ink-2); }
  .doc-body ul { margin: 4px 0 4px 18px; color: var(--ink-2); font-size: 12.5px; line-height: 1.75; }
  .doc-body li + li { margin-top: 2px; }
  .doc-body .front { padding: 8px 10px; background: var(--inset); border: 1px solid var(--border-1); border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-4); white-space: pre-wrap; margin-bottom: 12px; }
  .doc-body .doc-code { margin: 8px 0; padding: 10px 11px; background: var(--inset); border: 1px solid var(--border-1); border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 11px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; }
  .doc-body .doc-quote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--border-3); color: var(--ink-3); font-size: 12.5px; line-height: 1.7; }
  .doc-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--divider); background: color-mix(in srgb, var(--surface-1) 45%, transparent); }
  .doc-foot .spacer { flex: 1; }

  .stage {
    position: relative;
    aspect-ratio: 16 / 9;
    margin: 4px 0 0;
    border-radius: var(--r-md);
    overflow: hidden;
    background:
      radial-gradient(90% 90% at 70% 20%, rgba(126, 157, 255, 0.18), transparent 60%),
      linear-gradient(140deg, #232a3d, #13161d 70%);
    border: 1px solid var(--border-1);
    display: grid;
    place-items: center;
  }
  html[data-brand="claude"] .stage {
    background:
      radial-gradient(90% 90% at 70% 20%, rgba(217, 119, 87, 0.18), transparent 60%),
      linear-gradient(140deg, #36251f, #191919 70%);
  }
  .stage .big-play {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(6px);
    transition: transform var(--dur-feedback) var(--ease-spring), background var(--dur-feedback);
  }
  .stage .big-play:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.2); }
  .stage .tc { position: absolute; left: 12px; bottom: 10px; font-size: 10.5px; color: rgba(255, 255, 255, 0.7); font-variant-numeric: tabular-nums; }
  .stage .track { position: absolute; left: 12px; right: 12px; bottom: 30px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  .stage .track i { display: block; height: 100%; width: 34%; background: rgba(255, 255, 255, 0.7); border-radius: 2px; }

  .toast {
    position: fixed;
    top: 62px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    height: 32px;
    padding: 0 13px;
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    font-size: 12px;
    color: var(--ink);
    z-index: 300;
    animation: toastIn var(--dur-open) var(--ease-settle);
  }
  .toast .ti { color: var(--ok); display: inline-flex; }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, -4px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* =========================================================
     适配
     ========================================================= */
  @media (max-width: 1400px) {
    :root { --sidebar-w: 260px; --right-w: 480px; }
    .goal { max-width: 240px; }
  }
  @media (max-width: 1240px) {
    :root { --sidebar-w: 248px; --right-w: 440px; }

  @media (prefers-reduced-motion: reduce) {

  .note-line {

  .right-body.panel-in { animation: panelIn var(--dur-surface) var(--ease-settle); }
  .tasks { animation: panelIn var(--dur-surface) var(--ease-settle); }

  .modal.md { width: min(620px, 100%); }

  .kbd-list { display: flex; flex-direction: column; gap: 1px; }
  .kbd-row {

    align-items: center;
    height: 31px;
    padding: 0 4px;
    font-size: 12.5px;
    color: var(--ink-2);
  }

  .kbd-row .keys { margin-left: auto; display: flex; gap: 4px; }
  .kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    height: 20px;

  @media (max-width: 1120px) {

  /* 通用图标牌 */

  }

  .plugin-row {

  .stage.playing .big-play { opacity: 0; }


  /* =========================================================
     v4：对齐 Cursor Projects 的结构与密度
     ========================================================= */
  .center-head .goal { display: none; }
  .attention-chip { display: none; }
  .head-plus { opacity: 0.45; margin-left: -2px; }

  /* 右栏双行头 */

  /* 列表：状态图标 + 标题 + 描述 + PR 胶囊 */
  .grp { gap: 6px; }
  .grp .dot { display: none; }
  .grp .g-ico {
    width: 14px;

    place-items: center;
    color: var(--ink-4);
  }
  .task {
    display: grid;

    gap: 8px;
    height: auto;
    min-height: 38px;
    padding: 7px 8px;
  }
  .task .t-ico {
    width: 14px;
    height: 14px;
    margin-top: 2px;

    place-items: center;
    color: var(--ink-4);
  }
  .t-main { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

    text-overflow: ellipsis;

  }
  .t-desc {
    flex: 1;
    min-width: 0;

    text-overflow: ellipsis;
    white-space: nowrap;

  .pr-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 19px;
    padding: 0 7px;
    border: 1px solid var(--border-1);
    border-radius: 5px;
    font-size: 10.5px;
    color: var(--ink-2);
    white-space: nowrap;
    background: transparent;
  }
  .pr-pill svg { color: var(--info); }
  .pr-pill.merged { border-color: color-mix(in srgb, var(--ok) 26%, var(--border-1)); }
  .soft-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 19px;
    padding: 0 7px;
    border: 1px solid var(--border-1);
    border-radius: 5px;
    font-size: 10.5px;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .soft-badge i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); }

  /* 看板：双列泳道卡 */
  .board {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 8px;
    padding: 8px 0 0;
  }
  .lane {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 5px;
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);

  }
  .lane-h {
    height: 28px;
    padding: 0 4px;
    gap: 6px;
    font-size: 11px;
  }
  .lane-h .g-ico { width: 14px; display: grid; place-items: center; color: var(--ink-4); }
  .lane-h .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-h .count { margin-left: auto; }
  .lane-cards { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
  .bcard {
    gap: 5px;
    padding: 8px;
    background: var(--canvas);
    border: 1px solid var(--border-1);
    border-radius: 7px;
  }
  .b-top { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .bcard .bid { flex: 0 0 auto; font-size: 9.5px; }
  .bcard .bttl {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    color: var(--ink);
  }
  .bdesc {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-4);
  }
  .bcard .bottom { display: flex; flex-wrap: wrap; gap: 4px; }

  /* 文件：Recents + All Files */
  .lib-section { margin-top: 8px; }
  .lib-label {
    padding: 7px 8px 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);

  .recents-row {

    padding: 0 8px 8px;

  }

  .recent {
    flex: 0 0 104px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
    border-radius: var(--r-sm);
  }
  .r-frame {
    display: block;
    height: 76px;
    border-radius: var(--r-sm);

    border: 1px solid var(--border-1);
    background: var(--surface-1);
    transition: border-color var(--dur-feedback);
  }
  .recent:hover .r-frame { border-color: var(--border-2); }
  .r-thumb { display: block; position: relative; width: 100%; height: 100%; }
  .r-thumb.video {
    display: grid;
    place-items: center;
    background: linear-gradient(140deg, #2a2b32, #17181c 70%);
  }
  .r-play {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #ff4f6d;
    color: #fff;
    box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.14);
  }
  .r-dur {

    right: 5px;
    bottom: 4px;
    font-size: 9.5px;
    color: rgba(255, 255, 255, 0.72);

  .r-thumb.image {
    background:
      radial-gradient(46% 58% at 52% 64%, #d9cfc0 0%, transparent 65%),

  .r-side {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(24% 36% at 56% 52%, rgba(73, 94, 58, 0.75), transparent 70%),

    filter: blur(3px);

  .r-lines {
    position: absolute;
    left: 10px;
    right: 10px;
    top: 13px;

    border-radius: 1px;
  }
  .r-thumb.pdf {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    font-size: 9px;

  .r-name {
    padding-left: 1px;

  .tree { display: flex; flex-direction: column; padding: 0 2px; }

  .tree-row:focus-visible { outline-offset: -2px; }
  .tree-row .chev { width: 10px; display: grid; place-items: center; color: var(--ink-4); }
  .tree-row .t-ico { width: 14px; display: grid; place-items: center; color: var(--ink-4); }

  .tree-row.file:hover .t-name { color: var(--ink); }
  .tree-row .t-date { flex: 0 0 auto; font-size: 10.5px; color: var(--ink-4); }

  /* 中栏：Worked 日志 */

  .work-head {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
    height: 24px;
    padding: 0 2px;

  .wt .add { color: var(--ok); }

    display: flex;

  /* 输入框内模型选择 */

  .jump-pill {

    padding: 0;
    justify-content: center;

  .grp .chev { opacity: 0; transition: opacity var(--dur-feedback); }

  /* 左栏 Home 会话 */
  .row .sdot {
    width: 6px;
    height: 6px;
    margin: 0 4px;
    border-radius: 50%;
    flex: 0 0 auto;

  .row.sub .ssub-dot {
    width: 4px;
    height: 4px;
    margin: 0 6px;
    border-radius: 50%;

  /* 变更摘要卡 */
  .change-block { display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
  .changes {
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);

  }
  .changes-head {
    display: flex;
    align-items: center;
    height: 34px;

    border-bottom: 1px solid var(--divider);
    font-size: 12px;
    color: var(--ink-2);
  }
  .changes-head .ch-review { margin-left: auto; font-size: 11px; color: var(--ink-3); }
  .ch-row {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;

  .ch-add { color: var(--ok); font-variant-numeric: tabular-nums; }
  .changes-chips { display: flex; align-items: center; gap: 6px; }
  .diff-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--surface-2);
    font-size: 11px;
    color: var(--ink-3);
  }

  .ch-down {

  /* =========================================================
     v5：项目图标系统 / 状态选择 / 品牌色
     ========================================================= */
  .tint-gray { --tint: #9aa1ad; }
  .tint-red { --tint: #f0716f; }
  .tint-orange { --tint: #e2945f; }
  .tint-yellow { --tint: #d8b765; }
  .tint-green { --tint: #6fbf8c; }
  .tint-cyan { --tint: #63bcc9; }
  .tint-blue { --tint: #7f9dff; }
  .tint-purple { --tint: #b09bf4; }
  .tint-magenta { --tint: #dd8fc0; }

  .p-icon {
    --is: 22px;
    width: var(--is);
    height: var(--is);
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: calc(var(--is) * 0.3);
    color: color-mix(in srgb, var(--tint, #9aa1ad) 88%, var(--ink) 12%);
    background: color-mix(in srgb, var(--tint, #9aa1ad) 18%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tint, #9aa1ad) 28%, transparent);
  }
  .p-icon svg { width: calc(var(--is) * 0.7); height: calc(var(--is) * 0.7); }
  .p-icon.sm { --is: 24px; }
  .p-icon.xl { --is: 46px; border-radius: 13px; }
  .p-icon.lg { --is: 34px; border-radius: 10px; box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tint, #9aa1ad) 32%, transparent); }
  .p-icon.lg svg { width: calc(var(--is) * 0.58); height: calc(var(--is) * 0.58); }
  .row.on .p-icon { box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tint, #9aa1ad) 44%, transparent); }

  /* 项目新建 / 设置 */
  .project-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    transition: border-color var(--dur-feedback), box-shadow var(--dur-feedback);
  }
  .project-preview:focus-within {
    border-color: color-mix(in srgb, var(--accent) 34%, var(--border-2));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .project-preview input {
    flex: 1;
    min-width: 0;
    height: 32px;
    font-size: 15px;
    font-weight: 550;
    letter-spacing: -0.01em;
    color: var(--ink);
    background: none;
    border: 0;
    outline: none;
  }
  .project-preview input::placeholder { color: var(--ink-4); font-weight: 400; }

  .icon-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .icon-tile {
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    background: transparent;
    transition: background var(--dur-feedback), border-color var(--dur-feedback);
  }
  .icon-tile:hover { background: var(--hover-wash); }
  .icon-tile.on {
    background: var(--surface-2);
    border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .icon-tile:focus-visible { outline-offset: 0; }

  .color-row { display: flex; flex-wrap: wrap; gap: 9px; padding: 2px; }
  .color-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 0;
    background: var(--tint, #9aa1ad);
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
    transition: box-shadow var(--dur-feedback), transform var(--dur-feedback);
  }
  .color-dot:hover { transform: scale(1.08); }
  .color-dot.on {
    box-shadow: 0 0 0 2px var(--overlay), 0 0 0 3px var(--accent);
  }
  .color-dot:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--overlay), 0 0 0 3px var(--accent); }

  /* 可点击的状态图标 */
  .task { grid-template-columns: 20px minmax(0, 1fr); gap: 6px; }
  .task .t-ico {
    width: 20px;
    height: 20px;
    margin-top: -1px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: var(--r-xs);
    color: var(--ink-4);
    background: transparent;
    transition: color var(--dur-feedback), background var(--dur-feedback);
  }
  .task .t-ico:hover { color: var(--ink-2); background: var(--hover-wash); }
  .spin-icon { transform-origin: center; animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .menu-item .check { margin-left: auto; color: var(--accent); }
  .menu-item .mi svg { vertical-align: -2px; }

  /* Command palette */
  .palette-overlay {
    position: fixed;
    inset: 0;
    z-index: 260;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: max(10vh, 56px) 20px 20px;
    background: rgba(5, 7, 11, 0.44);
    backdrop-filter: blur(2px);
    animation: fade var(--dur-surface) var(--ease-standard);
  }
  .palette {
    width: min(580px, 100%);
    max-height: min(66vh, 600px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: 14px;
    box-shadow: var(--shadow-modal);
    animation: paletteIn 180ms var(--ease-settle);
  }
  @keyframes paletteIn {
    from { opacity: 0; transform: translateY(-6px) scale(0.995); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pal-head {
    display: flex;
    align-items: center;

    height: 52px;
    flex: 0 0 auto;
    padding: 0 14px;

  .pal-head input {

    min-width: 0;
    font-size: 14px;
    color: var(--ink);
    background: none;
    border: 0;
    outline: none;
  }

  .pal-head .pk {

  }
  .pal-list {

  }
  .pal-group {

    color: var(--ink-4);
  }
  .pal-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 8px;
    border-radius: var(--r-sm);
    text-align: left;
    transition: background var(--dur-feedback);
  }
  .pal-item:hover { background: var(--surface-2); }
  .pal-item.sel { background: var(--surface-3); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--accent) 70%, transparent); }
  .pal-icon {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    color: var(--ink-3);
  }
  .pal-icon svg { width: 15px; height: 15px; }
  .pal-icon .p-icon { --is: 18px; }
  .pal-svg { display: inline-flex; color: var(--ink-3); }
  .pal-svg svg { width: 14px; height: 14px; }
  .pal-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pal-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12.5px;
    color: var(--ink);
  }
  .pal-sub {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10.5px;
    color: var(--ink-4);
  }
  .pal-enter { opacity: 0; font-size: 11px; color: var(--ink-4); }
  .pal-item.sel .pal-enter { opacity: 1; }
  .pal-foot {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 0 0 auto;
    height: 34px;
    padding: 0 12px;
    border-top: 1px solid var(--divider);
    background: color-mix(in srgb, var(--surface-1) 45%, transparent);
    font-size: 10.5px;
    color: var(--ink-4);
  }
  .pal-foot .kbd { height: 18px; min-width: 18px; font-size: 10px; }
  .pal-empty { padding: 28px; text-align: center; color: var(--ink-4); font-size: 12px; }


  /* 行内新建任务 */
  .grp-add {
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    border-radius: var(--r-xs);
    color: var(--ink-4);
    opacity: 0;
    transition: opacity var(--dur-feedback), background var(--dur-feedback), color var(--dur-feedback);
  }
  .grp:hover .grp-add, .grp:focus-within .grp-add { opacity: 1; }
  .grp-add:hover { background: var(--surface-3); color: var(--ink); }
  .lane-h .grp-add { opacity: 0; }
  .lane:hover .grp-add, .lane:focus-within .grp-add { opacity: 1; }

  .task-new {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 34px;
    margin: 2px 0;
    padding: 0 8px;
    border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--border-1));
    border-radius: var(--r-sm);
    background: var(--surface-1);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 7%, transparent);
  }
  .task-new .nt-ico {
    width: 20px;
    height: 20px;

    place-items: center;

  .task-new input {
    flex: 1;
    min-width: 0;
    height: 30px;
    background: none;
    border: 0;
    outline: none;
    font-size: 12.5px;
    color: var(--ink);

  .task-new input::placeholder { color: var(--ink-4); }
  .task-new .nt-hint {
    flex: 0 0 auto;
    font-size: 10px;
    color: var(--ink-4);
    border: 1px solid var(--border-1);
    border-radius: 3px;
    padding: 0 4px;
    line-height: 15px;
  }
  .lane-cards .task-new { margin: 0 0 2px; }


  /* =========================================================
     DSH 原生气质：侧栏 / 顶栏 / 过程 / 轨迹
     ========================================================= */
  .side { background: var(--sidebar); }
  .side-top { padding: 6px 12px 0; }
  .brand {
    height: 44px;

  }

  .nav { padding: 8px 0 2px; gap: 2px; }
  .nav-item {
    height: 34px;
    gap: 10px;
    padding: 0 6px;
    font-size: 14px;
    color: var(--ink-2);
  }
  .nav-item .ico { width: 18px; height: 18px; color: var(--ink-3); }

    width: 18px;

  .row { height: 30px; padding: 0 6px; gap: 8px; }
  .row .name { font-size: 13px; }
  .row .tail { font-size: 10.5px; }
  .row .glyph, .row .p-icon { margin-left: 1px; }

  .ws-row {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 6px;
    border-radius: var(--r-sm);

    font-size: 13.5px;

  }

  .ws-row .more {

  }

  .ws-row .more:hover { background: var(--surface-3); color: var(--ink); }
  .ws-session {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 28px;

    padding: 0 6px;
    border-radius: var(--r-sm);

  .ws-session .ws-dot {
    width: 5px;

  }

  .ws-session .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-session .tail { font-size: 10.5px; color: var(--ink-4); }

  .account { height: 36px; padding: 0 6px; gap: 8px; }
  .account-mark { width: 18px; height: 18px; display: inline-flex; color: var(--accent); }
  html[data-brand="claude"] .account-mark { color: var(--ink); }
  .account .name { font-size: 13px; }
  .account-chev { margin-left: auto; color: var(--ink-4); display: inline-flex; }

  .center-seg button { height: 22px; font-size: 12px; padding: 0 10px; }
  .center-head .head-actions { gap: 2px; }
  .stream-inner { max-width: 720px; }

  .msg.agent .txt { font-size: 14px; line-height: 1.72; }
  .msg.user .bubble { font-size: 14px; line-height: 1.68; }
  .msg-actions { opacity: 0.55; }

  /* 过程：DSH 的一行「用时」+ 可展开的思考 / 工具 */
  .turn-process { display: flex; flex-direction: column; width: 100%; }
  .tp-head {
    display: flex;
    align-items: center;
    width: 100%;
    height: 33px;
    padding: 0 0 8px;
    border: 0;
    border-bottom: 0.5px solid var(--border-2);
    color: var(--ink-3);
    font-size: 14px;
    line-height: 24px;

    transition: color 100ms ease;

  .lane { transition: border-color var(--dur-feedback), background var(--dur-feedback); }

    border-color: color-mix(in srgb, var(--accent) 52%, var(--border-2));

  /* 任务详情：文件变更与 PR */

  .pr-pill:hover { border-color: var(--border-2); color: var(--ink); background: var(--hover-wash); }
  .d-kicker .st { border: 0; cursor: pointer; }

  .detail-files {
    display: flex;
    flex-direction: column;

  .df-head {
    display: flex;
    align-items: center;
    height: 32px;
    padding: 0 10px;
    border-bottom: 1px solid var(--divider);
    font-size: 11.5px;
    color: var(--ink-2);
  }
  .df-stat { margin-left: auto; display: inline-flex; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; }
  .df-stat b { color: var(--ok); font-weight: 500; }
  .df-stat i { color: var(--danger); font-style: normal; }
  .df-row {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 7px;
    min-height: 29px;
    padding: 0 10px;
