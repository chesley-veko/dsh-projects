# Spike S4 test profile. Standalone: does NOT load dsh-superagent.
# Port 3093 keeps it off the lab service (3082), the S1 profile (3091)
# and the S2 profile (3092).
- patch:
    "@deepseek-ai/dsh-host-webserver":
      config:
        host: 127.0.0.1
        port: 3093
- patch:
    dsh-spike-s4-driver:
      config: {}
- patch:
    "@deepseek-ai/dsh-llm":
      config:
        providers:
          pi-ai:
            enabled: true
            routes:
              opencode-go:
                displayName: OpenCode Go
                apiKeyEnv: OPENCODE_API_KEY
                api: openai-completions
                baseURL: https://opencode.ai/zen/go/v1
                compat:
                  thinkingFormat: deepseek
                models:
                  - id: deepseek-v4.1-flash
                  # Check 2 needs a second, non-default model on the same
                  # route. The lab profiles get this by the temporary
                  # extension in test-fixtures.md; this standalone profile
                  # lists it directly so S4 can run without the lab.
                  - id: deepseek-v4-pro
                headers:
                  x-opencode-session: c978f2c1-dbab-4957-bbce-75b3c132b09d
- patch:
    "@deepseek-ai/dsh-agent":
      config:
        agent-default-model:
          provider: opencode-go
          model: deepseek-v4.1-flash
