<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Projects · 交互原型</title>
<style>
  :root {
    --bg-side: #15171c;
    --bg-center: #17191e;
    --bg-right: #15171c;
    --bg-card: #1c1f26;
    --bg-card-2: #20242c;
    --bg-hover: #22262f;
    --bg-active: #272c36;
    --line: #262a32;
    --line-soft: #20242b;
    --line-strong: #313742;

    --tx: #e6e9ee;
    --tx-2: #a6b0bc;
    --tx-3: #6f7885;

    --blue: #4b93f5;
    --blue-dim: rgba(75, 147, 245, 0.14);
    --blue-line: rgba(75, 147, 245, 0.35);

    --green: #3fb950;
    --green-dim: rgba(63, 185, 80, 0.13);
    --green-line: rgba(63, 185, 80, 0.32);

    --amber: #e3b341;
    --amber-dim: rgba(227, 179, 65, 0.12);
    --amber-line: rgba(227, 179, 65, 0.34);

    --purple: #a371f7;
    --purple-dim: rgba(163, 113, 247, 0.13);
    --purple-line: rgba(163, 113, 247, 0.32);

    --red: #f85149;
    --red-dim: rgba(248, 81, 73, 0.12);
    --red-line: rgba(248, 81, 73, 0.32);

    --r-sm: 6px;
    --r-md: 9px;
    --r-lg: 12px;

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0e1014;
    color: var(--tx);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #2b3038; border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #3a414c; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 外壳 ============ */
  .shell {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .notice-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 16px;
    background: #1a1d24;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--tx-2);
  }
  .notice-bar b { color: var(--tx); font-weight: 600; }
  .notice-bar .kbd {
    font-family: var(--mono);
    font-size: 11px;
    background: #262b34;
    border: 1px solid #333a45;
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--tx-2);
  }
  .notice-bar .spacer { flex: 1; }
  .notice-bar .dismiss {
    color: var(--tx-3);
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .notice-bar .dismiss:hover { background: var(--bg-hover); color: var(--tx); }
  .notice-bar .pill-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue);
    flex: 0 0 auto;
    box-shadow: 0 0 0 3px rgba(75,147,245,.16);
  }
  .notice-bar .nb-sep { color: #3d4550; }
  .notice-bar span:not(.kbd):not(.nb-sep):not(.pill-dot):not(.spacer) { white-space: nowrap; }

  .app {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr) 408px;
    background: var(--bg-center);
  }

  /* ============ 左栏 ============ */
  .side {
    background: var(--bg-side);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    user-select: none;
  }

  .side-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 14px 10px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .side-brand .mark { color: #6cb6ff; font-size: 15px; }
  .side-brand .tag {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    background: #2b5fd9;
    color: #fff;
    padding: 2px 5px;
    border-radius: 3px;
  }

  .side-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 8px 12px;
  }

  .side-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 8px;
    border-radius: var(--r-sm);
    color: var(--tx-2);
    cursor: pointer;
    font-size: 12.5px;
    min-height: 30px;
  }
  .side-row:hover { background: var(--bg-hover); color: var(--tx); }
  .side-row .ico { width: 15px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; opacity: 0.85; }
  .side-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-row .meta { flex: 0 0 auto; font-size: 11px; color: var(--tx-3); font-variant-numeric: tabular-nums; }

  .side-sec {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 14px 8px 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #626b78;
  }
  .side-sec .acts { display: flex; align-items: center; gap: 2px; }
  .side-sec .iconbtn {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 5px;
    color: #7b8492;
  }
  .side-sec .iconbtn:hover { background: var(--bg-hover); color: var(--tx); }

  .proj-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    min-height: 32px;
    position: relative;
  }
  .proj-row:hover { background: var(--bg-hover); }
  .proj-row.active { background: var(--bg-active); }
  .proj-row.active::before {
    content: "";
    position: absolute;
    left: 0; top: 7px; bottom: 7px;
    width: 2px;
    border-radius: 2px;
    background: var(--blue);
  }
  .proj-row .avatar {
    width: 19px; height: 19px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px;
    flex: 0 0 auto;
  }
  .avatar.tone-blue { background: rgba(75,147,245,.2); color: #79b8ff; }
  .avatar.tone-green { background: rgba(63,185,80,.18); color: #56d364; }
  .avatar.tone-pink { background: rgba(219,97,162,.18); color: #f778ba; }
  .avatar.tone-amber { background: rgba(227,179,65,.18); color: #e3b341; }
  .avatar.tone-purple { background: rgba(163,113,247,.18); color: #c297ff; }

  .proj-row .pname {
    flex: 1; min-width: 0;
    font-size: 12.5px;
    color: var(--tx-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .proj-row.active .pname { color: var(--tx); font-weight: 550; }
  .proj-row .ptime { font-size: 11px; color: var(--tx-3); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .proj-row .more {
    position: absolute;
    right: 4px;
    width: 20px; height: 20px;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: var(--tx-2);
    background: var(--bg-hover);
  }
  .proj-row:hover .more { display: inline-flex; }
  .proj-row:hover .ptime { display: none; }
  .proj-row .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue);
    flex: 0 0 auto;
  }

  .side-foot {
    flex: 0 0 auto;
    border-top: 1px solid var(--line-soft);
    padding: 8px;
  }

  /* ============ 中栏 ============ */
  .center {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--bg-center);
  }

  .center-head {
    flex: 0 0 auto;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .center-head .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--bg-card-2);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 4px 10px;
    font-size: 12.5px;
    font-weight: 550;
    max-width: 260px;
  }
  .center-head .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .center-head .addbtn {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    color: var(--tx-3);
  }
  .center-head .addbtn:hover { background: var(--bg-hover); color: var(--tx); }
  .center-head .spacer { flex: 1; }
  .center-head .goal {
    font-size: 11.5px;
    color: var(--tx-3);
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stream {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg-user {
    align-self: flex-end;
    max-width: min(560px, 86%);
    background: #262b35;
    border: 1px solid #303743;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: #eef1f6;
  }
  .msg-user .t { font-size: 10.5px; color: #7d8794; margin-top: 5px; text-align: right; }

  .msg-relay {
    align-self: center;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: #79828f;
    padding: 2px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .msg-relay:hover { background: var(--bg-hover); color: var(--tx-2); }
  .msg-relay .ln { width: 28px; height: 1px; background: #2b303a; }

  .msg-agent {
    max-width: min(680px, 94%);
    font-size: 13.2px;
    line-height: 1.66;
    color: #dde2e9;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-agent p { margin: 0; }

  .art-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 10px 12px;
  }
  .art-card .lhs { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .art-thumb {
    width: 38px; height: 38px;
    border-radius: var(--r-sm);
    background: linear-gradient(135deg, #2a3038, #20252d);
    display: grid; place-items: center;
    font-size: 12px;
    color: #c9d1d9;
    flex: 0 0 auto;
    border: 1px solid #333a45;
  }
  .art-card .nm { font-size: 12.5px; font-weight: 550; color: var(--tx); }
  .art-card .sub { font-size: 11px; color: var(--tx-3); margin-top: 1px; }
  .art-play {
    flex: 0 0 auto;
    font-size: 11.5px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #2a303a;
    border: 1px solid #39414d;
    color: var(--tx-2);
  }
  .art-play:hover { background: #333b46; color: var(--tx); }

  code.inline {
    font-family: var(--mono);
    font-size: 11.5px;
    background: #232832;
    border: 1px solid #2f3742;
    border-radius: 4px;
    padding: 1px 5px;
    color: #9cd1ff;
    overflow-wrap: anywhere;
  }

  .ref-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 11.5px;
    background: var(--blue-dim);
    border: 1px solid var(--blue-line);
    color: #79b8ff;
    border-radius: 4px;
    padding: 1px 6px;
    vertical-align: 1px;
  }

  .msg-system {
    align-self: center;
    font-size: 11.5px;
    color: var(--tx-3);
    background: #1c2028;
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    padding: 4px 12px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing i {
    width: 5px; height: 5px; border-radius: 50%;
    background: #6f7885;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: 0.28; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  /* 输入区 */
  .composer-wrap {
    flex: 0 0 auto;
    padding: 8px 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tray {
    border: 1px solid var(--amber-line);
    background: linear-gradient(180deg, #26200f, #221d12);
    border-radius: var(--r-md);
    padding: 10px 12px;
    animation: trayIn 160ms ease;
  }
  @keyframes trayIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tray-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 7px;
  }
  .tray-head .who {
    font-size: 11.5px;
    font-weight: 650;
    color: var(--amber);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .tray-head .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tray-head .fold { font-size: 11px; color: #9b8452; flex: 0 0 auto; }
  .tray-head .fold:hover { color: var(--amber); }
  .tray-q { font-size: 12.8px; color: #f0f3f8; line-height: 1.6; margin-bottom: 9px; }
  .tray-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .tray-opt {
    font-size: 11.8px;
    padding: 5px 10px;
    border-radius: var(--r-sm);
    background: #2e2718;
    border: 1px solid #4a3d22;
    color: #f0d68f;
    text-align: left;
  }
  .tray-opt:hover { background: #3a311d; border-color: #6b5629; }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #1e222a;
    border: 1px solid #2c323c;
    color: #a9b2bd;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .pill:hover { background: #262b34; color: var(--tx); }
  .pill.warn { background: var(--amber-dim); border-color: var(--amber-line); color: var(--amber); }
  .pill.warn:hover { background: rgba(227,179,65,.2); }
  .pill .num { font-variant-numeric: tabular-nums; }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid #2d333d;
    border-radius: var(--r-lg);
    padding: 9px 10px 9px 12px;
    transition: border-color 140ms ease;
  }
  .composer:focus-within { border-color: #3d4653; }
  .composer .plus {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-sm);
    color: var(--tx-3);
    flex: 0 0 auto;
  }
  .composer .plus:hover { background: var(--bg-hover); color: var(--tx); }
  .composer textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    max-height: 132px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--tx);
    padding: 4px 0;
  }
  .composer textarea::placeholder { color: #5e6773; }
  .composer .rhs { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .composer .model { font-size: 11.5px; color: var(--tx-3); white-space: nowrap; }
  .send-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--blue);
    color: #fff;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .send-btn:hover { background: #5b9ef7; }
  .send-btn:disabled { background: #2b3441; color: #6b7684; cursor: default; }

  .env-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    color: #5e6773;
    padding: 0 4px;
  }
  .env-row .envsel { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .env-row .envsel:hover { color: var(--tx-2); }

  /* ============ 右栏 ============ */
  .right {
    background: var(--bg-right);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .right-head {
    flex: 0 0 auto;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .right-head .title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 600;
    min-width: 0;
  }
  .right-head .title .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .right-head .spacer { flex: 1; }
  .right-head .iconbtn {
    width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 5px;
    color: var(--tx-3);
    flex: 0 0 auto;
  }
  .right-head .iconbtn:hover { background: var(--bg-hover); color: var(--tx); }

  .seg {
    display: inline-flex;
    background: #1e222a;
    border: 1px solid #2b313b;
    border-radius: 999px;
    padding: 2px;
    flex: 0 0 auto;
  }
  .seg button {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: #97a1ae;
    white-space: nowrap;
  }
  .seg button:hover { color: var(--tx); }
  .seg button.on { background: #333a45; color: #fff; font-weight: 600; }

  .right-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .group-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #1b1f26;
    border-radius: var(--r-sm);
    padding: 5px 9px;
    font-size: 11.5px;
    font-weight: 600;
    color: #98a2af;
    margin-top: 2px;
  }
  .group-bar .gcount { font-size: 10.5px; color: #6b7581; font-weight: 500; }

  .task-row {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    padding: 7px 9px;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    cursor: pointer;
  }
  .task-row:hover { background: var(--bg-hover); border-color: #2c323c; }
  .task-row .tid {
    font-family: var(--mono);
    font-size: 11px;
    color: #7c8695;
    white-space: nowrap;
  }
  .task-row .ttl {
    font-size: 12.2px;
    color: #d5dae1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .task-row .trs { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }

  .badge {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .badge.pr { background: var(--purple-dim); border-color: var(--purple-line); color: #d2a8ff; }
  .badge.pr.ok { background: var(--green-dim); border-color: var(--green-line); color: #7ee787; }
  .badge.pr.warn { background: var(--amber-dim); border-color: var(--amber-line); color: var(--amber); }
  .badge.rule { background: #232830; border-color: #333a45; color: #9aa4b1; }
  .badge.wait { background: var(--amber-dim); border-color: var(--amber-line); color: var(--amber); }
  .badge.work { background: var(--blue-dim); border-color: var(--blue-line); color: #79b8ff; }
  .badge.review { background: var(--purple-dim); border-color: var(--purple-line); color: #d2a8ff; }
  .badge.done { background: var(--green-dim); border-color: var(--green-line); color: #7ee787; }
  .badge.queued { background: #22262e; border-color: #2f3641; color: #8b95a2; }

  /* 看板 */
  .board {
    display: grid;

  function pendingQuestion(p) {
    const t = p.tasks.find((x) => x.status === 'waiting' && x.question);
    if (!t || S.trayDismissed[t.id + ':' + t.question.text]) return null;
    return t.question;
  }

  function buildPills(p, q) {
    const out = [];
    if (q) {
      out.push(`<button class="pill warn" data-action="toggle-tray">● Questions · <span class="num">1</span></button>`);
    }
    const running = p.tasks.filter((t) => t.status === 'working').length;
    const done = p.tasks.filter((t) => t.status === 'done').length;
    out.push(`<button class="pill" data-action="agents">Agents · <span class="num">${running}</span> running, <span class="num">${done}</span> done</button>`);
    out.push(`<button class="pill" data-action="listening">Listening · GitHub PRs, main CI</button>`);
    return out.join('');
  }

  function renderTray(q) {
    return `
      <div class="tray">
        <div class="tray-head">
          <div class="who">⚡ Question from <span>${esc(q.from)} (${esc(q.worker)})</span></div>
          <button class="fold" data-action="toggle-tray">收起 ▾</button>
        </div>
        <div class="tray-q">${linkify(q.text)}</div>
        <div class="tray-opts">
          ${q.options.map((o, i) => `<button class="tray-opt" data-answer="${i}">${i + 1}. ${esc(o)}</button>`).join('')}

        </div>
      </div>`;
  }

  function linkify(text) {
    // 保留既有 HTML 片段（code / ref-chip），只把 @YOU-1 和 #252 转成 chip
    return String(text)
      .replace(/@([A-Z]{2,4}-\d+)/g, '<span class="ref-chip">@$1</span>')
      .replace(/(^|[\s（(])#(\d+)/g, '$1<span class="ref-chip">⑂ #$2</span>');
  }

    const q = (S.search || '').toLowerCase();
    let html = '';
    GROUP_ORDER.forEach((st) => {
      let list = tasksByStatus(p, st);
      if (q) list = list.filter((t) => (t.id + ' ' + t.title).toLowerCase().includes(q));
      if (!list.length) return;
      const collapsed = S.boardCollapsed['list:' + st];
      html += `<div class="group-bar">
        <span style="cursor:pointer;" data-action="collapse" data-key="list:${st}">${collapsed ? '▸' : '▾'} ${GROUP_LABEL[st]} · ${list.length}</span>

      </div>`;
      if (collapsed) return;
      list.forEach((t) => {
        const prs = (t.prs || [])
          .map((pr) => `<span class="badge pr ${pr.state === 'merged' ? 'ok' : pr.state === 'open' ? '' : 'warn'}">⑂ #${pr.num}</span>`)
          .join('');
        html += `<div class="task-row" data-task="${t.id}">
          <span class="tid">${t.id}</span>
          <span class="ttl">${esc(t.title)}</span>
          <span class="trs">${prs || (st === 'waiting' ? '<span class="badge wait">Waiting</span>' : '')}</span>
        </div>`;
      });
    });
    return html || `<div class="empty"><div>没有匹配的任务</div></div>`;
  }

          ? '<span class="badge wait">Proposed</span>'

          ? '<span class="badge" style="background:var(--red-dim);border-color:var(--red-line);color:#ff8b84;">Disputed</span>'
          : '';
      return `<div class="lib-row" data-lib="${esc(f.path)}">
        <span class="lib-name">${esc(f.path)}</span>
        <span>${badge}</span>
        <span class="lib-meta">${esc(f.meta || '')}</span>
      </div>`;
    };

    return `
      <div class="group-bar"><span>常驻上下文</span><span class="gcount">${standing.length} 个文件 · Git 追踪</span></div>
      ${standing.map(row).join('') || '<div class="empty" style="padding:18px;">还没有上下文文件</div>'}
      <div class="group-bar" style="margin-top:6px;"><span>工件与参考</span><span class="gcount">${artifacts.length} 项</span></div>
      ${artifacts.map(row).join('') || '<div class="empty" style="padding:18px;">还没有工件</div>'}
    `;
  }

  function renderDetail(p, taskId) {
    const t = p.tasks.find((x) => x.id === taskId);
    if (!t) return '<div class="empty">任务不存在</div>';
    const meta = STATUS_META[t.status];
    const prs = (t.prs || []).map((pr) => `<span class="badge pr ${pr.state === 'merged' ? 'ok' : ''}">⑂ #${pr.num} · ${pr.state === 'merged' ? 'merged' : 'open'}</span>`).join(' ');

    return `<div class="detail">
      <div class="detail-top">
        <button class="back" data-action="detail-back">← 返回列表</button>
      </div>

      <div>
        <h2>${esc(t.title)}</h2>
        <div class="subline" style="margin-top:7px;">
          <span style="font-family:var(--mono);color:#79b8ff;">${t.id}</span>
          <span class="badge ${meta.cls}">${meta.label}</span>
          ${prs}
        </div>
      </div>

      <div class="desc">${esc(t.desc || '')}</div>

      <dl class="kv">
        <dt>仓库</dt><dd>${esc(t.repo || '—')}</dd>
        <dt>Worker</dt><dd style="font-family:var(--mono);font-size:11px;">${esc(t.worker || '—')}</dd>
        <dt>Worktree</dt><dd style="font-family:var(--mono);font-size:11px;">${esc(t.worktree || '—')}</dd>
        <dt>模型</dt><dd>${esc(t.model || '—')}</dd>
      </dl>

      ${
        t.timeline && t.timeline.length
          ? `<div>
              <div style="font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#626b78;margin-bottom:9px;">执行轨迹</div>
              <div class="timeline">
                ${t.timeline
                  .map(
                    (e) => `<div class="tl-item">
                      <span class="tl-dot ${e.tone || ''}"></span>
                      <div class="tl-body">
                        <div class="tl-t">${esc(e.t)}</div>
                        <div class="tl-time">${esc(e.time)}</div>
                      </div>
                    </div>`
                  )
                  .join('')}
              </div>
            </div>`
          : ''
      }

      <div class="actions">
        <button class="btn primary" data-action="open-worker">打开 Worker 会话</button>
        ${t.status !== 'done' ? `<button class="btn" data-action="mark-done" data-task="${t.id}">标记完成</button>` : ''}
        ${t.status === 'working' ? `<button class="btn" data-action="stop-task" data-task="${t.id}">停止</button>` : ''}
        ${t.status === 'done' ? `<button class="btn" data-action="reopen" data-task="${t.id}">重新打开</button>` : ''}
      </div>
    </div>`;
  }

  /* =========================================================
     渲染主入口
     ========================================================= */
  function render() {
    renderSide();
    renderCenter();
    renderRight();
  }

  /* =========================================================
     交互
     ========================================================= */
  function selectProject(id) {
    if (S.activeProject === id) return;
    S.activeProject = id;
    S.detailTask = null;
    S.rightPane = 'list';
    S.search = '';
    S.trayOpen = false;
    const p = project();
    p.unread = false;
    render();
  }

  function setPane(pane) {
    S.rightPane = pane;
    S.detailTask = null;
    render();
  }

  function openTask(id) {
    S.detailTask = id;
    render();
  }

  function answerQuestion(idx, q) {
    const p = project();
    const t = p.tasks.find((x) => x.id === q.from);
    if (!t) return;
    S.trayDismissed[t.id + ':' + q.text] = true;
    S.trayOpen = false;

    const answerText = q.options[idx];
    p.messages.push({ kind: 'user', text: answerText, time: '刚刚' });
    p.messages.push({ kind: 'relay', text: `Messages from ${q.from} (${q.worker}) · 1 条内部进度` });

    if (t) {
      t.status = 'working';
      t.timeline.push({ t: `已收到答复：${answerText}`, time: '刚刚', tone: 'work' });
      delete t.question;
    }
    render();
    setTimeout(() => {
      p.messages.push({
        kind: 'agent',
        text: `收到，已经转给 <code>${esc(q.worker)}</code>。它按「${esc(answerText)}」继续，跑完会把结果贴回来。`
      });
      render();
    }, 700);
  }

  function sendMessage() {
    const input = $('#input');
    if (!input) return;
    const text = input.value.trim();
    if (!text || S.typing) return;
    const p = project();
    p.messages.push({ kind: 'user', text, time: '刚刚' });
    input.value = '';
    autoGrow(input);
    S.typing = true;
    render();

    setTimeout(() => {
      S.typing = false;
      const reply = makeReply(text, p);
      p.messages.push(...reply.messages);
      if (reply.tasks && reply.tasks.length) {
        reply.tasks.forEach((t) => {
          p.tasks.unshift(t);
          p.nextSeq = Math.max(p.nextSeq, parseInt(t.id.split('-')[1], 10) + 1);
        });
        p.messages.push({
          kind: 'system',
          text: `已创建 ${reply.tasks.length} 个任务，右栏可以看进度`
        });
      }
      render();
    }, 900);
  }

  function makeReply(text, p) {
    const prefix = p.id === 'youshi-product' ? 'YOU' : p.id === 'bzti' ? 'BZT' : 'NAT';
    const seq = p.nextSeq;

    if (/拆|分成|几个|并行|三条|三块/.test(text)) {
      const titles = ['抽离合盘状态源', '单人盘入口回归', '迁移脚本与数据校验'];
      const tasks = titles.map((t, i) => ({
        id: `${prefix}-${seq + i}`,
        title: t,
        status: i === 0 ? 'working' : 'queued',
        repo: p.repos[i % p.repos.length],
        desc: t,
        worker: i === 0 ? `worker-${Math.random().toString(16).slice(2, 6)}` : '',
        worktree: i === 0 ? `agent/${prefix.toLowerCase()}-${seq + i}-${i === 0 ? 'state' : 'task'}` : '',
        model: 'Gemini 4 Argon',
        prs: [],
        timeline: i === 0 ? [{ t: '已拉起 worktree，开始读代码', time: '刚刚', tone: 'work' }] : []
      }));
      return {
        messages: [
          {
            kind: 'agent',
            text: `拆成 3 个任务了。<code>${prefix}-${seq}</code> 先跑起来摸状态源，另外两个排队等它出结论，避免三个人同时改同一处。`
          }
        ],
        tasks
      };
    }

    if (/上线|发布|deploy|生产/i.test(text)) {
      return {
        messages: [
          {
            kind: 'agent',
            text: '发布我拆成一步来做：先确认 staging 的 <code>f31489d</code> 冒烟通过，再滚动到生产。这一步我派一个 worker 去做，做完把健康检查结果贴回来。'
          }
        ],
        tasks: [
          {
            id: `${prefix}-${seq}`,
            title: '生产发布 f31489d',
            status: 'queued',
            repo: p.repos[p.repos.length - 1],
            desc: '滚动发布 f31489d 到生产，带健康检查与回滚预案。',
            worker: '',
            worktree: '',
            model: 'Gemini 4 Argon',
            prs: [],
            timeline: []
          }
        ]
      };
    }

    if (/测试|回归|验证/.test(text)) {
      return {
        messages: [
          {
            kind: 'agent',
            text: '回归我用 Playwright 跑三档视口，Chromium 和 WebKit 各一遍。跑完把录屏和失败截图存进 Library，你直接点开看。'
          }
        ],
        tasks: []
      };
    }

    return {
      messages: [
        {
          kind: 'agent',
          text: `收到。我先看一下 <code>${esc(p.repos[0] || '仓库')}</code> 里相关的部分，需要动手的话我会拆成任务派下去，不会自己改代码。`
        }
      ],
      tasks: []
    };
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 132) + 'px';
  }

  /* =========================================================
     输入框与 @ 提及
     ========================================================= */
  function bindComposer(p) {
    const input = $('#input');
    const btn = $('#sendBtn');
    if (!input) return;

    input.addEventListener('input', () => {
      autoGrow(input);
      const val = input.value;
      const caret = input.selectionStart;
      const upto = val.slice(0, caret);
      const m = /@([A-Za-z0-9-]*)$/.exec(upto);
      if (m) {
        S.mention = { query: m[1].toLowerCase() };
        renderMention(p, input);
      } else {
        closeMention();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (S.mention && (e.key === 'Escape')) {
        closeMention();
        return;
      }
      if (e.key === 'Enter' && !e.shiftKey && !S.mention) {
        e.preventDefault();
        sendMessage();
      }
    });

    btn.addEventListener('click', sendMessage);
  }

  function renderMention(p, input) {
    closeMention(true);
    const q = S.mention.query;
    const list = p.tasks.filter((t) => !q || (t.id + ' ' + t.title).toLowerCase().includes(q));
    if (!list.length) return;

    const box = document.createElement('div');
    box.className = 'mention';
    box.id = 'mentionBox';
    box.innerHTML =
      `<div class="mh">任务 · ${p.name}</div>` +
      list
        .map(
          (t, i) => `<button data-mention="${t.id}" class="${i === 0 ? 'sel' : ''}">
            <span class="mid">${t.id}</span>
            <span class="mtt">${esc(t.title)}</span>
            <span class="badge ${STATUS_META[t.status].cls}" style="flex:0 0 auto;">${STATUS_META[t.status].label}</span>
          </button>`
        )
        .join('');

    const composer = input.closest('.composer');
    composer.appendChild(box);

    box.querySelectorAll('[data-mention]').forEach((b) => {
      b.addEventListener('mousedown', (e) => {
        e.preventDefault();
        insertMention(input, b.dataset.mention);
      });
    });
  }

  function insertMention(input, id) {
    const val = input.value;
    const caret = input.selectionStart;
    const before = val.slice(0, caret).replace(/@([A-Za-z0-9-]*)$/, '@' + id + ' ');
    const after = val.slice(caret);
    input.value = before + after;
    input.selectionStart = input.selectionEnd = before.length;
    closeMention();
    input.focus();
    autoGrow(input);
  }

  function closeMention(keepState) {
    const b = $('#mentionBox');
    if (b) b.remove();
    if (!keepState) S.mention = null;
  }

  /* =========================================================
     弹窗：新建项目
     ========================================================= */
  const ICONS = [
    { icon: '☺', tone: 'blue' },
    { icon: '◈', tone: 'pink' },
    { icon: '◆', tone: 'purple' },
    { icon: '✦', tone: 'amber' },
    { icon: '▣', tone: 'green' },
    { icon: '⬡', tone: 'blue' }
  ];
  const REPOS = ['youshi-web', 'youshi-api', 'bzti-docs', 'native-shell', 'openhanako'];

  function openCreateProject() {
    const pick = { icon: 0, repos: [0] };
    const layer = document.createElement('div');
    layer.className = 'overlay';
    layer.id = 'overlay';
    layer.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-label="新建项目">
        <div class="modal-head">
          <h3>新建项目</h3>
          <button class="x" data-close>×</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label>图标</label>
            <div class="icon-picker">
              ${ICONS.map((o, i) => `<button data-icon="${i}" class="${i === 0 ? 'on' : ''}"><span class="avatar tone-${o.tone}" style="width:26px;height:26px;font-size:13px;">${o.icon}</span></button>`).join('')}
            </div>
          </div>
          <div class="field">
            <label>名称</label>
            <input type="text" id="projName" placeholder="比如：合盘体验统一" autofocus>
            <div class="hint">留空就叫「新项目」</div>
          </div>
          <div class="field">
            <label>目标（选填）</label>
            <input type="text" id="projGoal" placeholder="一句话说清这个项目要达成什么">
          </div>
          <div class="field">
            <label>关联仓库</label>
            <div class="repo-list">
              ${REPOS.map(
                (r, i) => `<div class="repo-item ${i === 0 ? 'on' : ''}" data-repo="${i}">
                  <span class="box">✓</span>
                  <span class="rname">${r}</span>
                  <span class="rtag">${i < 2 ? '本地已克隆' : '远端'}</span>
                </div>`
              ).join('')}
            </div>
            <div class="hint">可以先不选，之后在项目设置里加</div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" data-close>取消</button>
          <button class="btn primary" id="createBtn">创建项目</button>
        </div>
      </div>`;
    $('#layers').appendChild(layer);

    layer.querySelectorAll('[data-icon]').forEach((b) => {
      b.addEventListener('click', () => {
        layer.querySelectorAll('[data-icon]').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        pick.icon = +b.dataset.icon;
      });
    });
    layer.querySelectorAll('[data-repo]').forEach((b) => {
      b.addEventListener('click', () => {
        b.classList.toggle('on');
        const i = +b.dataset.repo;
        pick.repos = pick.repos.includes(i) ? pick.repos.filter((x) => x !== i) : [...pick.repos, i];
      });
    });
    layer.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeOverlay));
    layer.addEventListener('click', (e) => {
      if (e.target === layer) closeOverlay();
    });

    $('#createBtn').addEventListener('click', () => {
      const name = ($('#projName').value || '').trim() || '新项目';
      const goal = ($('#projGoal').value || '').trim() || '还没定目标';
      const iconObj = ICONS[pick.icon];
      const repos = pick.repos.length ? pick.repos.map((i) => REPOS[i]) : [];

      const id = 'p-' + Date.now();
      const p = {
        id,
        name,
        icon: iconObj.icon,
        tone: iconObj.tone,
        goal,
        repos,
        time: '刚刚',
        unread: false,
        status: 'active',
        nextSeq: 1,
        tasks: [],
        library: [{ path: 'INDEX.md', scope: 'index', status: 'proposed', meta: '草稿' }],
        messages: [
          { kind: 'system', text: `项目「${name}」已创建` },
          {
            kind: 'agent',
            text: `项目建好了${repos.length ? `，已经关联 ${repos.map((r) => `<code>${esc(r)}</code>`).join('、')}` : ''}。你直接说要做什么，我拆成任务派下去；要是有跨任务都要遵守的规矩，跟我说一句，我写进 <code>INDEX.md</code>。`
          }
        ]
      };
      DB.projects.unshift(p);
      closeOverlay();
      S.activeProject = id;
      S.rightPane = 'list';
      S.detailTask = null;
      render();
      toast(`已创建「${name}」`);
    });

    setTimeout(() => $('#projName') && $('#projName').focus(), 60);
  }

  function closeOverlay() {
    const o = $('#overlay');
    if (o) o.remove();
  }

  /* =========================================================
     菜单
     ========================================================= */
  function openMenu(anchor, items, opts) {
    closeMenu();
    const r = anchor.getBoundingClientRect();
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.id = 'popMenu';
    menu.innerHTML = items
      .map((it) =>
        it.sep
          ? '<div class="sep"></div>'
          : `<button class="${it.danger ? 'danger' : ''}" data-mi="${it.id}">${it.icon ? `<span style="width:14px;">${it.icon}</span>` : ''}${esc(it.label)}</button>`
      )
      .join('');
    document.body.appendChild(menu);

    const mw = menu.offsetWidth;
    const mh = menu.offsetHeight;
    let left = (opts && opts.alignRight) ? r.right - mw : r.left;
    let top = r.bottom + 4;
    if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
    if (left < 8) left = 8;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';

    menu.querySelectorAll('[data-mi]').forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.dataset.mi;
        closeMenu();
        if (opts && opts.onPick) opts.onPick(id);
      });
    });
    S.menu = menu;
  }

  function closeMenu() {
    const m = $('#popMenu');
    if (m) m.remove();
    S.menu = null;
  }

  /* =========================================================
     事件委托
     ========================================================= */
  document.addEventListener('click', (e) => {
    const t = e.target;

    // 关闭菜单
    if (!t.closest('#popMenu') && !t.closest('[data-projmenu]') && !t.closest('[data-wsmenu]')) {
      closeMenu();
    }
    if (!t.closest('.composer')) closeMention();

    // 项目行
    const projBtn = t.closest('[data-projmenu]');
    if (projBtn) {
      e.stopPropagation();
      const id = projBtn.dataset.projmenu;
      const p = DB.projects.find((x) => x.id === id);
      openMenu(projBtn, [
        { id: 'settings', label: '项目设置', icon: ICON.gear },
        { id: 'index', label: '编辑 INDEX.md', icon: ICON.pencil },
        { sep: true },
        { id: p.status === 'paused' ? 'resume' : 'pause', label: p.status === 'paused' ? '恢复项目' : '暂停项目', icon: p.status === 'paused' ? ICON.play : ICON.pause },
        { id: 'archive', label: '归档', icon: ICON.archive },
        { sep: true },
        { id: 'delete', label: '删除项目', danger: true, icon: ICON.trash }
      ], {
        alignRight: true,
        onPick: (action) => handleProjectAction(id, action)
      });
      return;
    }

    const projRow = t.closest('[data-proj]');
    if (projRow && !t.closest('.more')) {
      selectProject(projRow.dataset.proj);
      return;
    }

    // 工作区菜单
    const wsBtn = t.closest('[data-wsmenu]');
    if (wsBtn) {
      e.stopPropagation();
      const wsId = wsBtn.dataset.wsmenu;
      openMenu(wsBtn, [
        { id: 'add', label: '加入项目…', icon: ICON.folder },
        { id: 'new', label: '在此新建会话', icon: ICON.plus },
        { sep: true },
        { id: 'rename', label: '重命名工作区', icon: ICON.pencil }
      ], {
        onPick: (action) => {
          if (action === 'add') openAddToProject(wsId);
          else toast('原型里只演示「加入项目」');
        }
      });
      return;
    }

    // 左栏动作
    const act = t.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'new-project') { openCreateProject(); return; }
      if (a === 'toggle-archived') { S.showArchived = !S.showArchived; render(); return; }
      if (a === 'new-task') { focusInput('新任务：'); return; }
      if (a === 'toggle-tray') { S.trayOpen = !S.trayOpen; render(); return; }
      if (a === 'agents') { setPane('list'); toast('切到 List 看所有任务'); return; }
      if (a === 'listening') { toast('订阅：GitHub PR 活动、main 分支 CI'); return; }
      if (a === 'env') { toast('执行位置：本机 Worktree（可切远端）'); return; }
      if (a === 'detail-back') { S.detailTask = null; render(); return; }
      if (a === 'open-worker') { toast('在原型里，这里会打开该 Worker 的会话'); return; }
      if (a === 'play') { toast('播放回归录屏'); return; }
      if (a === 'attach') { toast('附件上传'); return; }
      if (a === 'filter') { toast('按状态 / PR / 仓库筛选'); return; }
      if (a === 'expand-relay') { toast('展开 Worker 的内部进度'); return; }
      if (a === 'mark-done') {
        const id = act.dataset.task;
        const p = project();
        const task = p.tasks.find((x) => x.id === id);
        if (task) { task.status = 'done'; task.timeline.push({ t: '人工标记完成', time: '刚刚', tone: 'ok' }); }
        render(); toast('已标记完成');
        return;
      }
      if (a === 'reopen') {
        const id = act.dataset.task;
        const p = project();
        const task = p.tasks.find((x) => x.id === id);
        if (task) task.status = 'working';
        render(); toast('已重新打开');
        return;
      }
      if (a === 'stop-task') {
        const id = act.dataset.task;
        const p = project();
        const task = p.tasks.find((x) => x.id === id);
        if (task) { task.status = 'queued'; task.timeline.push({ t: '人工停止，回到排队', time: '刚刚', tone: 'warn' }); }
        render(); toast('已停止');
        return;
      }
      if (a === 'collapse') {
        const k = act.dataset.key;
        S.boardCollapsed[k] = !S.boardCollapsed[k];
        render(); return;
      }
      if (['new-session', 'plugins', 'automation', 'more', 'ws-search', 'ws-add'].includes(a)) {
        toast('这是 DSH 原生入口，原型里不展开');
        return;
      }
    }

    // 回答托盘
    const ansBtn = t.closest('[data-answer]');
    if (ansBtn) {
      const q = pendingQuestion(project());
      if (!q) return;
      const v = ansBtn.dataset.answer;
      if (v === 'open') { toast('打开 ' + q.from + ' 的会话'); return; }
      answerQuestion(+v, q);
      return;
    }

    // 右栏切页
    const paneBtn = t.closest('[data-pane]');
    if (paneBtn) { setPane(paneBtn.dataset.pane); return; }

    // 任务行
    const taskRow = t.closest('[data-task]');
    if (taskRow) { openTask(taskRow.dataset.task); return; }

    // Library 行
    const libRow = t.closest('[data-lib]');
    if (libRow) { toast('打开 ' + libRow.dataset.lib); return; }
  });

  function handleProjectAction(id, action) {
    const p = DB.projects.find((x) => x.id === id);
    if (!p) return;
    if (action === 'pause') { p.status = 'paused'; render(); toast(`「${p.name}」已暂停，所有任务冻结`); return; }
    if (action === 'resume') { p.status = 'active'; render(); toast(`「${p.name}」已恢复`); return; }
    if (action === 'archive') {
      p.status = 'archived';
      if (S.activeProject === id) S.activeProject = (visibleProjects()[0] || DB.projects[0]).id;
      render(); toast(`「${p.name}」已归档`);
      return;
    }
    if (action === 'delete') { confirmDelete(p); return; }
    if (action === 'settings') { toast('项目设置：模型、仓库、环境、记忆'); return; }
    if (action === 'index') { setPane('library'); toast('在 Library 里编辑 INDEX.md'); return; }
  }

  function confirmDelete(p) {
    const layer = document.createElement('div');
    layer.className = 'overlay';
    layer.id = 'overlay';
    layer.innerHTML = `
      <div class="modal" style="width:min(400px,100%);" role="dialog" aria-modal="true">
        <div class="modal-head"><h3>删除「${esc(p.name)}」？</h3><button class="x" data-close>×</button></div>
        <div class="modal-body">
          <div style="font-size:12.8px;line-height:1.65;color:#b9c1cb;">
            会删掉这个项目的任务记录、Library 记忆文件和受管的本地 worktree。
            <strong style="color:#e6e9ee;">已经推到 GitHub 的分支和 PR 不受影响。</strong>
          </div>
          <div style="font-size:11.5px;color:#6f7885;">这个操作不能撤销。</div>
        </div>
        <div class="modal-foot">
          <button class="btn" data-close>取消</button>
          <button class="btn danger" id="delBtn">删除</button>
        </div>
      </div>`;
    $('#layers').appendChild(layer);
    layer.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeOverlay));
    layer.addEventListener('click', (e) => { if (e.target === layer) closeOverlay(); });
    $('#delBtn').addEventListener('click', () => {
      const idx = DB.projects.findIndex((x) => x.id === p.id);
      if (idx >= 0) DB.projects.splice(idx, 1);
      if (S.activeProject === p.id) S.activeProject = DB.projects[0].id;
      closeOverlay();
      render();
      toast(`「${p.name}」已删除`);
    });
  }

  function openAddToProject(wsId) {
    const ws = DB.workspaces.find((w) => w.id === wsId);
    const layer = document.createElement('div');
    layer.className = 'overlay';
    layer.id = 'overlay';
    layer.innerHTML = `
      <div class="modal" style="width:min(420px,100%);" role="dialog" aria-modal="true">
        <div class="modal-head"><h3>把「${esc(ws.name)}」加入项目</h3><button class="x" data-close>×</button></div>
        <div class="modal-body">
          <div style="font-size:12.5px;color:#a6b0bc;line-height:1.6;">
            协调者会读这个工作区里的会话记录，把已经摸清的东西整理成项目上下文和待办任务。
          </div>
          <div class="repo-list">
            ${DB.projects
              .filter((p) => p.status === 'active')
              .map((p) => `<div class="repo-item" data-target="${p.id}">
                <span class="avatar tone-${p.tone}" style="width:18px;height:18px;font-size:10px;">${p.icon}</span>
                <span class="rname" style="font-family:var(--sans);">${esc(p.name)}</span>
                <span class="rtag">${p.tasks.length} 个任务</span>
              </div>`)
              .join('')}
          </div>
        </div>
        <div class="modal-foot"><button class="btn" data-close>取消</button></div>
      </div>`;
    $('#layers').appendChild(layer);
    layer.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeOverlay));
    layer.addEventListener('click', (e) => { if (e.target === layer) closeOverlay(); });
    layer.querySelectorAll('[data-target]').forEach((row) => {
      row.addEventListener('click', () => {
        const p = DB.projects.find((x) => x.id === row.dataset.target);
        closeOverlay();
        if (!p) return;
        p.messages.push({ kind: 'system', text: `已收编工作区「${ws.name}」` });
        p.messages.push({
          kind: 'agent',
          text: `读完了「${esc(ws.name)}」里的会话。我整理出两条要沉淀进 <code>INDEX.md</code> 的结论，先放 Library 里等你确认；另外有一个可以立刻开工的任务，要我派下去吗？`
        });
        p.tasks.unshift({
          id: `${p.id === 'youshi-product' ? 'YOU' : p.id === 'bzti' ? 'BZT' : 'NAT'}-${p.nextSeq++}`,
          title: `跟进「${ws.name}」里的遗留问题`,
          status: 'queued',
          repo: p.repos[0] || '',
          desc: '从收编的会话里提取的待办。',
          worker: '',
          worktree: '',
          model: 'Gemini 4 Argon',
          prs: [],
          timeline: []
        });
        S.activeProject = p.id;
        render();
        toast(`已加入「${p.name}」`);
      });
    });
  }

  function focusInput(prefix) {
    const input = $('#input');
    if (!input) return;
    input.focus();
    if (prefix) {
      input.value = prefix;
      input.selectionStart = input.selectionEnd = prefix.length;
      autoGrow(input);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('#overlay')) { closeOverlay(); return; }
      if ($('#popMenu')) { closeMenu(); return; }
      if (S.mention) { closeMention(); return; }
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    const d = $('#dismissNotice');
    if (d) d.addEventListener('click', () => $('#noticeBar').classList.add('hidden'));
  });

  $('#dismissNotice').addEventListener('click', () => $('#noticeBar').classList.add('hidden'));

  /* =========================================================
     深链：方便逐个视图验收
     #board / #library / #detail=YOU-4 / #tray / #new
     ========================================================= */
  function applyHash() {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    const [k, v] = h.split('=');
    if (k === 'board') S.rightPane = 'board';
    else if (k === 'library') S.rightPane = 'library';
    else if (k === 'detail' && v) { S.detailTask = decodeURIComponent(v); }
    else if (k === 'tray') S.trayOpen = true;
    else if (k === 'project' && v) S.activeProject = decodeURIComponent(v);
  }
  applyHash();
  window.addEventListener('hashchange', () => { applyHash(); render(); });

  /* 启动 */
  render();
  if (location.hash === '#new') openCreateProject();
})();
</script>
</body>
</html>
