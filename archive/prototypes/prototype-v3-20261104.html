<!DOCTYPE html>
<html lang="zh-CN" data-brand="deepseek">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<style>
  @font-face {
    font-family: "Inter Var";
    src: url("./fonts/InterVariable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Noto Serif Var";
    src: url("./fonts/NotoSerifVariable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono Var";
    src: url("./fonts/JetBrainsMonoVariable.ttf") format("truetype-variations");
    font-weight: 100 800;
    font-display: swap;
  }

  /* =========================================================
     令牌：对齐 dsh-claude-style 的两张色卡与动效曲线
     ========================================================= */
  :root {
    --font-ui: "Inter Var", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-serif: "Noto Serif Var", "Songti SC", "Source Han Serif SC", Georgia, serif;
    --font-mono: "JetBrains Mono Var", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

    --r-xs: 4px;
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 10px;
    --r-xl: 12px;

    --dur-instant: 80ms;
    --dur-feedback: 120ms;
    --dur-surface: 150ms;
    --dur-open: 250ms;
    --dur-exit: 120ms;
    --dur-slide: 240ms;

    --ease-standard: ease;
    --ease-settle: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
    --ease-glide: cubic-bezier(0.22, 0.61, 0.36, 1);
    --ease-damped: cubic-bezier(0.32, 0, 0.67, 0);

    --shadow-pop: 0 14px 36px rgba(0, 0, 0, 0.38), 0 2px 6px rgba(0, 0, 0, 0.18);
    --shadow-modal: 0 24px 72px rgba(0, 0, 0, 0.52), 0 2px 8px rgba(0, 0, 0, 0.22);

    --sidebar-w: 264px;
    --right-w: 392px;
  }

  /* DeepSeek 色卡（默认） */
  html[data-brand="deepseek"] {
    --canvas: #13161d;
    --sidebar: #13161d;
    --surface-1: #1b1e26;
    --surface-2: #22252d;
    --surface-3: #2b2f37;
    --card: #1d2028;
    --overlay: #22252d;
    --inset: #0e1117;
    --plate: #2b2f37;

    --ink: #f4f9ff;
    --ink-2: #aeb5c4;
    --ink-3: #8a92a3;
    --ink-4: #676e7d;
    --prose: #dce3ee;

    --border-1: #23262e;
    --border-2: #2c3038;
    --border-3: #3a3d46;
    --divider: rgba(251, 255, 255, 0.06);
    --hover-wash: rgba(251, 255, 255, 0.055);
    --row-active: rgba(251, 255, 255, 0.07);

    --accent: #4d6bfe;
    --accent-hover: #6a84ff;
    --accent-tint: #252f4c;
    --on-accent: #ffffff;

    --bubble: #262b36;
    --code-wash: rgba(251, 255, 255, 0.05);
    --code-ink: #eef1f8;
    --link: #8fa4ff;

    --ok: #65b57f;
    --warn: #e0b168;
    --info: #9bb0ff;
    --danger: #f0706a;

    --tone-blue: #7f9dff;
    --tone-pink: #e39bbd;
    --tone-purple: #b39cf6;
    --tone-amber: #dcb073;
    --tone-green: #7cc495;
  }

  /* Claude 色卡 */
  html[data-brand="claude"] {
    --canvas: #191919;
    --sidebar: #1f1f1f;
    --surface-1: #212121;
    --surface-2: #282828;
    --surface-3: #323232;
    --card: #232323;
    --overlay: #282828;
    --inset: #141414;
    --plate: #323232;

    --ink: #fdfdfd;
    --ink-2: #beb6b8;
    --ink-3: #9c9395;
    --ink-4: #776f71;
    --prose: #e7e2e3;

    --border-1: rgba(255, 255, 255, 0.09);
    --border-2: rgba(255, 255, 255, 0.18);
    --border-3: rgba(255, 255, 255, 0.3);
    --divider: rgba(255, 255, 255, 0.06);
    --hover-wash: rgba(255, 255, 255, 0.07);
    --row-active: rgba(255, 255, 255, 0.08);

    --accent: #d97757;
    --accent-hover: #eb9170;
    --accent-tint: #48261b;
    --on-accent: #ffffff;

    --bubble: rgba(255, 255, 255, 0.06);
    --code-wash: rgba(255, 255, 255, 0.05);
    --code-ink: #e8a08a;
    --link: #8ab4f8;

    --ok: #62b47e;
    --warn: #d9a95c;
    --info: #8ab4f8;
    --danger: #e5766b;

    --tone-blue: #8ab4f8;
    --tone-pink: #e3a0b8;
    --tone-purple: #c0a6f0;
    --tone-amber: #dfb27a;
    --tone-green: #8cc7a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.55;
    letter-spacing: -0.002em;
    font-feature-settings: "cv05" 1, "ss03" 1;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button, [role="button"] { -webkit-tap-highlight-color: transparent; }
  svg { flex: 0 0 auto; }

  ::selection { background: color-mix(in srgb, var(--accent) 34%, transparent); color: var(--ink); }

  :focus-visible {
    outline: 2px solid color-mix(in srgb, var(--accent) 66%, var(--ink) 12%);
    outline-offset: 1px;
  }
  .composer textarea:focus-visible,
  .side-search input:focus-visible,
  .tray-custom input:focus-visible,
  .field input[type="text"]:focus-visible {
    outline: none;
  }
  .side-search:focus-within {
    border-color: color-mix(in srgb, var(--accent) 38%, var(--border-2));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: transparent;
    border: 3px solid transparent;
    background-clip: content-box;
    border-radius: 8px;
  }
  *:hover::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.18); background-clip: content-box; }

  .hidden { display: none !important; }

  .tone-blue { --tone: var(--tone-blue); }
  .tone-pink { --tone: var(--tone-pink); }
  .tone-purple { --tone: var(--tone-purple); }
  .tone-amber { --tone: var(--tone-amber); }
  .tone-green { --tone: var(--tone-green); }

  /* =========================================================
     骨架
     ========================================================= */
  .app {
    height: 100%;
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--right-w);
    overflow: hidden;
    transition: grid-template-columns var(--dur-open) var(--ease-settle);
  }
  .app.right-closed { grid-template-columns: var(--sidebar-w) minmax(0, 1fr) 0px; }
  .app.right-closed .right-col {
    border-left-color: transparent;
    opacity: 0;
    pointer-events: none;
  }

  /* =========================================================
     左栏
     ========================================================= */
  .side {
    background: var(--sidebar);
    border-right: 1px solid var(--divider);
    display: flex;
    flex-direction: column;
    min-height: 0;
    user-select: none;
  }

  .side-top { flex: 0 0 auto; padding: 8px 8px 0; }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    padding: 0 8px;
    border-radius: var(--r-sm);
  }
  .brand .mark {
    width: 20px;
    height: 20px;
    display: inline-flex;
    color: var(--ink);
  }
  html[data-brand="deepseek"] .brand .mark { color: var(--accent); }
  .brand .wordmark {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.018em;
    color: var(--ink);
  }
  .brand .toggle {
    margin-left: auto;
    opacity: 0.45;
  }
  .brand:hover .toggle, .brand .toggle:focus-visible { opacity: 1; }

  .nav { display: flex; flex-direction: column; gap: 1px; padding-top: 6px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 30px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    color: var(--ink-2);
    font-size: 13px;
    cursor: pointer;
    transition: background var(--dur-feedback) var(--ease-standard),
                color var(--dur-feedback) var(--ease-standard);
  }
  .nav-item:hover { background: var(--hover-wash); color: var(--ink); }
  .nav-item .ico {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    transition: color var(--dur-feedback);
  }
  .nav-item:hover .ico { color: var(--ink-2); }
  .nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .kbd {
    font-size: 10px;
    color: var(--ink-4);
    border: 1px solid var(--border-1);
    border-radius: var(--r-xs);
    padding: 0 4px;
    line-height: 15px;
    opacity: 0;
    transition: opacity var(--dur-feedback);
  }
  .nav-item:hover .kbd { opacity: 1; }

  .side-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 8px 12px;
  }

  .sec {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 28px;
    margin-top: 14px;
    padding: 0 8px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink-4);
  }
  .sec .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec .acts { display: flex; gap: 1px; opacity: 0.55; transition: opacity var(--dur-feedback); }
  .sec:hover .acts, .sec:focus-within .acts { opacity: 1; }

  .iconbtn {
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-sm);
    color: var(--ink-3);
    transition: background var(--dur-feedback) var(--ease-standard),
                color var(--dur-feedback) var(--ease-standard),
                transform var(--dur-instant) var(--ease-standard);
  }
  .iconbtn:hover { background: var(--hover-wash); color: var(--ink); }
  .iconbtn:active { transform: scale(0.94); }
  .iconbtn.on { color: var(--accent); }
  .iconbtn.sm { width: 22px; height: 22px; }
  .iconbtn.attention { color: var(--warn); }

  .side-search {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    margin: 4px 0 6px;
    padding: 0 7px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-sm);
    animation: rise var(--dur-surface) var(--ease-settle);
  }
  .side-search .si { color: var(--ink-4); display: inline-flex; }
  .side-search input { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink); }
  .side-search input::placeholder { color: var(--ink-4); }
  .side-search .esc {
    font-size: 9.5px;
    color: var(--ink-4);
    border: 1px solid var(--border-1);
    border-radius: 3px;
    padding: 0 4px;
    line-height: 15px;
  }
  .side-empty {
    padding: 14px 8px;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-4);
  }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--dur-feedback) var(--ease-standard);
  }
  .row:hover { background: var(--hover-wash); }
  .row.on { background: var(--row-active); }
  .row:focus-visible { outline-offset: -2px; }

  .row .glyph {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1;
    color: var(--tone, var(--ink-3));
    background: color-mix(in srgb, var(--tone, var(--ink-3)) 16%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tone, var(--ink-3)) 22%, transparent);
  }
  .row.on .glyph {
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tone, var(--ink-3)) 38%, transparent);
  }
  .row .name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color var(--dur-feedback);
  }
  .row.on .name { color: var(--ink); font-weight: 500; }
  .row:hover .name { color: var(--ink); }
  .row .tail {
    font-size: 11px;
    color: var(--ink-4);
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
    transition: opacity var(--dur-feedback);
  }
  .row .unread {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex: 0 0 auto;
  }
  .row .paused { color: var(--ink-4); display: inline-flex; }
  .row .more {
    position: absolute;
    right: 5px;
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-xs);
    color: var(--ink-2);
    opacity: 0;
    transition: opacity var(--dur-feedback), background var(--dur-feedback);
  }
  .row:hover .more, .row .more:focus-visible { opacity: 1; }
  .row .more:hover { background: var(--surface-3); color: var(--ink); }
  .row:hover .tail { opacity: 0; }

  .row .folder { width: 16px; display: inline-flex; justify-content: center; color: var(--ink-4); }
  .row:hover .folder { color: var(--ink-3); }

  .row.archived { opacity: 0.5; }
  .archive-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 26px;
    margin-top: 4px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    font-size: 11.5px;
    color: var(--ink-4);
    cursor: pointer;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .archive-toggle:hover { background: var(--hover-wash); color: var(--ink-2); }

  .side-foot {
    flex: 0 0 auto;
    border-top: 1px solid var(--divider);
    padding: 7px 8px;
  }
  .account {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--dur-feedback);
  }
  .account:hover { background: var(--hover-wash); }
  .account .ava {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 9.5px;
    font-weight: 650;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #8ab4f8));
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
  }
  .account .name { flex: 1; font-size: 12.5px; color: var(--ink-2); }
  .account .gear { opacity: 0.4; transition: opacity var(--dur-feedback); }
  .account:hover .gear { opacity: 1; }

  /* =========================================================
     中栏
     ========================================================= */
  .center {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--canvas);
  }

  .center-head {
    flex: 0 0 auto;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px 0 20px;
    border-bottom: 1px solid var(--divider);
    position: relative;
    z-index: 6;
  }
  .head-title {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .head-title .glyph {
    width: 19px;
    height: 19px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--tone, var(--ink-3));
    background: color-mix(in srgb, var(--tone, var(--ink-3)) 14%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tone, var(--ink-3)) 22%, transparent);
  }
  .pname {
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.006em;
    color: var(--ink);
    white-space: nowrap;
  }
  .goal {
    font-size: 12px;
    color: var(--ink-4);
    padding-left: 10px;
    border-left: 1px solid var(--divider);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 340px;
  }
  .head-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .attention-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 9px;
    margin-right: 4px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--warn) 26%, transparent);
    background: color-mix(in srgb, var(--warn) 8%, transparent);
    color: var(--warn);
    font-size: 11.5px;
    transition: background var(--dur-feedback), border-color var(--dur-feedback);
  }
  .attention-chip:hover { background: color-mix(in srgb, var(--warn) 14%, transparent); border-color: color-mix(in srgb, var(--warn) 38%, transparent); }
  .attention-chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .stream {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 24px;
  }
  .stream-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 0 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .stream-inner.hero-mode {
    min-height: 100%;
    justify-content: center;
    padding-bottom: 44px;
  }
  .stream-inner.hero-mode .hero { padding-top: 0; }
  .jump {
    position: absolute;
    right: 22px;
    bottom: 130px;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    color: var(--ink-2);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
    z-index: 5;
    animation: rise var(--dur-surface) var(--ease-settle);
    transition: background var(--dur-feedback), color var(--dur-feedback), transform var(--dur-feedback);
  }
  .jump:hover { background: var(--surface-3); color: var(--ink); transform: translateY(1px); }
  .jump[hidden] { display: none; }

  .stream-shade {
    position: absolute;
    left: 0;
    right: 0;
    top: 52px;
    height: 18px;
    background: linear-gradient(to bottom, var(--canvas) 10%, transparent);
    opacity: 0;
    pointer-events: none;
    z-index: 2;
    transition: opacity var(--dur-surface) var(--ease-standard);
  }
  .center.scrolled .stream-shade { opacity: 1; }

  /* 消息 */
  .msg { display: flex; flex-direction: column; min-width: 0; }
  .msg.agent { position: relative; }
  .msg.user { align-items: flex-end; gap: 3px; }
  .msg.user .bubble {
    max-width: min(560px, 82%);
    background: var(--bubble);
    border-radius: var(--r-xl);
    padding: 9px 13px;
    font-size: 14px;
    line-height: 1.68;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .msg.user .attachments { margin-top: 5px; justify-content: flex-end; }
  .msg-foot {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 20px;
    font-size: 11px;
    color: var(--ink-4);
  }
  .msg.user .msg-foot { padding-right: 2px; }
  .msg.agent .msg-foot {
    position: absolute;
    right: 0;
    bottom: -20px;
    height: 18px;
    opacity: 0;
    transition: opacity var(--dur-feedback);
    z-index: 1;
  }
  .msg.agent:hover .msg-foot, .msg.agent:focus-within .msg-foot { opacity: 1; }
  .msg.agent:hover { z-index: 2; }
  .msg-act {
    width: 22px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-xs);
    color: var(--ink-4);
    opacity: 0;
    transition: opacity var(--dur-feedback), background var(--dur-feedback), color var(--dur-feedback);
  }
  .msg:hover .msg-act { opacity: 0.75; }
  .msg-act:hover { opacity: 1; background: var(--hover-wash); color: var(--ink-2); }

  .msg.agent .txt {
    font-size: 14px;
    line-height: 1.72;
    color: var(--prose);
    overflow-wrap: anywhere;
  }
  .msg.agent .txt + .artifact { margin-top: 10px; }

  .msg.enter { animation: msgIn var(--dur-open) var(--ease-settle); }
  .stream-inner.swap { animation: swapIn 180ms var(--ease-settle); }
  @keyframes swapIn {

  }

  }

  .relay {
    display: flex;
    align-items: center;
    gap: 10px;

    margin: -3px 0;

  .relay .line { flex: 1; height: 1px; background: var(--divider); }
  .relay .chev { opacity: 0; transition: opacity var(--dur-feedback); }
  .relay:hover .label, .relay:hover .chev { color: var(--ink-2); opacity: 0.7; }

  .artifact {

  .artifact .thumb {

    place-items: center;

      radial-gradient(120% 120% at 20% 10%, rgba(255, 255, 255, 0.14), transparent 50%),
      linear-gradient(135deg, #2b3350, #191d29);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.08);
  }
  html[data-brand="claude"] .artifact .thumb {
    background:
      radial-gradient(120% 120% at 20% 10%, rgba(255, 255, 255, 0.12), transparent 50%),
      linear-gradient(135deg, #4a2d25, #241b18);
  }
  .artifact .thumb .play {
    width: 22px;
    height: 22px;
    border-radius: 50%;

    place-items: center;

    transition: transform var(--dur-feedback) var(--ease-spring), background var(--dur-feedback);
  }
  .artifact:hover .thumb .play { transform: scale(1.08); background: rgba(255, 255, 255, 0.22); }
  .artifact .thumb .dur {
    position: absolute;

    bottom: 3px;
    font-size: 9px;
    color: rgba(255, 255, 255, 0.78);
    font-variant-numeric: tabular-nums;
  }
  .artifact .meta { min-width: 0; }
  .artifact .meta .nm {
    font-size: 12.5px;
    font-weight: 550;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .artifact .meta .sub { font-size: 11px; color: var(--ink-4); margin-top: 1px; }
  .artifact .open {
    margin-left: auto;
    padding: 3px 8px;
    border-radius: var(--r-xs);
    background: var(--surface-2);
    font-size: 11.5px;
    color: var(--ink-3);
    opacity: 0;
    transition: opacity var(--dur-feedback), background var(--dur-feedback), color var(--dur-feedback);
  }
  .artifact:hover .open { opacity: 1; background: var(--surface-3); color: var(--ink); }

  code.inl {
    font-family: var(--font-mono);
    font-size: 0.86em;
    background: var(--code-wash);
    color: var(--code-ink);
    border-radius: var(--r-xs);

  .ref {

  .attachments { display: flex; flex-wrap: wrap; gap: 5px; }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 5px 0 7px;
    border-radius: var(--r-xs);

    color: var(--ink-2);

  }
  .attach-chip .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .rm {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border-radius: 3px;
    color: var(--ink-4);
  }
  .attach-chip .rm:hover { background: var(--hover-wash); color: var(--ink); }

  /* 空态与首屏 */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 9vh 4px 0;
    max-width: 560px;
  }
  .hero .kicker { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-4); }
  .hero h1 {
    font-family: var(--font-serif);
    font-size: 26px;
    line-height: 1.36;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .hero p { font-size: 13px; line-height: 1.7; color: var(--ink-3); max-width: 460px; }
  .hero-sugs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .sug {
    height: 30px;
    padding: 0 11px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border-1);
    background: var(--surface-1);

    color: var(--ink-2);
    transition: background var(--dur-feedback), border-color var(--dur-feedback), color var(--dur-feedback);
  }
  .sug:hover { background: var(--surface-2); border-color: var(--border-2); color: var(--ink); }

  /* =========================================================
     输入区
     ========================================================= */
  .dock {
    flex: 0 0 auto;
    position: relative;
    padding: 0 24px 14px;
    background: var(--canvas);
    z-index: 4;
  }
  .dock::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: -42px;
    height: 42px;
    background: linear-gradient(to bottom, transparent, var(--canvas) 72%);
    pointer-events: none;
  }
  .dock-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; }

  .pills { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 22px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    border: 1px solid var(--border-1);
    background: transparent;
    color: var(--ink-3);
    font-size: 11.5px;
    white-space: nowrap;
    transition: background var(--dur-feedback), border-color var(--dur-feedback), color var(--dur-feedback);
  }
  .pill:hover { background: var(--surface-1); border-color: var(--border-2); color: var(--ink-2); }
  .pill .n { font-size: 11px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
  .pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .pill .live { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
  .pill.alert {
    color: var(--warn);
    border-color: color-mix(in srgb, var(--warn) 28%, transparent);
    background: color-mix(in srgb, var(--warn) 7%, transparent);
  }
  .pill.alert:hover { background: color-mix(in srgb, var(--warn) 13%, transparent); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .pill.alert .dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 12%, transparent); }

  .tray {
    margin-bottom: 10px;
    padding: 12px 14px;
    border: 1px solid color-mix(in srgb, var(--warn) 24%, var(--border-1));
    background: linear-gradient(180deg, color-mix(in srgb, var(--warn) 7%, var(--surface-1)), var(--surface-1));
    border-radius: var(--r-lg);
    animation: rise var(--dur-open) var(--ease-settle);
  }
  .tray-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; font-size: 11.5px; color: var(--warn); }
  .tray-head .who { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; min-width: 0; }
  .tray-head .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tray-head .from { margin-left: auto; color: var(--ink-4); font-size: 11px; white-space: nowrap; }
  .tray-q {
    max-width: 640px;
    margin: 0 2px 10px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--prose);
  }
  .tray-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .tray-opt {
    height: 27px;
    padding: 0 10px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    font-size: 12px;
    color: var(--ink-2);
    text-align: left;
    transition: background var(--dur-feedback), border-color var(--dur-feedback), color var(--dur-feedback);
  }
  .tray-opt:hover { background: var(--surface-3); border-color: var(--border-3); color: var(--ink); }
  .tray-custom { display: flex; gap: 6px; margin-top: 8px; }
  .tray-custom input {
    flex: 1;
    height: 28px;
    padding: 0 9px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-sm);
    font-size: 12px;
    color: var(--ink);
    transition: border-color var(--dur-feedback);
  }
  .tray-custom input::placeholder { color: var(--ink-4); }
  .tray-custom input:focus { border-color: var(--border-3); }
  .tray-custom .btn { height: 28px; }

  .composer {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    border-radius: var(--r-lg);
    padding: 7px 8px 6px;
    transition: border-color var(--dur-surface) var(--ease-standard),
                box-shadow var(--dur-surface) var(--ease-standard),
                background var(--dur-surface) var(--ease-standard);
  }
  .composer:focus-within {
    border-color: color-mix(in srgb, var(--accent) 30%, var(--border-2));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 9%, transparent);
  }
  .composer-row { display: flex; align-items: flex-end; gap: 6px; }
  .composer textarea {
    flex: 1;
    min-width: 0;
    min-height: 26px;
    max-height: 160px;
    resize: none;
    font-family: var(--font-ui);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
    padding: 4px 2px 2px;
  }
  .composer textarea::placeholder { color: var(--ink-4); }
  .composer .attachments { margin: 1px 2px 6px; }
  .composer .send {
    width: 26px;
    height: 26px;
    margin-left: 2px;
    margin-bottom: 1px;
    border-radius: var(--r-sm);
    display: grid;
    place-items: center;
    background: var(--accent);
    color: var(--on-accent);
    transition: background var(--dur-feedback), color var(--dur-feedback), transform var(--dur-instant), opacity var(--dur-feedback);
  }
  .composer .send:hover { background: var(--accent-hover); }
  .composer .send:active { transform: scale(0.92); }
  .composer .send:disabled {
    background: transparent;
    color: var(--ink-4);
    box-shadow: inset 0 0 0 1px var(--border-1);
    cursor: default;
    opacity: 0.8;
  }

  .dock-foot {
    display: flex;
    align-items: center;
    height: 20px;
    margin-top: 5px;
    padding: 0 2px;
  }
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 20px;
    padding: 0 4px;
    border-radius: var(--r-xs);
    font-size: 12px;
    color: var(--ink-4);
    transition: color var(--dur-feedback), background var(--dur-feedback);
  }
  .status-chip:hover { color: var(--ink-2); background: var(--hover-wash); }
  .status-chip .chev { opacity: 0.6; }
  .status-chip.model { color: var(--ink-3); max-width: 240px; }
  .status-chip.model span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot-spacer { flex: 1; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 0; }
  .typing i {
    width: 4.5px;
    height: 4.5px;
    border-radius: 50%;
    background: var(--ink-4);
    animation: breathe 1.3s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.16s; }
  .typing i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes breathe {
    0%, 65%, 100% { opacity: 0.3; }
    32% { opacity: 1; }
  }

  /* @ 引用 */
  .mention {
    position: absolute;
    left: 0;
    right: auto;
    width: min(440px, 100%);
    bottom: calc(100% + 6px);
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    padding: 4px;
    max-height: 236px;
    overflow-y: auto;
    z-index: 40;
    animation: menuIn var(--dur-surface) var(--ease-settle);
  }
  .mention .mh {
    display: flex;
    align-items: center;
    padding: 5px 8px 6px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-4);
  }
  .mention .mh .n { margin-left: auto; font-weight: 500; }
  .mrow {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 30px;
    padding: 0 8px;
    border-radius: var(--r-xs);
    font-size: 12.5px;
    color: var(--ink-2);
    text-align: left;
  }
  .mrow:hover { background: var(--hover-wash); color: var(--ink); }
  .mrow.sel { background: var(--surface-2); color: var(--ink); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--accent) 72%, transparent); }
  .mrow .mid { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); width: 39px; }
  .mrow .mtt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .mdot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto; }

  /* =========================================================
     右栏
     ========================================================= */
  .right-col {
    position: relative;
    display: flex;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border-left: 1px solid var(--divider);
    background: var(--canvas);
    transition: opacity var(--dur-surface) var(--ease-standard);
  }
  .pane-resizer {
    position: absolute;

    z-index: 15;
    cursor: col-resize;
    outline: none;
    user-select: none;
  }
  .pane-resizer::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background: transparent;
    transition: background var(--dur-feedback);
  }
  .pane-resizer:hover::after, .pane-resizer.dragging::after, .pane-resizer:focus-visible::after {
    background: color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .right-closed .pane-resizer { display: none; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing .app { transition: none; }

  .right-panel { display: flex; flex-direction: column; width: 100%; min-width: 0; }
  .right-head {
    flex: 0 0 auto;
    height: 52px;
    display: flex;
    align-items: center;

    font-size: 10px;

    color: var(--tone, var(--ink-3));
    background: color-mix(in srgb, var(--tone, var(--ink-3)) 14%, transparent);
    box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tone, var(--ink-3)) 22%, transparent);
  }
  .r-title .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
  .right-head .spacer { flex: 1; }
  .right-body {

    min-height: 0;
    overflow-y: auto;
    padding: 0 8px 24px;

  .seg {
    display: inline-flex;
    align-items: center;
    gap: 1px;
    padding: 2px;
    border-radius: 7px;
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    flex: 0 0 auto;

  .seg button {
    height: 22px;
    padding: 0 8px;
    border-radius: 5px;
    font-size: 11.5px;
    color: var(--ink-3);

    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on {
    background: var(--surface-3);
    color: var(--ink);
    font-weight: 500;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.18);

  .overview {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 8px;

  .overview .sep { width: 1px; height: 10px; background: var(--divider); }
  .overview .bar {
    width: 52px;
    height: 3px;
    border-radius: 2px;
    background: var(--surface-2);
    overflow: hidden;
    margin-left: auto;
  }
  .overview .bar i { display: block; height: 100%; border-radius: 2px; background: var(--ink-4); }
  .overview .pct { font-variant-numeric: tabular-nums; }

  .grp {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    margin-top: 5px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    background: var(--canvas);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-3);
    cursor: pointer;
    user-select: none;

  .grp:hover { background: var(--hover-wash); }
  .grp .chev { width: 10px; display: grid; place-items: center; color: var(--ink-4); }
  .grp .dot { width: 5px; height: 5px; border-radius: 50%; }
  .grp .txt { flex: 1; min-width: 0; }
  .grp .count { font-weight: 500; color: var(--ink-4); font-variant-numeric: tabular-nums; }

  .task {

    gap: 8px;
    height: 31px;

    cursor: pointer;
    transition: background var(--dur-feedback);

  .task.sel { background: var(--surface-2); }

  .task .id {
    font-family: var(--font-mono);
    font-size: 10.5px;

    letter-spacing: -0.01em;

  .task .ttl {
    font-size: 12.5px;
    color: var(--ink-2);

    text-overflow: ellipsis;

    transition: color var(--dur-feedback);

  .task:hover .ttl, .task.sel .ttl { color: var(--ink); }
  .task .end { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }

  .tag {

  .tag.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  /* 看板 */

    display: flex;
    align-items: center;

    height: 24px;
    padding: 0 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-3);
  }
  .lane-h .dot { width: 5px; height: 5px; border-radius: 50%; }
  .lane-h .count { margin-left: auto; color: var(--ink-4); font-weight: 500; font-variant-numeric: tabular-nums; }
  .bcard {
    display: flex;
    flex-direction: column;

    padding: 10px 11px;
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background var(--dur-feedback), border-color var(--dur-feedback);
  }
  .bcard:hover { background: var(--surface-2); border-color: var(--border-2); }
  .bcard .bid { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); }
  .bcard .bttl { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
  .bcard:hover .bttl { color: var(--ink); }
  .bcard .bottom { display: flex; flex-wrap: wrap; gap: 4px; }

  /* Library */
  .lib-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 31px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--dur-feedback);
  }
  .lib-row:hover { background: var(--hover-wash); }
  .lib-row .ficon { width: 16px; display: grid; place-items: center; color: var(--ink-4); }
  .lib-row .p {
    flex: 1;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lib-row:hover .p { color: var(--ink); }
  .lib-row .m { font-size: 10px; color: var(--ink-4); white-space: nowrap; flex: 0 0 auto; font-variant-numeric: tabular-nums; }

  /* 任务详情 */
  .detail { display: flex; flex-direction: column; gap: 13px; padding: 10px 8px 8px; animation: panelIn var(--dur-surface) var(--ease-settle); }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    align-self: flex-start;
    height: 24px;
    margin-left: -6px;
    padding: 0 6px;
    border-radius: var(--r-xs);
    font-size: 11.5px;
    color: var(--ink-4);
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .back:hover { background: var(--hover-wash); color: var(--ink-2); }
  .d-kicker { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); }
  .d-kicker .st {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-ui);
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 999px;
    color: var(--st, var(--ink-3));
    background: color-mix(in srgb, var(--st, var(--ink-3)) 12%, transparent);
  }
  .d-kicker .st i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .detail h2 {
    font-size: 15px;
    line-height: 1.45;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-top: -2px;
  }
  .d-desc { font-size: 12.5px; line-height: 1.66; color: var(--ink-2); }

  .meta-card {
    display: flex;
    flex-direction: column;
    padding: 4px 10px;
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
  }
  .meta-row { display: flex; align-items: center; gap: 8px; min-height: 27px; font-size: 11.5px; }
  .meta-row + .meta-row { border-top: 1px solid var(--divider); }
  .meta-row .k { width: 52px; flex: 0 0 auto; color: var(--ink-4); }
  .meta-row .v { flex: 1; min-width: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .meta-row .v.mono { font-family: var(--font-mono); font-size: 10.5px; }

  .question-card {
    padding: 10px 12px;
    border-radius: var(--r-md);
    border: 1px solid color-mix(in srgb, var(--warn) 22%, var(--border-1));
    background: color-mix(in srgb, var(--warn) 6%, var(--surface-1));
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-2);
  }
  .question-card .qk {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 5px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--warn);
  }

  .tl-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; color: var(--ink-4); margin-bottom: 9px; }
  .tl { display: flex; flex-direction: column; }
  .tl-i { display: grid; grid-template-columns: 11px minmax(0, 1fr); gap: 9px; padding-bottom: 12px; position: relative; }
  .tl-i:last-child { padding-bottom: 0; }
  .tl-i:not(:last-child)::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 12px;
    bottom: 2px;
    width: 1px;
    background: var(--divider);
  }
  .tl-d { width: 5px; height: 5px; border-radius: 50%; margin-top: 5px; background: var(--border-3); z-index: 1; }
  .tl-d.ok { background: var(--ok); }
  .tl-d.warn { background: var(--warn); }
  .tl-d.work { background: var(--info); }
  .tl-t { font-size: 12px; line-height: 1.55; color: var(--ink-2); }
  .tl-time { font-size: 10.5px; color: var(--ink-4); margin-top: 1px; }

  .log {
    max-height: 188px;
    overflow: auto;
    padding: 10px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.8;
    color: var(--ink-3);
    animation: rise var(--dur-surface) var(--ease-settle);
  }
  .log .lt { color: var(--ink-4); margin-right: 7px; }
  .log .ok { color: var(--ok); }
  .log .warn { color: var(--warn); }

  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 28px;
    padding: 0 10px;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: 12px;
    white-space: nowrap;
    transition: background var(--dur-feedback), color var(--dur-feedback), border-color var(--dur-feedback);
  }
  .btn:hover { background: var(--surface-3); color: var(--ink); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { background: transparent; border-color: var(--border-1); color: var(--ink-3); }
  .btn.ghost:hover { background: var(--hover-wash); border-color: var(--border-2); color: var(--ink); }
  .btn.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 11%, transparent); }
  .btn.danger:hover { background: color-mix(in srgb, var(--danger) 18%, transparent); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:disabled:hover { background: var(--surface-2); color: var(--ink-2); }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 52px 24px; text-align: center; color: var(--ink-4); font-size: 12px; }
  .empty .e-ico {
    width: 36px;
    height: 36px;
    border-radius: var(--r-lg);
    display: grid;
    place-items: center;
    color: var(--ink-3);
    background: var(--surface-1);
    border: 1px solid var(--border-1);
    margin-bottom: 2px;
  }
  .empty .h { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .empty p { font-size: 11.5px; line-height: 1.6; max-width: 236px; }
  .empty .btn { margin-top: 4px; }

  /* =========================================================
     Peek 与浮层
     ========================================================= */
  .peek {
    position: fixed;
    right: 12px;
    top: 62px;
    width: min(360px, calc(100vw - 24px));
    max-height: calc(100vh - 76px);
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border-2);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-pop);
    z-index: 120;
    overflow: hidden;
    animation: peekIn var(--dur-slide) var(--ease-settle);
  }
  @keyframes peekIn {
    from { opacity: 0; transform: translateX(10px) scale(0.995); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  .peek-head { display: flex; align-items: center; gap: 8px; padding: 13px 13px 0; }
  .peek-head .st {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 10.5px;
    color: var(--st, var(--ink-3));
    background: color-mix(in srgb, var(--st, var(--ink-3)) 12%, transparent);
  }
  .peek-head .st i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .peek-head .pid { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); }
  .peek-head .x { margin-left: auto; }
  .peek-body { padding: 10px 14px 13px; overflow-y: auto; }
  .peek h3 { font-size: 14.5px; line-height: 1.45; font-weight: 600; letter-spacing: -0.008em; color: var(--ink); }
  .peek .desc { margin-top: 7px; font-size: 12.5px; line-height: 1.62; color: var(--ink-2); }
  .peek .meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 9px; font-size: 11px; color: var(--ink-4); }
  .peek .meta .mono { font-family: var(--font-mono); font-size: 10px; }
  .peek .tl-label { margin-top: 14px; }
  .peek-foot { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--divider); background: color-mix(in srgb, var(--surface-1) 55%, transparent); }
  .peek-foot .spacer { flex: 1; }

  .floating {
    position: fixed;
    z-index: 130;
    min-width: 180px;
    max-width: 320px;
    padding: 4px;
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    animation: menuIn var(--dur-surface) var(--ease-settle);
  }
  .floating.pop { min-width: 280px; padding: 6px; }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-3px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 29px;
    padding: 0 8px;
    border-radius: var(--r-xs);
    font-size: 12.5px;
    color: var(--ink-2);
    text-align: left;
    white-space: nowrap;
    transition: background var(--dur-feedback), color var(--dur-feedback);
  }
  .menu-item:hover { background: var(--hover-wash); color: var(--ink); }
  .menu-item .mi { width: 14px; display: grid; place-items: center; color: var(--ink-4); }
  .menu-item:hover .mi { color: var(--ink-3); }
  .menu-item.danger { color: var(--danger); }
  .menu-item.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .menu-item.danger .mi { color: var(--danger); }
  .menu-item .check { margin-left: auto; color: var(--accent); }
  .menu-sep { height: 1px; background: var(--divider); margin: 4px 6px; }
  .menu-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px 7px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-4);
  }
  .menu-head .n { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
  .pop-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    padding: 7px 8px;
    border-radius: var(--r-xs);
    text-align: left;
    transition: background var(--dur-feedback);
  }
  .pop-row:hover { background: var(--hover-wash); }
  .pop-row .pdot { width: 5px; height: 5px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; }
  .pop-row .ptxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pop-row .ptitle { display: block; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop-row:hover .ptitle { color: var(--ink); }
  .pop-row .psub { display: block; font-size: 10.5px; color: var(--ink-4); margin-top: 1px; }
  .pop-row .pid { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); flex: 0 0 auto; margin-top: 2px; }
  .pop-foot { border-top: 1px solid var(--divider); margin-top: 4px; padding: 4px 0 0; }
  .pop-empty { padding: 14px 8px; font-size: 11.5px; color: var(--ink-4); text-align: center; }

  /* =========================================================
     弹窗与表单
     ========================================================= */
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(5, 7, 11, 0.56);
    backdrop-filter: blur(1.5px);
    z-index: 200;
    animation: fade var(--dur-surface) var(--ease-standard);
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: min(480px, 100%);
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-modal);
    overflow: hidden;
    animation: modalIn var(--dur-open) var(--ease-settle);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(8px) scale(0.992); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal.sm { width: min(392px, 100%); }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
  .modal-head h3 { flex: 1; font-size: 14px; font-weight: 600; letter-spacing: -0.006em; }
  .modal-head .x { color: var(--ink-4); }
  .modal-head .x:hover { color: var(--ink); }
  .modal-body { padding: 8px 18px 18px; display: flex; flex-direction: column; gap: 13px; }
  .modal-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--divider);
    background: color-mix(in srgb, var(--surface-1) 45%, transparent);
  }
  .modal-foot .hint { margin-right: auto; font-size: 11px; color: var(--ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .field label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
  .field label .opt { font-weight: 400; color: var(--ink-4); }
  .field input[type="text"] {
    width: 100%;
    height: 32px;
    padding: 0 9px;
    background: var(--inset);
    border: 1px solid var(--border-1);
    border-radius: var(--r-sm);
    font-size: 13px;
    color: var(--ink);
    transition: border-color var(--dur-feedback), box-shadow var(--dur-feedback);
  }
  .field input[type="text"]::placeholder { color: var(--ink-4); }
  .field input[type="text"]:focus {
    border-color: color-mix(in srgb, var(--accent) 34%, var(--border-2));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .field .hint { margin-top: 5px; font-size: 11px; color: var(--ink-4); }

  .icon-row { display: flex; gap: 7px; }
  .icon-opt {
    width: 31px;
    height: 31px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1.5px solid transparent;
    background: var(--surface-2);
    transition: border-color var(--dur-feedback), background var(--dur-feedback), transform var(--dur-feedback);
  }
  .icon-opt .glyph { width: 21px; height: 21px; border-radius: 6px; }
  .icon-opt:hover { background: var(--surface-3); }
  .icon-opt.on { border-color: var(--accent); background: var(--surface-1); }
  .icon-opt:active { transform: scale(0.94); }

  .repo-list { display: flex; flex-direction: column; gap: 1px; max-height: 188px; overflow-y: auto; }
  .repo {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 33px;
    padding: 0 8px;
    border-radius: var(--r-sm);
    font-size: 12.5px;
    color: var(--ink-2);
    cursor: pointer;
    transition: background var(--dur-feedback);
  }
  .repo:hover { background: var(--hover-wash); }
  .repo .box {
    width: 14px;
    height: 14px;
    border-radius: var(--r-xs);
    border: 1.5px solid var(--border-3);
    display: grid;
    place-items: center;
    color: transparent;
    transition: background var(--dur-feedback), border-color var(--dur-feedback);
  }
  .repo.on .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .repo .rn { font-family: var(--font-mono); font-size: 11.5px; }
  .repo .rt { margin-left: auto; font-size: 10.5px; color: var(--ink-4); }

  .confirm-copy { font-size: 12.5px; line-height: 1.68; color: var(--ink-2); }
  .confirm-copy strong { color: var(--ink); font-weight: 550; }

  /* 文档预览 */
  .doc-head { display: flex; align-items: center; gap: 8px; padding: 16px 20px 10px; }
  .doc-head .path { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-body { max-height: min(58vh, 560px); overflow-y: auto; padding: 4px 20px 26px; }
  .doc-body.fade-bottom {
    mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent);
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent);
  }
  .doc-body h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.012em; margin: 6px 0 10px; }
  .doc-body h2 { font-size: 12.5px; font-weight: 600; color: var(--ink); margin: 16px 0 6px; }
  .doc-body p { font-size: 12.5px; line-height: 1.75; color: var(--ink-2); }
  .doc-body ul { margin: 4px 0 4px 18px; color: var(--ink-2); font-size: 12.5px; line-height: 1.75; }
  .doc-body li + li { margin-top: 2px; }
  .doc-body .front { padding: 8px 10px; background: var(--inset); border: 1px solid var(--border-1); border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 10.5px; line-height: 1.7; color: var(--ink-4); white-space: pre-wrap; margin-bottom: 12px; }
  .doc-body .doc-code { margin: 8px 0; padding: 10px 11px; background: var(--inset); border: 1px solid var(--border-1); border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 11px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; }
  .doc-body .doc-quote { margin: 8px 0; padding: 6px 10px; border-left: 2px solid var(--border-3); color: var(--ink-3); font-size: 12.5px; line-height: 1.7; }
  .doc-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--divider); background: color-mix(in srgb, var(--surface-1) 45%, transparent); }
  .doc-foot .spacer { flex: 1; }

  .stage {
    position: relative;
    aspect-ratio: 16 / 9;
    margin: 4px 0 0;
    border-radius: var(--r-md);
    overflow: hidden;
    background:
      radial-gradient(90% 90% at 70% 20%, rgba(126, 157, 255, 0.18), transparent 60%),
      linear-gradient(140deg, #232a3d, #13161d 70%);
    border: 1px solid var(--border-1);
    display: grid;
    place-items: center;
  }
  html[data-brand="claude"] .stage {
    background:
      radial-gradient(90% 90% at 70% 20%, rgba(217, 119, 87, 0.18), transparent 60%),
      linear-gradient(140deg, #36251f, #191919 70%);
  }
  .stage .big-play {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(6px);
    transition: transform var(--dur-feedback) var(--ease-spring), background var(--dur-feedback);
  }
  .stage .big-play:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.2); }
  .stage .tc { position: absolute; left: 12px; bottom: 10px; font-size: 10.5px; color: rgba(255, 255, 255, 0.7); font-variant-numeric: tabular-nums; }
  .stage .track { position: absolute; left: 12px; right: 12px; bottom: 30px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  .stage .track i { display: block; height: 100%; width: 34%; background: rgba(255, 255, 255, 0.7); border-radius: 2px; }

  .toast {
    position: fixed;
    top: 62px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    height: 32px;
    padding: 0 13px;
    background: var(--overlay);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    font-size: 12px;
    color: var(--ink);
    z-index: 300;
    animation: toastIn var(--dur-open) var(--ease-settle);
  }
  .toast .ti { color: var(--ok); display: inline-flex; }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, -4px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* =========================================================
     适配
     ========================================================= */
  @media (max-width: 1400px) {
    :root { --sidebar-w: 248px; --right-w: 368px; }
    .goal { max-width: 240px; }
  }
  @media (max-width: 1240px) {
    :root { --sidebar-w: 236px; --right-w: 348px; }
    .seg button { padding: 0 7px; }
    .r-title .nm { max-width: 100px; }

  @media (max-width: 1120px) {

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* ignore */ }
      ta.remove();
    }
    toast('已复制');
  }

      <button class="jump" id="jumpLatest" data-a="jump-latest" aria-label="跳到最新" title="跳到最新" hidden>${I.arrowDown}</button>

      <div class="dock">
        <div class="dock-inner">
          ${q && S.tray ? trayHTML(q) : ''}
          ${(p.tasks.length || p.messages.length) ? pills : ''}
          <div class="composer">
            ${attachmentsHTML(p.attachments || [], true)}
            <div class="composer-row">
              <button class="iconbtn sm" data-a="attach" aria-label="添加附件" title="添加附件">${I.plus}</button>
              <textarea id="input" rows="1" placeholder="输入消息，@ 引用任务" aria-label="消息">${esc(p.draft || '')}</textarea>
              <button class="send" id="sendBtn" ${canSend ? '' : 'disabled'} aria-label="发送" title="发送">${I.arrowUp}</button>
            </div>
          </div>
          <div class="dock-foot">
            <button class="status-chip" data-a="env" aria-haspopup="dialog">${I.laptop}<span>${esc(S.env)}</span><span class="chev">${I.chevD}</span></button>
            <span class="foot-spacer"></span>
            <button class="status-chip model" data-a="model" aria-haspopup="dialog"><span>${esc(S.model)}</span><span class="chev">${I.chevD}</span></button>
          </div>
        </div>
      </div>

      ${S.peek ? peekHTML(p) : ''}
      <input type="file" id="filePick" multiple hidden>`;

    const stream = $('#stream');
    if (stream) {
      const shortOverflow = initial && stream.scrollHeight - stream.clientHeight < 180;
      if (S.stick || (!initial && atBottom) || (initial && !shortOverflow)) stream.scrollTop = stream.scrollHeight;
      else stream.scrollTop = initial ? 0 : Math.min(keepTop, stream.scrollHeight);
      stream.addEventListener('scroll', updateShade, { passive: true });
      updateShade();
    }
    S.stick = false;

    const input = $('#input');
    if (input) {
      grow(input);
      input.addEventListener('input', () => {
        p.draft = input.value;
        grow(input);
        updateSendState();
        updateMention(p);
        positionJump();
      });
      input.addEventListener('keydown', (e) => {
        if (S.mentionOpen) {
          if (e.key === 'ArrowDown') { e.preventDefault(); moveMention(1); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); moveMention(-1); return; }
          if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); chooseMention(); return; }
          if (e.key === 'Escape') { e.preventDefault(); closeMention(); return; }
        }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      });
      if (S.focusComposer) {
        input.focus();
        const len = input.value.length;
        input.setSelectionRange(len, len);
        S.focusComposer = false;
      }
    }

    const sendBtn = $('#sendBtn');
    if (sendBtn) sendBtn.addEventListener('click', send);

    const picker = $('#filePick');
    if (picker) picker.addEventListener('change', (e) => {
      addFiles(p, e.target.files);
      e.target.value = '';
    });

    const trayInput = $('#trayInput');
    const traySend = $('#traySend');
    if (trayInput && traySend) {
      const syncTray = () => { traySend.disabled = !trayInput.value.trim(); };
      trayInput.addEventListener('input', syncTray);
      syncTray();
    }
    if (trayInput && S.focusTray) { trayInput.focus(); S.focusTray = false; }

    positionJump();

    if (S.enterLast) {
      const msgs = $$('.msg');
      const last = msgs[msgs.length - 1];
      if (last) last.classList.add('enter');
      S.enterLast = false;
    }
  }

  function messageHTML(p, m, i) {
    if (m.kind === 'user') {
      return `<div class="msg user">

  function libHTML(p) {

      lines.push('<div> M src/views/merge-state.ts</div>');

      lines.push('<div class="ok">✓ 42 passed (3.8s)</div>');

  /* ---------- 浮层 ---------- */
  let floatingEl = null;

  function openFloating(anchor, html, opts) {
    closeFloating();
    const el = document.createElement('div');
    el.className = 'floating ' + ((opts && opts.className) || '');
    el.innerHTML = html;
    document.body.appendChild(el);
    if (!anchor) {
      el.style.left = '50%';
      el.style.top = '60px';
      floatingEl = el;
      return el;
    }
    const r = anchor.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    let left = opts && opts.align === 'right' ? r.right - w : r.left;
    if (left + w > innerWidth - 8) left = innerWidth - w - 8;
    if (left < 8) left = 8;
    let top = opts && opts.above ? r.top - h - 6 : r.bottom + 6;
    if (opts && opts.above && top < 8) top = r.bottom + 6;
    if (!(opts && opts.above) && top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    floatingEl = el;
    return el;
  }

  function closeFloating() {
    if (floatingEl) { floatingEl.remove(); floatingEl = null; }
  }

  function openProjectMenu(anchor, id) {
    const p = DB.projects.find((x) => x.id === id);

  function onProjectAction(p, action) {
    if (action === 'settings') return openProjectForm(p);
    if (action === 'index') return openFileByPath(p, 'INDEX.md');
    if (action === 'pause') { p.status = 'paused'; render(); toast('已暂停'); return; }
    if (action === 'resume') { p.status = 'active'; render(); toast('已恢复'); return; }
    if (action === 'archive') {
      p.status = 'archived';
      if (S.active === p.id) {
        const next = DB.projects.find((x) => x.status !== 'archived') || p;
        S.active = next.id; S.detail = null; S.peek = null;
      }
      render(); toast('已归档');
      return;
    }
    if (action === 'unarchive') { p.status = 'active'; S.active = p.id; S.showArchived = false; render(); toast('已恢复'); return; }
    if (action === 'delete') return confirmDelete(p);
  }

  function openModal(html) {

    $('#layers').appendChild(layer);
    layer.addEventListener('click', (e) => { if (e.target === layer) closeModal(); });
    $$('[data-close]', layer).forEach((b) => b.addEventListener('click', closeModal));
    trapFocus(layer);
    const focusTarget = $('[data-autofocus]', layer);
    if (focusTarget) setTimeout(() => { focusTarget.focus(); if (focusTarget.select) focusTarget.select(); }, 40);
    return layer;
  }

  function closeModal() {
    const l = $('#overlay');
    if (l) l.remove();
  }

  function trapFocus(layer) {
    layer.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const f = $$('button:not([disabled]), input:not([disabled]), [href], [tabindex]:not([tabindex="-1"])', layer)
        .filter((el) => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0];
      const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }

  function projectFormHTML(p) {

      </div>

  function openProjectForm(p) {
    const editing = !!p;
    const layer = openModal(projectFormHTML(p));
    const nameInput = $('#pName', layer);
    const goalInput = $('#pGoal', layer);
    const save = $('#pSave', layer);
    const pick = { icon: +($('.icon-opt.on', layer)?.dataset.icon || 0), repos: new Set(p ? p.repos || [] : []) };

    $$('[data-icon]', layer).forEach((b) => b.addEventListener('click', () => {
      $$('[data-icon]', layer).forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      pick.icon = +b.dataset.icon;
    }));

    $$('[data-repo]', layer).forEach((row) => {
      const toggle = () => {
        const on = !row.classList.contains('on');
        row.classList.toggle('on', on);
        row.setAttribute('aria-checked', String(on));
        const r = row.dataset.repo;
        if (on) pick.repos.add(r); else pick.repos.delete(r);
      };
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });

    const updateSave = () => { save.disabled = !nameInput.value.trim(); };
    nameInput.addEventListener('input', () => { updateSave(); nameInput.classList.remove('invalid'); });
    updateSave();

    const commit = () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.classList.add('invalid'); nameInput.focus(); return; }
      const goal = goalInput.value.trim();
      const repos = Array.from(pick.repos);
      const icon = PROJECT_ICONS[pick.icon];
      if (editing) {
        p.name = name; p.goal = goal; p.repos = repos; p.icon = icon.c; p.tone = icon.t;
        closeModal(); render(); toast('已保存');
      } else {
        const id = 'p' + Date.now();
        DB.projects.unshift({
          id, name, icon: icon.c, tone: icon.t, goal, repos,
          time: '刚刚', unread: false, status: 'active', nextSeq: 1,
          tasks: [],
          library: [{ path: 'INDEX.md', scope: 'index', status: 'proposed', meta: '草稿' }],
          messages: []
        });
        S.active = id; S.pane = 'list'; S.detail = null; S.peek = null;
        S.filter = null; S.tray = false; S.showArchived = false;
        S.searchOpen = false; S.sideQuery = '';
        closeModal();
        S.stick = true; S.focusComposer = true;
        render();
        toast('项目已创建');
      }
    };

    save.addEventListener('click', commit);
    layer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.target === nameInput || e.target === goalInput || e.target === save)) {
        e.preventDefault(); commit();
      }
    });
  }

    const known = { 'youshi-product': 'YOU', bzti: 'BZT', native: 'NAT' };

  /* ---------- 文档与工件 ---------- */
  const SCOPE_LABEL = { index: '项目索引', decision: '决策', runbook: '操作手册', spec: '规格', artifact: '工件', user: '资料' };

  function fileTag(f) {
    if (f.status === 'ratified') return '<span class="tag ok">已确认</span>';
    if (f.status === 'proposed') return '<span class="tag warn">待确认</span>';
    if (f.status === 'disputed') return '<span class="tag danger">有争议</span>';
    return '';
  }

  function openFileByPath(p, path) {
    const f = p.library.find((x) => x.path === path);
    if (!f) { toast('找不到这个文件'); return; }
    const isArtifact = f.scope === 'artifact' || f.scope === 'user';
    const layer = openModal(`<div class="modal md" role="dialog" aria-modal="true" aria-label="${esc(path)}">
      <div class="doc-head">
        <span class="path">${esc(path)}</span>
        ${fileTag(f)}
        <button class="iconbtn sm" data-close aria-label="关闭">${I.x}</button>
      </div>
      <div class="doc-body">${isArtifact ? artifactDoc(f, p) : docContent(f, p)}</div>
      <div class="doc-foot">
        <span class="hint">${SCOPE_LABEL[f.scope] || '文件'}</span>
        <span class="spacer"></span>
        <button class="btn ghost" data-copy-path="${esc(f.path)}">${I.copy}复制路径</button>
        <button class="btn ghost" data-close>关闭</button>
      </div>
    </div>`);
    $('[data-copy-path]', layer)?.addEventListener('click', (e) => copy(e.currentTarget.dataset.copyPath));
    const docBody = $('.doc-body', layer);
    if (docBody) {
      const upd = () => docBody.classList.toggle('fade-bottom', docBody.scrollHeight - docBody.scrollTop - docBody.clientHeight > 12);
      docBody.addEventListener('scroll', upd, { passive: true });
      requestAnimationFrame(upd);
    }
    $('.big-play', layer)?.addEventListener('click', (e) => {
      const stage = e.currentTarget.closest('.stage');
      stage.classList.toggle('playing');
      e.currentTarget.innerHTML = stage.classList.contains('playing') ? I.pause : I.play;
    });

  /* ---------- 动作 ---------- */
  function selectProject(id) {
    if (!DB.projects.some((p) => p.id === id)) return;
    if (S.active === id && !S.detail) return;
    const p = DB.projects.find((x) => x.id === id);
    p.unread = false;
    S.active = id;
    S.detail = null;
    S.peek = null;
    S.pane = 'list';
    S.filter = null;
    S.tray = false;
    S.logFor = null;
    S.searchOpen = false;
    S.sideQuery = '';
    S.stick = true;
    S.swap = true;
    render();
  }

  function setPane(pane) {
    if (S.pane === pane && !S.detail) return;
    S.pane = pane;
    S.detail = null;
    S.logFor = null;
    S.scrollRightTop = true;
    S.animateRight = true;
    renderRight();
  }

  function send() {
    const p = proj();
    const input = $('#input');
    if (!input || S.typing) return;
    const text = input.value.trim();
    const atts = (p.attachments || []).slice();
    if (!text && !atts.length) return;

    p.messages.push({ kind: 'user', text, time: '刚刚', attachments: atts });
    p.draft = '';
    p.attachments = [];
    p.time = '刚刚';
    S.typing = true;
    S.typingProject = p.id;
    S.stick = true;
    S.enterLast = true;
    S.focusComposer = true;
    closeMention();
    render();

    setTimeout(() => {
      S.typing = false;
      S.typingProject = null;
      const r = reply(text, p);
      p.messages.push(...r.messages);
      if (r.tasks && r.tasks.length) {
        r.tasks.forEach((t) => {
          p.tasks.unshift(t);
          p.nextSeq = Math.max(p.nextSeq, parseInt(t.id.split('-')[1], 10) + 1);
        });
        p.messages.push({ kind: 'note', text: `新建 ${r.tasks.length} 个任务` });
      }
      S.stick = true;
      S.enterLast = true;
      S.focusComposer = true;
      render();
    }, 900);
  }

  function reply(text, p) {
    const pre = prefixFor(p);
    const n = p.nextSeq;

    if (/拆|分成|几个|并行|三块/.test(text)) {
      const titles = ['抽离合盘状态源', '单人盘入口回归', '迁移脚本与数据校验'];
      return {
        messages: [{
          kind: 'agent',
          text: `拆成 3 个。<code class="inl">${pre}-${n}</code> 先跑，摸清状态源之后另外两个再动，避免同时改同一处。`
        }],
        tasks: titles.map((t, i) => ({
          id: `${pre}-${n + i}`, title: t, status: i === 0 ? 'working' : 'queued',
          repo: p.repos[i % Math.max(p.repos.length, 1)] || '', desc: t,
          worker: i === 0 ? 'worker-' + Math.random().toString(16).slice(2, 6) : '',
          worktree: i === 0 ? `agent/${pre.toLowerCase()}-${n + i}` : '',
          model: S.model, prs: [],
          timeline: i === 0 ? [{ t: '已拉起 worktree，开始读代码', time: '刚刚', tone: 'work' }] : []
        }))
      };
    }

    if (/上线|发布|deploy|生产/i.test(text)) {
      return {
        messages: [{
          kind: 'agent',
          text: '发布分两步：先确认 staging 的 <code class="inl">f31489d</code> 冒烟通过，再滚动到生产。这一步派 Worker 去做，做完把健康检查结果贴回来。'
        }],
        tasks: [{
          id: `${pre}-${n}`, title: '生产发布 f31489d', status: 'queued',
          repo: p.repos[p.repos.length - 1] || '', desc: '滚动发布 f31489d 到生产，带健康检查与回滚预案。',
          worker: '', worktree: '', model: S.model, prs: [], timeline: []
        }]
      };
    }

    if (/测试|回归|验证/.test(text)) {
      return {
        messages: [{
          kind: 'agent',
          text: '回归用 Playwright 跑三档视口，Chromium 和 WebKit 各一遍。跑完把录屏和失败截图放进 Library。'
        }],
        tasks: []
      };
    }

    return {
      messages: [{
        kind: 'agent',
        text: `先看一下 <code class="inl">${esc(p.repos[0] || '仓库')}</code> 里相关的部分，需要动手就拆成任务派下去。`
      }],
      tasks: []
    };
  }

  function answerQ(idx, q, custom) {
    const p = proj();
    const t = p.tasks.find((x) => x.id === q.from);
    if (!t) return;
    const text = (custom || q.options[idx] || '').trim();
    if (!text) return;

    S.answered[t.id] = true;
    S.tray = false;
    p.messages.push({ kind: 'user', text, time: '刚刚' });
    p.messages.push({ kind: 'relay', text: `${q.from} · 1 条` });
    t.status = 'working';
    t.timeline.push({ t: `已收到答复：${text}`, time: '刚刚', tone: 'work' });
    delete t.question;
    p.time = '刚刚';
    S.stick = true;
    S.enterLast = true;
    S.focusComposer = true;
    render();

    setTimeout(() => {
      p.messages.push({
        kind: 'agent',
        text: `收到，已经转给 <code class="inl">${esc(q.worker || 'Worker')}</code>，按「${esc(text)}」继续。`
      });
      S.stick = true;
      S.enterLast = true;
      render();
    }, 700);
  }

  function markTask(id, action) {
    const t = proj().tasks.find((x) => x.id === id);
    if (!t) return;
    if (action === 'done') {
      t.status = 'done';
      delete t.question;
      t.timeline.push({ t: '人工标记完成', time: '刚刚', tone: 'ok' });
      toast('已完成');
    } else if (action === 'reopen') {
      t.status = 'working';
      t.timeline.push({ t: '人工重新打开', time: '刚刚', tone: 'work' });
      toast('已重新打开');
    } else if (action === 'stop') {
      t.status = 'queued';
      t.timeline.push({ t: '人工停止', time: '刚刚', tone: 'warn' });
      toast('已停止');
    } else if (action === 'start') {
      t.status = 'working';
      t.timeline.push({ t: '已开始执行', time: '刚刚', tone: 'work' });
      toast('已开始');
    }
    S.tray = false;
    render();
  }
