    const t = p.tasks.find((x) => x.id === id);
    if (!t) return;
    const current = t.baseBranch || null;
    const refs = refsMeta(p);
    const branches = Array.from(new Set([...(p.branches || []), ...(p.defaultBranch ? [p.defaultBranch] : []), 'main', ...(current ? [current] : [])]));
    const el = openFloating(anchor, `
      <div class="menu-head">基线分支${refs.stale ? `<span class="refs-warn">refs 可能过期</span>` : ''}</div>
      <button class="menu-item" data-set-branch=""><span class="mi">${I.branch}</span>项目默认 · ${esc(p.defaultBranch || 'main')}${!current ? `<span class="check">${I.check}</span>` : ''}</button>
      <div class="menu-sep"></div>
      ${branches.map((b) => `<button class="menu-item" data-set-branch="${esc(b)}"><span class="mi">${I.branch}</span><span class="mono" style="font-family:var(--font-mono);font-size:11px;">${esc(b)}</span><span class="bp-origin">${isRemoteBranch(p, b) ? '远端' : '本地'}</span>${current === b ? `<span class="check">${I.check}</span>` : ''}</button>`).join('')}
      <div class="menu-sep"></div>
      <button class="menu-item" data-new-branch><span class="mi">${I.plus}</span>创建新分支…</button>
      <button class="menu-item" data-manage-branches><span class="mi">${I.branch}</span>管理分支…</button>
      <button class="menu-item" data-refresh-refs><span class="mi">${I.refresh}</span>刷新 refs</button>
    `, { align: 'left' });

      render();
      toast('refs 已刷新');
    });
    $('[data-new-branch]', el)?.addEventListener('click', () => {
      closeFloating();
      openCreateBranchModal(p, t);
    });
    $('[data-manage-branches]', el)?.addEventListener('click', () => {
      closeFloating();
      openBranchManager(p);
    });
    $$('[data-set-branch]', el).forEach((b) => b.addEventListener('click', () => {
      const value = b.dataset.setBranch || null;
      t.baseBranch = value;
      t.branchLocal = false;
      t.timeline = t.timeline || [];
      t.timeline.push({ t: value ? `基线分支改为 ${value}` : '基线分支恢复项目默认', time: '刚刚', tone: 'work' });

  /* 显示状态由事实推导（docs/architecture/domain-model.md §3）：
     For Review / Waiting on you 只能由 PR、验证结果或提问产生，人不能手动设置。 */
  const DERIVED_ONLY = {
    review: '「For Review」由 PR 或验证结果自动决定，不能手动设置',
    waiting: '「Waiting on you」由 worker 提问或失败自动决定，不能手动设置'
  };
  function manualStatusBlock(t, st) {
    if (DERIVED_ONLY[st]) return DERIVED_ONLY[st];
    if (st === 'working') {
      const active = activeBlockers(proj(), t);
      if (active.length) return `仍被 ${active.map((b) => b.id).join('、')} 阻塞`;
      if (envMeta(t.env || S.env).status === 'off') return '运行环境不可用';
    }
    return null;
  }

  function setTaskStatus(id, st) {
    const t = proj().tasks.find((x) => x.id === id);
    if (!t || t.status === st) return;
    const blocked = manualStatusBlock(t, st);
    if (blocked) {
      toast(blocked);
      return;
    }
    t.status = st;
    t.timeline.push({
      t: `状态改为 ${ST[st].label}`,
      time: '刚刚',
      tone: st === 'done' ? 'ok' : st === 'canceled' || st === 'waiting' ? 'warn' : 'work'
    });
    if (st === 'done' || st === 'canceled') delete t.question;
    if (st === 'done') {
      proj().tasks.forEach((x) => {
        if ((x.blockedBy || []).includes(id)) {
          x.timeline = x.timeline || [];
          x.timeline.push({ t: `依赖 ${id} 已完成`, time: '刚刚', tone: 'ok' });
        }
      });
    }
    S.tray = false;
    S.animateRight = true;
    render();
    toast(ST[st].label);
  }

  function openStatusPicker(anchor, id) {
    const t = proj().tasks.find((x) => x.id === id);
    if (!t) return;
    const el = openFloating(anchor, `
      <div class="menu-head">Status</div>
      ${GROUP_ORDER.map((st) => `<button class="menu-item${DERIVED_ONLY[st] && t.status !== st ? ' is-derived' : ''}" data-set-status="${st}"${DERIVED_ONLY[st] ? ` title="${esc(DERIVED_ONLY[st])}"` : ''}${DERIVED_ONLY[st] && t.status !== st ? ' aria-disabled="true"' : ''}>
        <span class="mi">${statusIcon(st)}</span>${ST[st].label}
        ${t.status === st ? `<span class="check">${I.check}</span>` : DERIVED_ONLY[st] ? '<span class="hint">自动</span>' : ''}
      </button>`).join('')}
    `, { align: 'left' });
    $$('[data-set-status]', el).forEach((b) => b.addEventListener('click', () => {
      const next = b.dataset.setStatus;
      closeFloating();
      setTaskStatus(id, next);
    }));
  }

  function openProjectMenu(anchor, id) {
    const p = DB.projects.find((x) => x.id === id);

    const archived = p.status === 'archived';
    const paused = p.status === 'paused';
    const el = openFloating(anchor, `
      <div class="menu-head">${esc(p.name)}</div>

      <div class="menu-sep"></div>
      <button class="menu-item" data-pm="${archived ? 'unarchive' : paused ? 'resume' : 'pause'}">
        <span class="mi">${archived ? I.refresh : paused ? I.play : I.pause}</span>${archived ? '恢复归档' : paused ? '恢复项目' : '暂停项目'}
      </button>
      ${archived ? '' : `<button class="menu-item" data-pm="archive"><span class="mi">${I.archive}</span>归档</button>`}

  function onProjectAction(p, action) {
    if (action === 'settings') return openProjectForm(p);
    if (action === 'index') return openFileByPath(p, 'INDEX.md');
    if (action === 'pause') { p.status = 'paused'; render(); toast('已暂停'); return; }
    if (action === 'resume') { p.status = 'active'; render(); toast('已恢复'); return; }
    if (action === 'archive') {
      p.status = 'archived';
      if (S.active === p.id) {
        const next = DB.projects.find((x) => x.status !== 'archived') || p;
        S.active = next.id; S.detail = null; S.peek = null;
      }
      render(); toast('已归档');
      return;
    }
    if (action === 'unarchive') { p.status = 'active'; S.active = p.id; S.showArchived = false; render(); toast('已恢复'); return; }
    if (action === 'delete') return confirmDelete(p);
  }

      ${list.length ? '' : `<div class="menu-sep"></div><button class="menu-item" data-asg-settings><span class="mi">${I.gear}</span>先添加项目成员</button>`}

  function depNodeHTML(p, b, depth, seen) {
    const cycle = seen.has(b.id);
    const nextSeen = new Set(seen);
    nextSeen.add(b.id);
    const kids = cycle ? [] : (b.blockedBy || []).map((id) => p.tasks.find((x) => x.id === id)).filter(Boolean);
    return `<div class="dp-branch" style="margin-left:${(depth - 1) * 16}px">
      <button class="dp-node" data-dep-open="${b.id}" title="打开 ${esc(b.id)}">
        <span class="dp-arrow-l">${I.arrowDown}</span>
        <span class="dp-status">${statusIcon(b.status)}</span>
        <span class="dp-id">${b.id}</span>
        <span class="dp-node-title">${esc(b.title)}</span>
        ${cycle ? `<span class="dp-tag blocked">循环</span>` : `<span class="dp-node-state">${ST[b.status].label}</span>`}
      </button>
      ${kids.length ? `<div class="dp-children">${kids.map((k) => depNodeHTML(p, k, depth + 1, nextSeen)).join('')}</div>` : ''}
    </div>`;
  }

  function openDependencyPanel() {
    const p = proj();
    const groups = p.tasks.filter((t) => (t.blockedBy || []).length).map((t) => {
      const blockers = blockerTasks(p, t);
      const active = activeBlockers(p, t).length > 0;
      return { t, blockers, active };
    });
    const unresolved = groups.filter((g) => g.active).length;
    const edges = groups.reduce((n, g) => n + g.blockers.length, 0);
    openModal(`<div class="modal md dep-modal" role="dialog" aria-modal="true" aria-label="项目依赖">
      <div class="modal-head"><h3>项目依赖</h3><span class="hint">${edges} 条依赖 · ${unresolved} 个阻塞</span><button class="iconbtn sm x" data-close aria-label="关闭">${I.x}</button></div>
      <div class="modal-body">
        ${groups.length ? `<div class="dp-toolbar"><button class="dp-tool" data-dp-all>收起全部</button></div>` : ''}
        ${groups.length ? groups.map(({ t, blockers, active }) => `<div class="dp-group">
          <div class="dp-target">
            <span class="dp-status">${statusIcon(t.status)}</span>
            <span class="dp-id">${t.id}</span>
            <span class="dp-title">${esc(t.title)}</span>
            <span class="dp-tag ${active ? 'blocked' : 'resolved'}">${active ? '被阻塞' : '已解除'}</span>
            <span class="dp-target-actions">
              ${active ? `<button class="dp-focus" data-dep-focus="${t.id}" title="在 Board 聚焦">${I.focus}</button>` : ''}
              <button class="dp-chev" data-dp-toggle aria-expanded="true" title="展开/收起">${I.chevD}</button>
            </span>
          </div>
          <div class="dp-blockers">
            ${blockers.map((b) => depNodeHTML(p, b, 1, new Set([t.id]))).join('')}
          </div>
        </div>`).join('') : `<div class="dp-empty">${I.check}当前项目没有依赖关系。</div>`}
      </div>
      <div class="modal-foot"><span class="hint">依赖来自任务详情里的 blocked by</span><button class="btn ghost" data-close>关闭</button></div>
    </div>`);
    $$('[data-dep-open]', $('#overlay')).forEach((b) => b.addEventListener('click', () => {
      const id = b.dataset.depOpen;
      closeModal();
      openDetail(id);
    }));
    const syncDpAll = () => {
      const btn = $('[data-dp-all]', $('#overlay'));
      if (!btn) return;
      const anyOpen = $$('.dp-group', $('#overlay')).some((g) => !g.classList.contains('collapsed'));
      btn.textContent = anyOpen ? '收起全部' : '展开全部';
    };
    $$('[data-dp-toggle]', $('#overlay')).forEach((b) => b.addEventListener('click', () => {
      const group = b.closest('.dp-group');
      const collapsed = group.classList.toggle('collapsed');
      b.classList.toggle('open', !collapsed);
      b.setAttribute('aria-expanded', String(!collapsed));
      syncDpAll();
    }));
    $('[data-dp-all]', $('#overlay'))?.addEventListener('click', () => {
      const btn = $('[data-dp-all]', $('#overlay'));
      const collapse = btn.textContent === '收起全部';
      $$('.dp-group', $('#overlay')).forEach((g) => g.classList.toggle('collapsed', collapse));
      $$('.dp-chev', $('#overlay')).forEach((b) => {
        b.classList.toggle('open', !collapse);
        b.setAttribute('aria-expanded', String(!collapse));
      });
      btn.textContent = collapse ? '展开全部' : '收起全部';
    });
    $$('[data-dep-focus]', $('#overlay')).forEach((b) => b.addEventListener('click', () => {
      const t = p.tasks.find((x) => x.id === b.dataset.depFocus);
      if (!t) return;
      const chosen = (activeBlockers(p, t)[0] || blockerTasks(p, t)[0]);
      if (!chosen) return;
      S.depFocus = { from: chosen.id, to: t.id };
      S.rightOpen = true;
      S.pane = 'board';
      S.detail = null;
      closeModal();
      S.animateRight = true;
      render();
      toast(`已聚焦 ${chosen.id} → ${t.id}`);
    }));
  }

  function wouldCreateCycle(p, taskId, depId) {
    const stack = [depId];
    const seen = new Set();
    while (stack.length) {
      const current = stack.pop();
      if (current === taskId) return true;
      if (seen.has(current)) continue;
      seen.add(current);
      const t = p.tasks.find((x) => x.id === current);
      (t && t.blockedBy ? t.blockedBy : []).forEach((next) => stack.push(next));
    }
    return false;
  }

  function openDependencyPicker(anchor, id, point) {
    const p = proj();
    const t = p.tasks.find((x) => x.id === id);
    if (!t) return;
    const current = new Set(t.blockedBy || []);
    const others = p.tasks.filter((x) => x.id !== id && x.status !== 'canceled');
    const el = openFloating(anchor, `
      <div class="menu-head">依赖</div>
      ${others.map((x) => {
        const cycle = !current.has(x.id) && wouldCreateCycle(p, t.id, x.id);
        return `<button class="menu-item dep-option ${cycle ? 'disabled' : ''}" data-dep-task="${x.id}" ${cycle ? 'aria-disabled="true"' : ''} title="${cycle ? '会形成循环依赖' : ''}">
          <span class="mi">${statusIcon(x.status)}</span>
          <span class="dep-title">${x.id} ${esc(x.title)}</span>
          ${cycle ? `<span class="dep-cycle">循环</span>` : current.has(x.id) ? `<span class="check">${I.check}</span>` : ''}
        </button>`;
      }).join('')}
      ${current.size ? `<div class="menu-sep"></div><button class="menu-item" data-dep-clear><span class="mi">${I.x}</span>清除依赖</button>` : ''}
      ${others.length ? '' : '<div class="menu-empty">没有其他任务</div>'}
    `, point ? { point } : { align: 'left' });
    $$('[data-dep-task]', el).forEach((b) => b.addEventListener('click', () => {
      const other = p.tasks.find((x) => x.id === b.dataset.depTask);
      if (!other) return;
      t.blockedBy = t.blockedBy || [];
      if (!t.blockedBy.includes(other.id) && wouldCreateCycle(p, t.id, other.id)) {
        toast('会形成循环依赖');
        return;
      }
      if (t.blockedBy.includes(other.id)) t.blockedBy = t.blockedBy.filter((x) => x !== other.id);
      else t.blockedBy.push(other.id);
      t.timeline = t.timeline || [];
      t.timeline.push({ t: t.blockedBy.includes(other.id) ? `添加依赖 ${other.id}` : `移除依赖 ${other.id}`, time: '刚刚', tone: 'work' });
      p.time = '刚刚';
      closeFloating();
      S.animateRight = true;
      render();
      toast(t.blockedBy.includes(other.id) ? `已依赖 ${other.id}` : `已移除 ${other.id}`);
    }));
    $('[data-dep-clear]', el)?.addEventListener('click', () => {
      t.blockedBy = [];
      t.timeline.push({ t: '清除所有依赖', time: '刚刚', tone: 'work' });
      closeFloating();
      S.animateRight = true;
      render();
      toast('已清除依赖');
    });
  }

  function openTaskContextMenu(id, x, y) {

    const el = openFloating(null, `

      <button class="menu-item" data-ctx="deps"><span class="mi">${I.lock}</span>依赖…</button>
      <button class="menu-item" data-ctx="copy"><span class="mi">${I.copy}</span>复制 ID</button>
      <div class="menu-sep"></div>

      <button class="menu-item" data-px="copy"><span class="mi">${I.copy}</span>复制项目路径</button>

      <div class="menu-sep"></div>

  function openProjectSwitcher(anchor) {

  function openEnvWorkspace(name) {
    const env = ENVS.find((e) => e.name === name);
    if (!env) return;
    const p = proj();
    const all = (p.tasks || []).filter((t) => t.worktree);
    const statusOrder = { working: 0, queued: 1, waiting: 2, review: 3, done: 4, canceled: 5 };
    let query = '';
    let sort = 'status';
    const selKey = p.id;
    let selected = new Set(((S.wsSelection || {})[selKey] || []).filter((id) => all.some((t) => t.id === id)));
    const persistSelection = () => {
      S.wsSelection = S.wsSelection || {};
      if (selected.size) S.wsSelection[selKey] = [...selected];
      else delete S.wsSelection[selKey];
    };
    let visibleIds = [];
    let pendingFocus = null;
    const layer = openModal(`<div class="modal sm env-workspace-modal" role="dialog" aria-modal="true" aria-label="工作目录">
      <div class="modal-head"><h3>工作目录</h3><span class="hint">${esc(env.name)}</span><button class="iconbtn sm x" data-close aria-label="关闭">${I.x}</button></div>
      <div class="modal-body">
        <div class="ws-path"><span class="ws-path-icon">${I.folder}</span><code>${esc(env.workspace || '—')}</code><button type="button" data-ws-copy>${I.copy}复制</button></div>
        <div class="ws-meta"><span class="env-dot ${env.status}"></span><span>${esc(env.health)}</span><span>${esc(env.useCount || 0)} 次使用</span><span>上次可用 ${esc(env.lastOk || '—')}</span></div>
        <div class="ws-section">
          <div class="ws-toolbar">
            <input class="ws-search" id="wsSearch" type="search" placeholder="筛选 worktree…" autocomplete="off" spellcheck="false" data-autofocus>
            <div class="ws-sorts" role="group" aria-label="排序">
              <button type="button" class="ws-sort on" data-ws-sort="status">状态</button>
              <button type="button" class="ws-sort" data-ws-sort="id">任务号</button>
              <button type="button" class="ws-sort" data-ws-sort="path">路径</button>
              <span class="ws-count" id="wsCount"></span>
            </div>
            <div class="ws-bulk" id="wsBulk" hidden><span id="wsBulkCount"></span><button type="button" data-ws-bulk-copy>${I.copy}复制路径</button><button type="button" data-ws-bulk-board>${PROJECT_MARKS.layers}看板</button><button type="button" data-ws-bulk-clear>清除</button></div>
          </div>
          <div class="ws-list" id="wsList"></div>
        </div>
      </div>
      <div class="modal-foot"><span class="hint">↑↓ 选择 · Space 多选 · ↵ 打开 · C 复制路径</span><button class="btn ghost" data-close>关闭</button></div>
    </div>`);
    $('[data-ws-copy]', layer)?.addEventListener('click', () => copy(env.workspace || '', '工作目录'));
    const closeMenu = (menu) => menu && menu.remove();
    const openWsContext = (t, event, row) => {
      const modal = layer.querySelector('.modal');
      if (!modal) return;
      closeMenu($('.ws-ctx', modal));
      const r = modal.getBoundingClientRect();
      const menu = document.createElement('div');
      menu.className = 'ws-ctx';
      menu.innerHTML = `<button data-ws-ctx="open"><span class="mi">${I.external}</span>打开任务详情</button><button data-ws-ctx="copy-path"><span class="mi">${I.copy}</span>复制 worktree 路径</button><button data-ws-ctx="copy-id"><span class="mi">${I.copy}</span>复制任务 ID</button><button data-ws-ctx="files"><span class="mi">${I.fileText}</span>在文件面板打开</button>`;
      menu.style.left = Math.max(8, Math.min(event.clientX - r.left, r.width - 170)) + 'px';
      menu.style.top = Math.max(8, Math.min(event.clientY - r.top, r.height - 100)) + 'px';
      modal.appendChild(menu);
      menu.tabIndex = -1;
      const ctxItems = $$('[data-ws-ctx]', menu);
      const focusCtx = (idx) => {
        ctxItems.forEach((x) => x.classList.remove('kbd-focus'));
        const item = ctxItems[(idx + ctxItems.length) % ctxItems.length];
        item.classList.add('kbd-focus');
        item.focus();
      };
      menu.focus();
      requestAnimationFrame(() => focusCtx(0));
      menu.addEventListener('keydown', (ev) => {
        const active = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-ws-ctx]') : null;
        const idx = Math.max(0, ctxItems.indexOf(active));
        if (ev.key === 'ArrowDown') { ev.preventDefault(); focusCtx(idx + 1); }
        else if (ev.key === 'ArrowUp') { ev.preventDefault(); focusCtx(idx - 1); }
        else if (ev.key === 'Escape') { ev.preventDefault(); menu.remove(); const main = row && $('.ws-wt-main', row); main?.focus(); }
      });
      $$('[data-ws-ctx]', menu).forEach((b) => b.addEventListener('click', () => {
        const action = b.dataset.wsCtx;
        if (action === 'open') { closeModal(); openDetail(t.id); }
        else if (action === 'copy-path') { closeMenu(menu); copy(t.worktree, 'worktree 路径'); }
        else if (action === 'copy-id') { closeMenu(menu); copy(t.id, '任务 ID'); }
        else if (action === 'files') { closeModal(); S.rightOpen = true; S.pane = 'library'; S.detail = null; S.animateRight = true; render(); toast('已在文件面板打开'); }
      }));
      setTimeout(() => {
        const onDown = (ev) => {
          if (menu.contains(ev.target)) return;
          menu.remove();
          document.removeEventListener('pointerdown', onDown, true);
        };
        document.addEventListener('pointerdown', onDown, true);
      }, 0);
    };
    const goTarget = (row, focusTimeline) => {
      document.querySelectorAll('.ui-tip').forEach((el) => el.remove());
      const projectId = row.dataset.notifProjectId;
      const taskId = row.dataset.notifTask;
      const target = DB.projects.find((x) => x.id === projectId);
      const timelineIndex = row.dataset.notifTimeIndex === '' ? null : Number(row.dataset.notifTimeIndex);
      const existingStack = (S.notifBack || []).slice();
      closeModal();
      if (projectId && S.active !== projectId) selectProject(projectId);
      if (taskId) {
        const last = existingStack[existingStack.length - 1];
        if (!last || last.taskId !== taskId) existingStack.push({ taskId, projectId });
        S.notifBack = existingStack;
        S.notifReturn = existingStack[existingStack.length - 1];
        openDetail(taskId, { fromNotif: true });
        if (focusTimeline && timelineIndex !== null && Number.isInteger(timelineIndex)) {
          setTimeout(() => {
            const items = $$('.right-body .tl-i');
            const el = items[timelineIndex];
            if (el) {
              el.scrollIntoView({ block: 'center' });
              el.classList.add('tl-flash');
              setTimeout(() => el.classList.remove('tl-flash'), 1400);
            }
          }, 120);
        }
        return;
      }
      if (target) toast(`已定位到 ${target.name}`);
    };
    const renderList = () => {
      const list = $('#wsList', layer);
      const count = $('#wsCount', layer);
      if (!list) return;
      const q = query.toLowerCase();
      const rows = all.filter((t) => !q || `${t.id} ${t.title} ${t.worktree}`.toLowerCase().includes(q));
      rows.sort((a, b) => {
        if (sort === 'id') return a.id.localeCompare(b.id);
        if (sort === 'path') return String(a.worktree).localeCompare(String(b.worktree));
        return (statusOrder[a.status] ?? 9) - (statusOrder[b.status] ?? 9);
      });
      if (count) count.textContent = `${rows.length} 个`;
      visibleIds = rows.map((t) => t.id);
      const bulk = $('#wsBulk', layer);
      const bulkCount = $('#wsBulkCount', layer);
      if (bulk) bulk.hidden = selected.size === 0;
      if (bulkCount) bulkCount.textContent = `已选 ${selected.size} 个`;
      list.innerHTML = rows.length ? rows.map((t) => `<div class="ws-wt ${selected.has(t.id) ? 'sel' : ''}" data-ws-wt-id="${t.id}" data-ws-wt-path="${esc(t.worktree)}">
            <button class="ws-check ${selected.has(t.id) ? 'on' : ''}" data-ws-check="${t.id}" aria-pressed="${selected.has(t.id)}" title="选择 worktree">${I.check}</button>
            <button class="ws-wt-main" data-ws-task="${t.id}" data-ws-path="${esc(t.worktree)}" title="打开任务详情">
              <span class="ws-wt-status">${statusIcon(t.status)}</span><span class="ws-wt-id">${t.id}</span><span class="ws-wt-title" title="${esc(t.title)}">${esc(t.title)}</span><code>${esc(t.worktree)}</code>
            </button>
            <span class="ws-wt-actions">
              <button class="ws-icon" data-ws-copy-path="${esc(t.worktree)}" title="复制 worktree 路径">${I.copy}</button>
              <button class="ws-icon" data-ws-open="${t.id}" title="打开任务">${I.external}</button>
            </span>
          </div>`).join('') : '<div class="dp-empty">没有匹配的 worktree。</div>';
      $$('[data-ws-task]', list).forEach((b) => b.addEventListener('click', () => { closeModal(); openDetail(b.dataset.wsTask); }));
      $$('[data-ws-open]', list).forEach((b) => b.addEventListener('click', () => { closeModal(); openDetail(b.dataset.wsOpen); }));
      $$('[data-ws-copy-path]', list).forEach((b) => b.addEventListener('click', () => copy(b.dataset.wsCopyPath, 'worktree 路径')));
      $$('[data-ws-check]', list).forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = b.dataset.wsCheck;
        if (selected.has(id)) selected.delete(id); else selected.add(id);
        persistSelection();
        pendingFocus = id;
        renderList();
      }));
      $$('.ws-wt', list).forEach((row) => row.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        const t = all.find((x) => x.id === row.dataset.wsWtId);
        if (t) openWsContext(t, event, row);
      }));
      if (pendingFocus) {
        const main = $(`.ws-wt[data-ws-wt-id="${pendingFocus}"] .ws-wt-main`, list);
        main?.focus();
        pendingFocus = null;
      }
    };
    layer.addEventListener('keydown', (e) => {
      const mains = $$('.ws-wt-main', layer);
      if (!mains.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (e.target.closest('.ws-sort') || e.target.closest('.ws-ctx')) return;
        const idx = mains.indexOf(document.activeElement);
        const next = idx === -1 ? 0 : (e.key === 'ArrowDown' ? Math.min(mains.length - 1, idx + 1) : Math.max(0, idx - 1));
        e.preventDefault();
        mains[next].focus();
      } else if ((e.key === 'c' || e.key === 'C') && document.activeElement.classList.contains('ws-wt-main')) {
        e.preventDefault();
        const path = document.activeElement.dataset.wsPath;
        if (path) copy(path, 'worktree 路径');
      } else if (e.key === ' ' && document.activeElement.classList.contains('ws-wt-main')) {
        e.preventDefault();
        const id = document.activeElement.closest('.ws-wt')?.dataset.wsWtId;
        if (!id) return;
        if (selected.has(id)) selected.delete(id); else selected.add(id);
        persistSelection();
        pendingFocus = id;
        renderList();
      } else if ((e.metaKey || e.ctrlKey) && (e.key === 'a' || e.key === 'A') && !e.target.closest('input')) {
        e.preventDefault();
        selected = new Set(visibleIds);
        persistSelection();
        renderList();
      }
    });
    $$('[data-ws-bulk-copy]', layer).forEach((b) => b.addEventListener('click', () => {
      const paths = all.filter((t) => selected.has(t.id)).map((t) => t.worktree);
      if (paths.length) copy(paths.join('\n'), `${paths.length} 个 worktree`);
    }));
    $$('[data-ws-bulk-clear]', layer).forEach((b) => b.addEventListener('click', () => { selected = new Set(); persistSelection(); renderList(); $('.ws-wt-main', layer)?.focus(); }));
    $$('[data-ws-bulk-board]', layer).forEach((b) => b.addEventListener('click', () => {
      if (!selected.size) return;
      S.bulkFocus = new Set(selected);
      S.pane = 'board';
      S.rightOpen = true;
      S.detail = null;
      S.animateRight = true;
      closeModal();
      render();
      toast(`已在看板聚焦 ${selected.size} 个任务`);
    }));
    $('#wsSearch', layer)?.addEventListener('input', (e) => { query = e.target.value.trim(); renderList(); });
    $$('[data-ws-sort]', layer).forEach((b) => b.addEventListener('click', () => {
      sort = b.dataset.wsSort;
      $$('[data-ws-sort]', layer).forEach((x) => x.classList.toggle('on', x === b));
      renderList();
    }));
    renderList();
  }

      $$('.notif-row', list).forEach((row) => row.addEventListener('click', (e) => {

        let tip = null;
        const show = () => {
          if (!el.dataset.tip) return;
          tip = document.createElement('div');
          tip.className = 'ui-tip';
          tip.textContent = el.dataset.tip;
          document.body.appendChild(tip);
          const r = el.getBoundingClientRect();
          const w = tip.offsetWidth;
          const h = tip.offsetHeight;
          tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
          tip.style.top = (r.bottom + h + 8 > innerHeight - 8 ? r.top - h - 6 : r.bottom + 6) + 'px';
        };
        const hide = () => { tip?.remove(); tip = null; };
        el.addEventListener('mouseenter', show);
        el.addEventListener('mouseleave', hide);
        el.addEventListener('focus', show);
        el.addEventListener('blur', hide);
        el.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hide(); el.blur(); } });
      });
      $$('.notif-status', list).forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const row = b.closest('.notif-row');
        const n = S.notifications[Number(row?.dataset.notifIndex)];
        if (n) openNotifStatusMenu(n, b);
      }));
      $$('[data-notif-time]', list).forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        goTarget(b.closest('.notif-row'), true);
      }));
      $$('[data-notif-collapse]', list).forEach((b) => b.addEventListener('click', () => {

        S.notifCollapsed = [...collapsed];
        renderList();

    $('#notifGroupToggle', layer)?.addEventListener('click', (e) => {

      S.notifGroupMode = groupMode;
      e.currentTarget.textContent = groupMode === 'time' ? '按项目分组' : '按时间分组';
      renderList();
    });
    $('#notifCollapseAll', layer)?.addEventListener('click', () => {
      if (!currentGroups.length) return;
      const allCollapsed = currentGroups.every((b) => collapsed.has(b));
      currentGroups.forEach((b) => { if (allCollapsed) collapsed.delete(b); else collapsed.add(b); });
      S.notifCollapsed = [...collapsed];
      renderList();
    });
    $('#resetNotifCollapse', layer)?.addEventListener('click', () => {
      collapsed = new Set();
      S.notifCollapsed = [];
      renderList();

    const searchInput = $('#notifSearch', layer);

      if (searchClear) searchClear.hidden = !e.target.value;
      renderList();

    searchInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && e.target.value) {
        e.preventDefault(); e.stopPropagation();
        e.target.value = ''; query = '';
        if (searchClear) searchClear.hidden = true;
        renderList();
      }
    });
    searchClear?.addEventListener('click', () => {
      if (searchInput) { searchInput.value = ''; query = ''; searchInput.focus(); }
      searchClear.hidden = true;
      renderList();
    });
    $('#notifProject', layer)?.addEventListener('change', (e) => { projectFilter = e.target.value; renderList(); });
    layer.addEventListener('keydown', (e) => {
      const rows = $$('.notif-row', layer);
      if (!rows.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (e.target.closest('.notif-filters') || e.target.closest('.notif-project-select')) return;
        const idx = rows.indexOf(document.activeElement);
        const next = idx === -1 ? 0 : (e.key === 'ArrowDown' ? Math.min(rows.length - 1, idx + 1) : Math.max(0, idx - 1));
        e.preventDefault(); rows[next].focus();
      } else if (e.key === 'Enter' && document.activeElement.classList.contains('notif-row')) {
        e.preventDefault(); goTarget(document.activeElement);
      } else if ((e.key === 'c' || e.key === 'C') && document.activeElement.classList.contains('notif-row')) {
        e.preventDefault(); copy(document.activeElement.dataset.notifText, '通知');
      }
    });
    $$('[data-notif-filter]', layer).forEach((b) => b.addEventListener('click', () => {
      filter = b.dataset.notifFilter;
      $$('[data-notif-filter]', layer).forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
      renderList();
    }));
    $('#clearNotifHistory', layer)?.addEventListener('click', () => {
      const previous = S.notifications || [];
      if (!previous.length) return;
      S.notifications = [];
      renderList();
      toast('已清空通知历史', {
        label: '撤销',
        onClick: () => { S.notifications = previous; renderList(); toast('已恢复通知历史'); }
      });
    });
    renderList();
  }

      <div class="modal-head"><h3>聚焦任务</h3><span class="hint" id="focusListCount">${tasks.length} 个</span><button class="iconbtn sm x" data-close aria-label="关闭">${I.x}</button></div>
      <div class="modal-body">

        .filter((t) => !query || `${t.id} ${t.title}`.toLowerCase().includes(query));
      if (count) count.textContent = `${rows.length} 个`;

        <span class="fl-status">${statusIcon(t.status)}</span><span class="fl-id">${t.id}</span><span class="fl-title" title="${esc(t.title)}">${esc(t.title)}</span><span class="fl-state">${esc(ST[t.status].label)}</span>
      </button>`).join('') : `<div class="focus-empty"><div class="focus-empty-title">${tasks.length ? '没有匹配的聚焦任务' : '当前没有聚焦任务'}</div><div class="focus-empty-sub">${tasks.length ? '清除搜索或状态筛选后再看。' : '回到看板选择任务后再打开这里。'}</div>${tasks.length ? '<button type="button" data-focus-clear-filter>清除筛选</button>' : ''}</div>`;
      $$('[data-focus-list-task]', box).forEach((b) => b.addEventListener('click', () => {
        const id = b.dataset.focusListTask;
        closeModal();
        openDetail(id);
      }));
      $('[data-focus-clear-filter]', box)?.addEventListener('click', () => {
        query = '';
        filter = 'all';
        const input = $('#focusListSearch', layer);
        if (input) input.value = '';
        $$('[data-focus-filter]', layer).forEach((x) => { x.classList.toggle('on', x.dataset.focusFilter === 'all'); x.setAttribute('aria-pressed', String(x.dataset.focusFilter === 'all')); });
        renderRows();
      });
    };
    $('#focusListSearch', layer)?.addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); renderRows(); });
    $$('[data-focus-filter]', layer).forEach((b) => b.addEventListener('click', () => {
      filter = b.dataset.focusFilter;
      $$('[data-focus-filter]', layer).forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
      renderRows();
    }));

  function openCopyHistory() {
    const layer = openModal(`<div class="modal sm copy-history-modal" role="dialog" aria-modal="true" aria-label="复制历史">
      <div class="modal-head"><h3>复制历史</h3><span class="hint" id="copyCount"></span><button class="iconbtn sm x" data-close aria-label="关闭">${I.x}</button></div>
      <div class="modal-body">
        <div class="copy-toolbar">
          <input class="copy-search" id="copySearch" type="search" placeholder="搜索复制内容…" autocomplete="off" spellcheck="false" data-autofocus>
          <div class="copy-filters" role="group" aria-label="按来源筛选">
            ${[['all', '全部'], ['old', '旧值'], ['new', '新值'], ['list', '列表'], ['other', '其他']].map(([id, label]) => `<button class="trail-chip ${id === 'all' ? 'on' : ''}" data-copy-filter="${id}">${label}</button>`).join('')}
          </div>
        </div>
        <div id="copyList"></div>
      </div>
      <div class="modal-foot"><span class="hint">↑↓ 选择 · ↵ 复制</span><button class="btn ghost" id="clearCopyHistory">清空</button><button class="btn ghost" data-close>关闭</button></div>
    </div>`);
    let query = '';
    let source = 'all';
    let selected = null;
    let visible = [];
    let expanded = new Set();
    let compared = new Set();
    const groupOf = (label) => label === '旧值' ? 'old' : label === '新值' ? 'new' : (label.includes('列表') ? 'list' : 'other');
    const goTarget = (row, focusTimeline) => {
      document.querySelectorAll('.ui-tip').forEach((el) => el.remove());
      const projectId = row.dataset.notifProjectId;
      const taskId = row.dataset.notifTask;
      const target = DB.projects.find((x) => x.id === projectId);
      const timelineIndex = row.dataset.notifTimeIndex === '' ? null : Number(row.dataset.notifTimeIndex);
      const existingStack = (S.notifBack || []).slice();
      closeModal();
      if (projectId && S.active !== projectId) selectProject(projectId);
      if (taskId) {
        const last = existingStack[existingStack.length - 1];
        if (!last || last.taskId !== taskId) existingStack.push({ taskId, projectId });
        S.notifBack = existingStack;
        S.notifReturn = existingStack[existingStack.length - 1];
        openDetail(taskId, { fromNotif: true });
        if (focusTimeline && timelineIndex !== null && Number.isInteger(timelineIndex)) {
          setTimeout(() => {
            const items = $$('.right-body .tl-i');
            const el = items[timelineIndex];
            if (el) {
              el.scrollIntoView({ block: 'center' });
              el.classList.add('tl-flash');
              setTimeout(() => el.classList.remove('tl-flash'), 1400);
            }
          }, 120);
        }
        return;
      }
      if (target) toast(`已定位到 ${target.name}`);
    };
    const renderList = () => {
      const list = $('#copyList', layer);
      const count = $('#copyCount', layer);
      const clearBtn = $('#clearCopyHistory', layer);
      if (!list) return;
      visible = (S.copyHistory || []).map((c, i) => ({ c, i }))
        .filter(({ c }) => source === 'all' || groupOf(c.label) === source)
        .filter(({ c }) => !query || `${c.label} ${c.text}`.toLowerCase().includes(query));
      if (visible.length && !visible.some(({ i }) => i === selected)) selected = visible[0].i;
      if (!visible.length) selected = null;
      if (count) count.textContent = `${visible.length} 条`;
      if (clearBtn) clearBtn.disabled = !(S.copyHistory || []).length;
      const noHistory = !(S.copyHistory || []).length;
      list.innerHTML = visible.length ? visible.map(({ c, i }) => {
        const canExpand = c.text.length > 26 || c.text.includes('\n');
        const pairItem = c.pair ? (S.copyHistory || []).find((x) => x.pair === c.pair && x.label !== c.label) : null;
        const isOldSide = c.label === '旧值' || c.label === '移除列表';
        const showCompare = compared.has(i) && pairItem;
        const textHTML = expanded.has(i) && pairItem ? markDiff(c.text, pairItem.text) : esc(c.text);
        return `<div class="copy-hist-row ${selected === i ? 'sel' : ''}" data-copy-index="${i}">
        <div class="ch-main"><div class="ch-label">${esc(c.label)} <span>${esc(c.time)}</span></div>${showCompare ? `<div class="ch-compare-grid"><div class="ch-compare-col"><div class="ch-compare-head">${esc(c.label)}</div><div class="ch-compare-text">${markDiff(c.text, pairItem.text)}</div></div><div class="ch-compare-col"><div class="ch-compare-head">${esc(pairItem.label)}</div><div class="ch-compare-text">${markDiff(pairItem.text, c.text)}</div></div></div>` : `<div class="ch-text ${expanded.has(i) ? 'expanded' : ''}">${textHTML}</div>`}<div class="ch-actions">${canExpand ? `<button class="ch-action" data-expand-copy="${i}">${expanded.has(i) ? '收起' : '展开'}</button>` : ''}${isOldSide && pairItem ? `<button class="ch-action" data-compare-copy="${i}">${compared.has(i) ? '内联' : '并排'}</button>` : ''}</div></div>
        <button class="ch-copy" data-copy-again="${i}" title="再次复制">${I.copy}</button>
      </div>`;
      }).join('') : `<div class="dp-empty">${noHistory ? '还没有复制记录。' : '没有匹配的复制记录。'}</div>`;
      $$('[data-copy-again]', list).forEach((b) => b.addEventListener('click', () => {
        const item = S.copyHistory[Number(b.dataset.copyAgain)];
        if (item) copy(item.text, item.label).then(renderList);
      }));
      $$('[data-expand-copy]', list).forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = Number(b.dataset.expandCopy);
        if (expanded.has(idx)) expanded.delete(idx); else expanded.add(idx);
        renderList();
      }));
      $$('[data-compare-copy]', list).forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = Number(b.dataset.compareCopy);
        if (compared.has(idx)) compared.delete(idx); else { compared.add(idx); expanded.add(idx); }
        renderList();
      }));
      $$('.ch-compare-grid', list).forEach((grid) => {
        const cols = $$('.ch-compare-text', grid);
        let syncing = false;
        cols.forEach((col, idx) => {
          col.addEventListener('scroll', () => {
            if (syncing) return;
            const other = cols[1 - idx];
            if (!other) return;
            syncing = true;
            other.scrollTop = col.scrollTop;
            requestAnimationFrame(() => { syncing = false; });
          });
        });
      });
      $$('.copy-hist-row', list).forEach((row) => row.addEventListener('click', (e) => {
        if (e.target.closest('[data-copy-again]') || e.target.closest('[data-expand-copy]') || e.target.closest('[data-compare-copy]')) return;
        selected = Number(row.dataset.copyIndex);
        renderList();
      }));
      requestAnimationFrame(() => $('.copy-hist-row.sel', list)?.scrollIntoView({ block: 'nearest' }));
    };
    $('#copySearch', layer)?.addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); selected = null; resetClear(); renderList(); });
    $$('[data-copy-filter]', layer).forEach((b) => b.addEventListener('click', () => {
      source = b.dataset.copyFilter;
      selected = null;
      resetClear();
      $$('[data-copy-filter]', layer).forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
      renderList();
    }));
    layer.addEventListener('keydown', (e) => {
      if (!visible.length) return;
      const pos = Math.max(0, visible.findIndex(({ i }) => i === selected));
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const next = (pos + (e.key === 'ArrowDown' ? 1 : -1) + visible.length) % visible.length;
        selected = visible[next].i;
        renderList();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const item = S.copyHistory[selected];
        if (item) copy(item.text, item.label).then(renderList);
      } else if (e.key === ' ') {
        e.preventDefault();
        if (selected !== null && S.copyHistory[selected] && (S.copyHistory[selected].text.length > 26 || S.copyHistory[selected].text.includes('\n'))) {
          if (expanded.has(selected)) expanded.delete(selected); else expanded.add(selected);
          renderList();
        }
      }
    });
    let clearArmed = false;
    let clearTimer = null;
    const resetClear = () => {
      clearArmed = false;
      if (clearTimer) clearTimeout(clearTimer);
      clearTimer = null;
      const b = $('#clearCopyHistory', layer);
      if (b) { b.textContent = '清空'; b.classList.remove('danger'); }
    };
    $('#clearCopyHistory', layer)?.addEventListener('click', () => {
      const btn = $('#clearCopyHistory', layer);
      if (!clearArmed) {
        clearArmed = true;
        btn.textContent = '确认清空';
        btn.classList.add('danger');
        clearTimer = setTimeout(resetClear, 3000);
        return;
      }
      resetClear();
      const previous = S.copyHistory || [];
      S.copyHistory = [];
      selected = null;
      expanded = new Set();
      compared = new Set();
      renderList();
      toast('已清空复制历史', {
        label: '撤销',
        onClick: () => { S.copyHistory = previous; renderList(); toast('已恢复复制历史'); }
      });
    });
    renderList();
  }

      const name = b.dataset.pinEnv;
      const isDefault = storedEnv === name;
      if (isDefault) {
        try { localStorage.removeItem('dsh.projects.env'); } catch (e) { /* ignore */ }
        toast('已取消默认环境');
      } else {
        saveEnvPref(name);
        toast(`${name} 已设为默认`);
      }
      closeFloating();
      requestAnimationFrame(() => openEnv(anchor));
    }));
    $$('.env-use-row', el).forEach((row) => row.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const name = row.dataset.envRow;
      const isDefault = storedEnv === name;
      const isCurrent = S.env === name;
      const menu = openFloating(null, `<div class="menu-head">${esc(name)}</div>
        <button class="menu-item" data-env-ctx="default"><span class="mi">${I.pin}</span>${isDefault ? '取消默认' : '设为默认'}</button>
        <button class="menu-item" data-env-ctx="switch" ${isCurrent ? 'disabled' : ''}><span class="mi">${I.play}</span>${isCurrent ? '当前环境' : '切换到该环境'}</button>
        <button class="menu-item" data-env-ctx="workspace" ${ENVS.find((x) => x.name === name)?.workspace ? '' : 'disabled'}><span class="mi">${I.folder}</span>打开工作目录</button>
        <button class="menu-item" data-env-ctx="files"><span class="mi">${I.fileText}</span>在文件面板打开</button>
        <button class="menu-item" data-env-ctx="recheck"><span class="mi">${I.refresh}</span>重新检测</button>
        <button class="menu-item" data-env-ctx="history"><span class="mi">${I.clock}</span>检测历史</button>
        <button class="menu-item" data-env-ctx="copy"><span class="mi">${I.copy}</span>复制环境名</button>
      `, { point: { x: e.clientX, y: e.clientY }, className: 'pop ctx' });
      menu.setAttribute('role', 'menu');
      menu.tabIndex = -1;
      const items = $$('[data-env-ctx]', menu);
      const focusables = items.filter((x) => !x.disabled);
      const focusItem = (idx) => {
        items.forEach((x) => x.classList.remove('kbd-focus'));
        const item = focusables[(idx + focusables.length) % focusables.length];
        if (!item) return;
        item.classList.add('kbd-focus');
        item.focus();
      };
      menu.focus();
      requestAnimationFrame(() => focusItem(0));
      menu.addEventListener('keydown', (ev) => {
        const active = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-env-ctx]') : null;
        const idx = Math.max(0, focusables.indexOf(active));
        if (ev.key === 'ArrowDown') { ev.preventDefault(); focusItem(idx + 1); }
        else if (ev.key === 'ArrowUp') { ev.preventDefault(); focusItem(idx - 1); }
        else if (ev.key === 'Escape') { ev.preventDefault(); closeFloating(); requestAnimationFrame(() => openEnv(anchor)); }
      });
      $$('[data-env-ctx]', menu).forEach((b) => b.addEventListener('click', () => {
        const action = b.dataset.envCtx;
        if (action === 'default') {
          if (isDefault) { try { localStorage.removeItem('dsh.projects.env'); } catch (err) { /* ignore */ } toast('已取消默认环境'); }
          else { saveEnvPref(name); toast(`${name} 已设为默认`); }
          closeFloating();
          requestAnimationFrame(() => openEnv(anchor));
        } else if (action === 'switch') {
          closeFloating();
          S.env = name;
          saveEnvPref(name);
          recordEnvUsage(name);
          renderCenter();
          toast(`已切换到 ${name}`);
        } else if (action === 'workspace') {
          closeFloating();
          openEnvWorkspace(name);
        } else if (action === 'files') {
          closeFloating();
          S.rightOpen = true;
          S.pane = 'library';
          S.detail = null;
          S.animateRight = true;
          render();
          toast('已在文件面板打开');
        } else if (action === 'recheck') {
          closeFloating();
          checkEnvironment(name, (res) => {
            renderCenter();
            toast(res.ok ? `${name} 已恢复` : `检测失败 · ${res.env ? res.env.health : '连接超时'}`);
          });
        } else if (action === 'history') {
          closeFloating();
          openEnvironmentHistory();
        } else if (action === 'copy') {
          closeFloating();
          copy(name, '环境');
        }
      }));
    }));

    $('[data-env-history]', el)?.addEventListener('click', () => {
      closeFloating();
      openEnvironmentHistory();
    });
    $('[data-clear-env-pref]', el)?.addEventListener('click', () => {
      let previous = null;
      let previousUsage = null;
      try {
        previous = localStorage.getItem('dsh.projects.env');
        previousUsage = localStorage.getItem(ENV_USAGE_KEY);
        localStorage.removeItem('dsh.projects.env');
        localStorage.removeItem(ENV_USAGE_KEY);
      } catch (e) { /* ignore */ }
      ENVS.forEach((e) => { e.useCount = 0; e.lastUsed = '—'; e.lastUsedAt = 0; e.useOrder = 0; });
      closeFloating();
      toast('已清除环境记忆', previous || previousUsage ? {
        label: '撤销',
        onClick: () => {
          if (previous) saveEnvPref(previous);
          if (previousUsage) { try { localStorage.setItem(ENV_USAGE_KEY, previousUsage); } catch (e) { /* ignore */ } loadEnvUsage(); }
          toast('已恢复环境记忆');
        }
      } : undefined);
    });
    $('[data-check-env]', el)?.addEventListener('click', (e) => {
      const btn = e.currentTarget;
      const off = ENVS.find((x) => x.status === 'off');
      if (!off) { toast('环境都正常'); return; }
      btn.disabled = true;
      btn.textContent = '检测中…';
      checkEnvironment(off.name, (res) => {
        closeFloating();
        renderCenter();
        toast(res.ok ? `${off.name} 已恢复` : `检测失败 · ${res.env ? res.env.health : '连接超时'}`);
      });
    });
    $$('[data-env]', el).forEach((b) => b.addEventListener('click', () => {
      S.env = b.dataset.env;
      saveEnvPref(S.env);
      recordEnvUsage(S.env);
      S.focusComposer = true;
      closeFloating();
      renderCenter();
    }));
  }

  /* ---------- 弹窗 ---------- */
  function openModal(html) {
    closeModal();
    const layer = document.createElement('div');
    layer.className = 'overlay';
    layer.id = 'overlay';
    layer.innerHTML = html;
    $('#layers').appendChild(layer);
    layer.addEventListener('click', (e) => { if (e.target === layer) closeModal(); });
    $$('[data-close]', layer).forEach((b) => b.addEventListener('click', closeModal));
    trapFocus(layer);
    const focusTarget = $('[data-autofocus]', layer);
    if (focusTarget) setTimeout(() => { focusTarget.focus(); if (focusTarget.select) focusTarget.select(); }, 40);
    return layer;
  }

  function closeModal() {
    const l = $('#overlay');
    if (l) l.remove();
  }

  function trapFocus(layer) {
    layer.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const f = $$('button:not([disabled]), input:not([disabled]), [href], [tabindex]:not([tabindex="-1"])', layer)
        .filter((el) => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0];
      const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }

  function projectFormHTML(p) {
    const editing = !!p;
    const usedColors = new Set(DB.projects.map((x) => x.colorId));
    const firstFree = PROJECT_COLORS.find((c) => c.id !== 'gray' && !usedColors.has(c.id));
    const defaultColor = editing ? (PROJECT_COLOR_IDS.includes(p.colorId) ? p.colorId : 'gray') : (firstFree ? firstFree.id : 'gray');
    const defaultIcon = editing && PROJECT_MARKS[p.icon] ? p.icon : 'smileyPlus';
    const defaultCustom = editing && p.customIcon ? p.customIcon : '';
    const defaultLetter = editing && p.icon === 'letter' && !defaultCustom;
    const defaultFit = editing && p.customFit === 'cover' ? 'cover' : 'contain';
    const defaultZoom = editing && Number(p.customZoom) ? Math.max(1, Math.min(2.5, Number(p.customZoom))) : 1;
    const repos = new Set(p ? p.repos || [] : []);
    const members = new Set(p ? (p.members || ['veko']) : ['veko']);
    const defaultModel = editing ? (p.defaultModel || S.model) : S.model;
    const selectedRepos = Array.from(repos);
    const defaultPrimary = editing ? (p.primaryRepo || selectedRepos[0] || '') : (selectedRepos[0] || '');
    const defaultBranch = editing ? (p.defaultBranch || 'main') : 'main';
    const branchOptions = Array.from(new Set([...(editing ? (p.branches || []) : []), defaultBranch, ...BRANCHES]));
    const initialBranchCount = editing ? (p.branches || ['main']).length : 1;
    const initialRefs = editing ? refsMeta(p) : { stale: false, label: '未同步' };

    return `<div class="modal project-modal" role="dialog" aria-modal="true" aria-label="${editing ? '项目设置' : '新建项目'}">
      <div class="modal-head">
        <h3>${editing ? '项目设置' : '新建项目'}</h3>
        <button class="iconbtn sm x" data-close aria-label="关闭">${I.x}</button>
      </div>
      <div class="modal-body">
        <div class="project-preview" data-field="name">
          <span class="p-icon lg tint-${defaultColor} ${defaultCustom ? 'custom' : ''} ${defaultLetter ? 'letter' : ''}" id="pPreview">${defaultCustom ? customIconImg(defaultCustom, defaultFit, defaultZoom) : defaultLetter ? `<span>${esc((editing ? p.name : '').trim().charAt(0).toUpperCase() || 'P')}</span>` : projectMark(defaultIcon)}</span>
          <input id="pName" type="text" value="${editing ? esc(p.name) : ''}" placeholder="项目名称" autocomplete="off" spellcheck="false" data-autofocus>
        </div>

        <div class="field" data-field="icon">
          <label>图标</label>
          <div class="icon-grid tint-${defaultColor}" id="iconGrid">
            ${PROJECT_ICONS.map((o) => `<button type="button" class="icon-tile ${o.id === defaultIcon && !defaultCustom && !defaultLetter ? 'on' : ''}" data-icon-id="${o.id}" aria-label="${o.id}">
              <span class="p-icon sm">${o.svg}</span>
            </button>`).join('')}
          </div>
          <div class="icon-custom">
            <button type="button" class="icon-letter ${defaultLetter ? 'on' : ''}" id="letterBtn"><span class="letter-a">Aa</span>字母标</button>
            <button type="button" class="icon-upload" id="iconUploadBtn">${I.image}上传自定义图标</button>
            <span class="icon-custom-hint">PNG / JPG / SVG，≤ 200KB</span>
            <button type="button" class="icon-clear" id="iconClearBtn" ${defaultCustom ? '' : 'hidden'}>移除</button>
          </div>
          <div class="custom-tune" id="customTune" ${defaultCustom ? '' : 'hidden'}>
            <div class="ct-fit" role="group" aria-label="裁切方式">
              <button type="button" data-fit="contain" class="${defaultFit === 'contain' ? 'on' : ''}">完整</button>
              <button type="button" data-fit="cover" class="${defaultFit === 'cover' ? 'on' : ''}">填满</button>
            </div>
            <label class="ct-zoom">缩放 <input type="range" id="ctZoom" min="1" max="2.5" step="0.1" value="${defaultZoom}"><span class="ct-zoom-val" id="ctZoomVal">${Math.round(defaultZoom * 100)}%</span></label>
          </div>
          <input type="file" id="iconFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
        </div>

        <div class="field" id="colorField" data-field="icon" ${defaultCustom ? 'hidden' : ''}>
          <label>颜色</label>
          <div class="color-row">
            ${PROJECT_COLORS.map((c) => `<button type="button" class="color-dot tint-${c.id} ${c.id === defaultColor ? 'on' : ''}" data-color-id="${c.id}" aria-label="${c.label}" title="${c.label}"></button>`).join('')}
          </div>
        </div>

        <div class="field" data-field="goal">
          <label>目标 <span class="opt">可选</span></label>
          <input id="pGoal" type="text" value="${editing ? esc(p.goal) : ''}" placeholder="一句话说明要达成什么" autocomplete="off" spellcheck="false">
        </div>

        <div class="field" data-field="model">
          <label>默认模型 <span class="opt">新任务使用</span></label>
          <select id="pModel">
            ${MODELS.map((m) => `<option value="${esc(m.name)}" ${m.name === defaultModel ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
          </select>
        </div>

        <div class="field" data-field="members">
          <label>成员 <span class="opt">已选 <b id="memberCount">${members.size}</b></span></label>
          <div class="member-grid">
            ${AGENTS.map((a) => `<button type="button" class="member-chip ${members.has(a.id) ? 'on' : ''}" data-member="${a.id}" aria-pressed="${members.has(a.id)}" title="${esc(a.label)} · ${esc(a.role)}">
              <span class="mini-ava" style="--av:${a.color}">${esc(a.label.charAt(0).toUpperCase())}</span>
              <span class="mc-name">${esc(a.label)}</span>
              <span class="mc-role">${esc(a.role)}</span>
              <span class="mc-check">${I.check}</span>
            </button>`).join('')}
          </div>
        </div>

        <div class="field" data-field="repos">
          <label>仓库 <span class="opt">已选 <b id="repoCount">${repos.size}</b></span></label>
          <div class="repo-list" id="repoList">
            ${REPOS.map((r) => `<div class="repo ${repos.has(r) ? 'on' : ''}" data-repo="${r}" role="checkbox" aria-checked="${repos.has(r)}" tabindex="0">
              <span class="box">${I.check}</span><span class="rn">${r}</span><span class="rt">本地</span>
            </div>`).join('')}
          </div>
        </div>

        <div class="field-pair">
          <div class="field" data-field="primary">
            <label>主仓库</label>
            <select id="pPrimary">${selectedRepos.length ? selectedRepos.map((r) => `<option value="${esc(r)}" ${r === defaultPrimary ? 'selected' : ''}>${esc(r)}</option>`).join('') : '<option value="">未选择仓库</option>'}</select>
          </div>
          <div class="field" data-field="branch">
            <label>默认分支</label>
            <input id="pBranch" type="text" value="${esc(defaultBranch)}" placeholder="main" autocomplete="off" spellcheck="false" list="branchList">
            <datalist id="branchList">${branchOptions.map((b) => `<option value="${esc(b)}"></option>`).join('')}</datalist>
          </div>
        </div>

        <div class="refs-row" data-field="branches">
          <span class="refs-count" id="refsCount">${initialBranchCount} 个分支 refs</span>
          <span class="refs-time ${initialRefs.stale ? 'stale' : ''}" id="refsTime">${esc(initialRefs.label)}${initialRefs.stale ? ' · 可能过期' : ''}</span>
          <button type="button" class="refs-manage" id="refsManage" ${editing ? '' : 'disabled'}>管理</button>
          <button type="button" class="refs-sync" id="refsSync">${I.refresh}同步</button>
        </div>
      </div>
      <div class="modal-foot">
        <span class="hint">${editing ? '保存后立即生效' : '可以稍后关联仓库'}</span>
        <button class="btn ghost" data-close>取消</button>
        <button class="btn primary" id="pSave">${editing ? '保存' : '创建'}</button>
      </div>
    </div>`;
  }

  function openProjectForm(p, focusField, focusFields) {
    const editing = !!p;
    const layer = openModal(projectFormHTML(p));
    const nameInput = $('#pName', layer);
    const goalInput = $('#pGoal', layer);
    const modelSelect = $('#pModel', layer);
    const primarySelect = $('#pPrimary', layer);
    const branchInput = $('#pBranch', layer);
    let formBranches = editing ? Array.from(new Set([...(p.branches || []), p.defaultBranch || 'main', 'main'])) : ['main'];
    const save = $('#pSave', layer);
    const preview = $('#pPreview', layer);
    const initialIcon = ($('.icon-tile.on', layer) || {}).dataset ? $('.icon-tile.on', layer).dataset.iconId : (editing && p.icon === 'letter' ? 'letter' : (editing && p.icon && PROJECT_MARKS[p.icon] ? p.icon : 'smileyPlus'));
    const initialColor = ($('.color-dot.on', layer) || {}).dataset ? $('.color-dot.on', layer).dataset.colorId : 'gray';
    const initialFit = editing && p.customFit === 'cover' ? 'cover' : 'contain';
    const initialZoom = editing && Number(p.customZoom) ? Math.max(1, Math.min(2.5, Number(p.customZoom))) : 1;
    const initialPrimary = editing ? (p.primaryRepo || (p.repos || [])[0] || '') : '';
    const pick = { iconId: initialIcon, colorId: initialColor, customIcon: editing && p.customIcon ? p.customIcon : null, customFit: initialFit, customZoom: initialZoom, members: new Set(p ? (p.members || ['veko']) : ['veko']), repos: new Set(p ? p.repos || [] : []), primaryRepo: initialPrimary };

    const syncPreview = () => {
      if (!preview) return;
      const isLetter = pick.iconId === 'letter' && !pick.customIcon;
      const initial = (nameInput.value.trim().charAt(0) || 'P').toUpperCase();
      preview.className = 'p-icon lg tint-' + pick.colorId + (pick.customIcon ? ' custom' : '') + (isLetter ? ' letter' : '');
      preview.innerHTML = pick.customIcon ? customIconImg(pick.customIcon, pick.customFit, pick.customZoom)
        : isLetter ? `<span>${esc(initial)}</span>` : projectMark(pick.iconId);
      const clear = $('#iconClearBtn', layer);
      if (clear) clear.hidden = !pick.customIcon;
      const cf = $('#colorField', layer);
      if (cf) cf.hidden = !!pick.customIcon;
      const lb = $('#letterBtn', layer);
      if (lb) lb.classList.toggle('on', isLetter);
      const tune = $('#customTune', layer);
      if (tune) tune.hidden = !pick.customIcon;
      $$('[data-fit]', layer).forEach((b) => b.classList.toggle('on', b.dataset.fit === pick.customFit));
      const zr = $('#ctZoom', layer);
      if (zr) zr.value = String(pick.customZoom);
      const zv = $('#ctZoomVal', layer);
      if (zv) zv.textContent = Math.round(pick.customZoom * 100) + '%';
    };

    const syncPrimary = () => {
      if (!primarySelect) return;
      const selected = Array.from(pick.repos);
      const current = primarySelect.value;
      if (!selected.length) {
        primarySelect.innerHTML = '<option value="">未选择仓库</option>';
        return;
      }
      primarySelect.innerHTML = selected.map((r) => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
      primarySelect.value = selected.includes(current) ? current : selected[0];
      pick.primaryRepo = primarySelect.value;
    };

    $$('[data-fit]', layer).forEach((b) => b.addEventListener('click', () => {
      pick.customFit = b.dataset.fit === 'cover' ? 'cover' : 'contain';
      syncPreview();
    }));
    $('#ctZoom', layer)?.addEventListener('input', (e) => {
      pick.customZoom = Math.max(1, Math.min(2.5, Number(e.target.value) || 1));
      syncPreview();
    });

    $$('[data-icon-id]', layer).forEach((b) => b.addEventListener('click', () => {
      $$('[data-icon-id]', layer).forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      pick.iconId = b.dataset.iconId;
      pick.customIcon = null;
      syncPreview();
    }));
    $('#letterBtn', layer)?.addEventListener('click', () => {
      $$('[data-icon-id]', layer).forEach((x) => x.classList.remove('on'));
      pick.iconId = 'letter';
      pick.customIcon = null;
      syncPreview();
    });

    $$('[data-color-id]', layer).forEach((b) => b.addEventListener('click', () => {
      $$('[data-color-id]', layer).forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      pick.colorId = b.dataset.colorId;
      const grid = $('#iconGrid', layer);
      if (grid) grid.className = 'icon-grid tint-' + pick.colorId;
      syncPreview();
    }));

    const fileInput = $('#iconFile', layer);
    const uploadBtn = $('#iconUploadBtn', layer);
    uploadBtn?.addEventListener('click', () => fileInput?.click());
    fileInput?.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) { toast('请选择图片文件'); fileInput.value = ''; return; }
      if (file.size > 200 * 1024) { toast('图片不能超过 200KB'); fileInput.value = ''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        pick.customIcon = String(reader.result || '');
        pick.customFit = 'contain';
        pick.customZoom = 1;
        $$('[data-icon-id]', layer).forEach((x) => x.classList.remove('on'));
        syncPreview();
        toast('已选择自定义图标');
      };
      reader.onerror = () => toast('图片读取失败');
      reader.readAsDataURL(file);
    });
    $('#iconClearBtn', layer)?.addEventListener('click', () => {
      pick.customIcon = null;
      pick.customFit = 'contain';
      pick.customZoom = 1;
      const first = $('[data-icon-id]', layer);
      if (first) first.classList.add('on');
      if (first) pick.iconId = first.dataset.iconId;
      syncPreview();
    });

    $$('[data-member]', layer).forEach((b) => b.addEventListener('click', () => {
      const on = !b.classList.contains('on');
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
      if (on) pick.members.add(b.dataset.member); else pick.members.delete(b.dataset.member);
      const mc = $('#memberCount', layer);
      if (mc) mc.textContent = String(pick.members.size);
    }));

    $$('[data-repo]', layer).forEach((row) => {
      const toggle = () => {
        const on = !row.classList.contains('on');
        row.classList.toggle('on', on);
        row.setAttribute('aria-checked', String(on));
        const r = row.dataset.repo;
        if (on) pick.repos.add(r); else pick.repos.delete(r);
        const rc = $('#repoCount', layer);
        if (rc) rc.textContent = String(pick.repos.size);
        syncPrimary();
      };
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });

    const renderBranchRefs = () => {
      const dl = $('#branchList', layer);
      if (dl) dl.innerHTML = Array.from(new Set([...formBranches, branchInput.value.trim()].filter(Boolean))).map((b) => `<option value="${esc(b)}"></option>`).join('');
      const count = $('#refsCount', layer);
      if (count) count.textContent = formBranches.length + ' 个分支 refs';
    };
    $('#refsSync', layer)?.addEventListener('click', () => {
      const extras = REF_EXTRA[editing ? p.id : '_default'] || REF_EXTRA._default;
      formBranches = Array.from(new Set([...formBranches, ...extras]));
      if (editing) {
        p.branches = [...formBranches];
        p.refsUpdated = '刚刚';
        p.refsAgeMin = 0;
        logProjectEvent(p, `同步 refs · ${formBranches.length} 个分支`, 'work', 'refs');
      }
      const time = $('#refsTime', layer);
      if (time) { time.textContent = '刚刚'; time.classList.remove('stale'); }
      renderBranchRefs();
      toast(`已同步 ${formBranches.length} 个分支`);
    });
    branchInput?.addEventListener('change', renderBranchRefs);
    $('#refsManage', layer)?.addEventListener('click', () => { closeModal(); openBranchManager(p); });

    const updateSave = () => { save.disabled = !nameInput.value.trim(); };
    nameInput.addEventListener('input', () => { updateSave(); nameInput.classList.remove('invalid'); syncPreview(); });
    updateSave();

    const commit = () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.classList.add('invalid'); nameInput.focus(); return; }
      const goal = goalInput.value.trim();
      const repos = Array.from(pick.repos);
      if (editing) {

    if (focusField) {
      const labels = { name: '项目名称', goal: '目标', icon: '图标', members: '成员', repos: '仓库', model: '默认模型', primary: '主仓库', branch: '默认分支', branches: '分支 refs' };
      const order = ['name', 'icon', 'goal', 'model', 'members', 'repos', 'primary', 'branch', 'branches'];
      const changed = Array.from(new Set((focusFields || []).filter((f) => order.includes(f))));
      const cycle = changed.length ? order.filter((f) => changed.includes(f)) : [...order];
      const map = { name: '#pName', goal: '#pGoal', icon: '#iconGrid', members: '.member-grid', repos: '#repoList', model: '#pModel', primary: '#pPrimary', branch: '#pBranch', branches: '#refsSync' };
      let current = order.includes(focusField) ? focusField : cycle[0];
      if (!cycle.includes(current)) cycle.push(current);
      const hint = document.createElement('div');
      hint.className = 'jump-hint';
      hint.innerHTML = `<span class="jump-hint-text">${I.focus}已定位到「${esc(labels[current] || current)}」${changed.length > 1 ? ` · 本次 ${changed.length} 项` : ''}</span><span class="jump-hint-nav"><button type="button" data-only-changed>仅看变更</button><button type="button" data-focus-prev>上一项</button><button type="button" data-focus-next>下一项</button><button type="button" class="jump-hint-close" data-focus-close aria-label="关闭定位提示">${I.x}</button></span>`;
      layer.querySelector('.modal-body')?.prepend(hint);
      const modal = layer.querySelector('.project-modal');
      $$('[data-field]', layer).forEach((el) => { if (changed.includes(el.dataset.field)) el.classList.add('changed-field'); });
      const onlyBtn = $('[data-only-changed]', hint);
      let onlyChanged = false;
      if (changed.length) {
        onlyBtn?.addEventListener('click', () => {
          onlyChanged = !onlyChanged;
          modal?.classList.toggle('only-changed', onlyChanged);
          if (onlyBtn) onlyBtn.textContent = onlyChanged ? '显示全部' : '仅看变更';
        });
      }
      const applyFocus = () => {
        const text = $('.jump-hint-text', hint);
        if (text) text.innerHTML = `${I.focus}已定位到「${esc(labels[current] || current)}」${changed.length > 1 ? ` · 本次 ${changed.length} 项` : ''}`;
        const target = $(map[current] || '', layer);
        if (!target) return;
        target.scrollIntoView({ block: 'center' });
        const focusable = target.matches('input, select, button') ? target : target.querySelector('input, select, button');
        focusable?.focus();
        target.classList.remove('field-flash');
        void target.offsetWidth;
        target.classList.add('field-flash');
        setTimeout(() => target.classList.remove('field-flash'), 1400);
      };
      const step = (delta) => {
        const idx = cycle.indexOf(current);
        current = cycle[(idx + delta + cycle.length) % cycle.length];
        applyFocus();
      };
      $('[data-focus-prev]', hint)?.addEventListener('click', () => step(-1));
      $('[data-focus-next]', hint)?.addEventListener('click', () => step(1));
      $('[data-focus-close]', hint)?.addEventListener('click', () => hint.remove());
      if (!changed.length) $('[data-only-changed]', hint)?.setAttribute('hidden', '');
      if (cycle.length <= 1) { $('[data-focus-prev]', hint)?.setAttribute('hidden', ''); $('[data-focus-next]', hint)?.setAttribute('hidden', ''); }
      setTimeout(applyFocus, 80);
    }

    save.addEventListener('click', commit);
    layer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.target === nameInput || e.target === goalInput)) {
        e.preventDefault(); commit();
      }
    });
  }

  function selectProject(id) {
    if (!DB.projects.some((p) => p.id === id)) return;
    if (S.active === id && !S.detail) return;
    const p = DB.projects.find((x) => x.id === id);
    let prevProject = null;
    let prevSelection = null;
    let prevFocus = null;
    if (S.active && S.active !== id) {
      prevProject = S.active;
      if (S.wsSelection) {
        prevSelection = S.wsSelection[prevProject] || null;
        delete S.wsSelection[prevProject];
      }
      prevFocus = S.bulkFocus ? new Set(S.bulkFocus) : null;
      S.bulkFocus = null;
    }
    S.notifReturn = null;
    S.notifBack = [];
    p.unread = false;
    S.active = id;
    S.detail = null;
    S.peek = null;
    S.pane = 'list';
    S.filter = null;
    S.tray = false;
    S.logFor = null;
    S.searchOpen = false;
    S.expandedWork = {};
    S.expandedProcess = {};
    S.expandedGroups = {};
    S.expandedThoughts = {};
    S.feedback = {};
    S.centerView = 'chat';
    S.folders = {};
    S.newTask = null;

              if (prevFocus && S.active === prevProject) S.bulkFocus = prevFocus;
              render();
              toast('已恢复上一项目的选中');

      });

  }

  function confirmProjectSwitch(target, onConfirm, opts) {
    const previewMode = !!(opts && opts.preview);
    const tasks = target.tasks || [];
    const active = tasks.filter((t) => t.status !== 'done' && t.status !== 'canceled').length;
    const perPage = 4;
    let page = 0;
    const layer = openModal(`<div class="modal sm project-switch-modal" role="dialog" aria-modal="true" aria-label="项目预览">
      <div class="modal-head"><h3>${previewMode ? '项目预览' : '切换项目'}</h3><span class="hint">${tasks.length} 个任务</span><button class="iconbtn sm x" data-close aria-label="关闭">${I.x}</button></div>
      <div class="modal-body">
        <div class="ps-preview">${projectBadge(target, 'sm')}<div class="ps-title"><div class="nm">${esc(target.name)}</div><div class="goal">${esc(target.goal || '暂无项目目标')}</div></div></div>
        <div class="ps-meta"><span>${active} 个进行中</span><span>${tasks.length - active} 个已结束</span></div>
        <div class="ps-recent"><div class="ps-recent-head"><span class="menu-head">任务</span><span class="ps-pages" id="psPages"></span><span class="ps-speed" id="psSpeed" hidden></span><span class="sr-only" id="psSpeedLive" aria-live="polite" aria-atomic="true"></span><button type="button" class="ps-pager" data-ps-prev aria-label="上一页">‹</button><button type="button" class="ps-pager" data-ps-next aria-label="下一页">›</button></div><div id="psTaskList"></div></div>
      </div>
      <div class="modal-foot">${tasks.length > perPage ? '<span class="hint">← → 翻页 · 按住加速</span>' : ''}${previewMode ? '<button class="btn ghost" data-close>关闭</button>' : '<button class="btn ghost" data-close>取消</button><button class="btn primary" id="confirmProjectSwitch">切换</button>'}</div>
    </div>`);
    const bindTasks = () => {
      $$('[data-ps-task]', layer).forEach((b) => b.addEventListener('click', () => {
        const taskId = b.dataset.psTask;
        closeModal();
        if (S.active !== target.id) selectProject(target.id);
        S.notifBack = [{ taskId, projectId: target.id, fromPreview: true }];
        S.notifReturn = { taskId, projectId: target.id, fromPreview: true };
        openDetail(taskId, { fromNotif: true });
      }));
    };
    const renderPage = () => {
      const pages = Math.max(1, Math.ceil(tasks.length / perPage));
      page = Math.max(0, Math.min(page, pages - 1));
      const slice = tasks.slice(page * perPage, (page + 1) * perPage);
      const list = $('#psTaskList', layer);
      if (list) list.innerHTML = slice.length ? slice.map((t) => `<button type="button" class="ps-task" data-ps-task="${t.id}"><span class="ps-status">${statusIcon(t.status)}</span><span class="ps-id">${t.id}</span><span class="ps-t">${esc(t.title)}</span><span class="ps-st">${esc(ST[t.status].label)}</span></button>`).join('') : '<div class="dp-empty">还没有任务。</div>';
      const pagesEl = $('#psPages', layer);
      if (pagesEl) {
        const items = [];
        if (pages <= 5) {
          for (let i = 0; i < pages; i++) items.push(i);
        } else {
          const keep = [...new Set([0, pages - 1, page - 1, page, page + 1].filter((i) => i >= 0 && i < pages))].sort((a, b) => a - b);
          let last = null;
          keep.forEach((i) => { if (last !== null && i - last > 1) items.push('…'); items.push(i); last = i; });
        }
        pagesEl.innerHTML = items.map((i) => i === '…'
          ? '<span class="ps-page-ellipsis">…</span>'
          : `<button type="button" class="ps-page-btn ${i === page ? 'on' : ''}" data-ps-page="${i}" aria-label="第 ${i + 1} 页">${i + 1}</button>`).join('');
        $$('[data-ps-page]', pagesEl).forEach((b) => b.addEventListener('click', () => { page = Number(b.dataset.psPage); renderPage(); }));
      }
      const prev = $('[data-ps-prev]', layer);
      const next = $('[data-ps-next]', layer);
      if (prev) prev.disabled = page <= 0;
      if (next) next.disabled = page >= pages - 1;
      bindTasks();
      const modalEl = layer.querySelector('.modal');
      if (modalEl) { modalEl.tabIndex = -1; modalEl.focus({ preventScroll: true }); }
    };
    $('[data-ps-prev]', layer)?.addEventListener('click', () => { page -= 1; renderPage(); });
    $('[data-ps-next]', layer)?.addEventListener('click', () => { page += 1; renderPage(); });
    let holdTimer = null;
    let holdDir = 0;
    let holdSpeed = 140;
    const updateSpeed = () => {
      const badge = $('#psSpeed', layer);
      if (!badge) return;
      if (!S.speedFeedback || !holdDir) { badge.hidden = true; return; }
      const tier = holdSpeed >= 130 ? 1 : (holdSpeed >= 110 ? 2 : 3);
      const text = `${tier}×`;
      badge.hidden = false;
      badge.title = `翻页速率 ${tier} 倍`;
      const prevTier = badge.dataset.tier;
      badge.dataset.tier = String(tier);
      const speedLive = $('#psSpeedLive', layer);
      if (speedLive && prevTier !== String(tier)) speedLive.textContent = `翻页速率 ${tier} 倍`;
      if (badge.textContent !== text) {
        badge.textContent = text;
        badge.classList.remove('bump');
        void badge.offsetWidth;
        badge.classList.add('bump');
        setTimeout(() => badge.classList.remove('bump'), 200);
      }
    };
    const stopHold = () => {
      if (holdTimer) clearTimeout(holdTimer);
      holdTimer = null;
      holdDir = 0;
      updateSpeed();
    };
    const stepPage = (dir) => {
      const pages = Math.max(1, Math.ceil(tasks.length / perPage));
      const next = Math.max(0, Math.min(pages - 1, page + dir));
      if (next !== page) { page = next; renderPage(); }
    };
    const repeatTick = (dir) => {
      if (!layer.isConnected) { stopHold(); return; }
      stepPage(dir);
      holdSpeed = Math.max(80, holdSpeed - 10);
      updateSpeed();
      holdTimer = setTimeout(() => repeatTick(dir), holdSpeed);
    };
    layer.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      if (e.repeat) return;
      if (holdDir === dir) return;
      stopHold();
      holdDir = dir;
      stepPage(dir);
      holdSpeed = 140;
      updateSpeed();
      holdTimer = setTimeout(() => repeatTick(dir), 380);
    });
    layer.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); stopHold(); }
    });
    $('#confirmProjectSwitch', layer)?.addEventListener('click', () => { closeModal(); onConfirm(); });
    renderPage();
  }

  function activateNotifStack(next) {
    const prev = next[next.length - 1];
    if (!prev) return;
    const apply = () => {
      if (prev.projectId) selectProject(prev.projectId);
      S.notifBack = next;
      S.notifReturn = prev;
      openDetail(prev.taskId, { fromNotif: true });
    };
    if (prev.projectId && S.active !== prev.projectId) {
      const target = DB.projects.find((x) => x.id === prev.projectId);
      if (target) { confirmProjectSwitch(target, apply); return; }
    }
    apply();
  }

  function setPane(pane) {
    if (S.pane === pane && !S.detail) return;
    S.newTask = null;
    S.taskEdit = null;
    S.pane = pane;
    S.detail = null;
    S.logFor = null;
    S.scrollRightTop = true;

    renderRight();
